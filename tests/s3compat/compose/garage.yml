# Garage needs post-start steps (layout assign/apply + key import + bucket
# create); run ./garage-init.sh <project> after "up".
services:
  s3:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    ports: ["39040:3900"]
