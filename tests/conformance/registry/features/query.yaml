  highlight: >-
    **`field_values` over map-stored attributes** returns the attribute's own values and hits, and counts rows without the field as the empty value, equal to hot VL/VT; `stream_field_values` never lists it.
  description: >-
    field_values (and the filters of a field_values request) over an attribute stored in an attribute
    MAP column answers with that attribute's own values and hits, equal to hot VictoriaLogs/VictoriaTraces,
    on both binaries. A row without the field is one hit of the empty value, as upstream's uniq counts it;
    stream_field_values lists the tags of the matching streams only (a non-stream field answers nothing, never the empty value); the substring filter applies
    before the limit. The scan reads MAP columns through the query path's reader (only the requested keys)
    and addresses every other column by its leaf index.
