- id: lh.feature.query.live_tail_unsupported
  title: Live tail answers as documented rather than silently
  status: shipped
  since: v0.18.2
  area: query
  surfaces: [api]
  rows: [vl.select.tail.unsupported, vt.select.tail.unsupported]
  docs:
    - docs/parity-and-gaps.md
  highlight: >-
    **Live tail**: `/select/logsql/tail` is answered with an explicit documented status on the cold tier instead of hanging or returning an empty stream — cold storage is write-once-read-many, so tailing a flushed archive has no meaning.
  description: >-
    Upstream's live tail streams from the hot ingestion path. Rather than emulate it badly, the
    cold tier refuses it explicitly and the refusal is a declared registry row, so the behavior is
    a documented contract instead of an accident a user discovers in production. Both binaries
    behave the same way.
  notes: >-
    Verified only by declared (pending) registry rows today — it appears in the verification-gap
    list until the conformance runner executes them.

- id: lh.feature.query.buffer_visible_after_restart
  title: Rows buffered after a graceful restart are visible from the first query
  status: shipped
  area: query
  surfaces: [api, storage]
  rows: [lh.select.restart.same_hour_buffer_visible_logs, lh.select.restart.same_hour_buffer_visible_traces, lh.select.restart.downtime_beyond_guard_compaction_logs, lh.select.restart.downtime_beyond_guard_compaction_traces]
  tests:
    - internal/storage/parquets3/buffer_restart_test.go
    - internal/storage/parquets3/inferred_bounds_test.go
    - internal/storage/parquets3/bounds_resolve_test.go
    - internal/manifest/bounds_inferred_test.go
    - cmd/lakehouse-logs/shutdown_snapshot_test.go
    - lakehouse-traces/internal/storage/parquets3/buffer_restart_test.go
    - lakehouse-traces/internal/storage/parquets3/inferred_bounds_test.go
    - lakehouse-traces/internal/storage/parquets3/bounds_resolve_test.go
    - lakehouse-traces/shutdown_snapshot_test.go
  docs:
    - docs/durability.md#22-restart-and-the-read-handoff
    - docs/read-path.md
  highlight: >-
    **Restart-safe read handoff**: after a restart, rows ingested in the same UTC hour as the data written at shutdown are visible exactly once from the first query — there is no time boundary between the buffer and Parquet to get wrong (the objects of a served buffer segment are dropped by their segment nonce), and the shutdown manifest snapshot is saved again after the final flush.
  description: >-
    Every object a buffer segment writes carries the segment's nonce in its key. A query takes a
    snapshot of the live segments (or, on a select pod, the rows and nonces each insert pod
    returns) before it lists objects, serves the segments' rows from the buffer and drops their
    objects from the scan, so each row comes from exactly one place before, during and after
    the drain and no time boundary is computed. An object the manifest knows only from a listing
    has no recorded range, so its range is inferred from the partition hour and marked as
    inferred; it is good enough to prune but is never answered from metadata, and the startup
    warmup replaces it with the exact range from the pmeta facet or the Parquet footer
    statistics (one bounded, backed-off ranged read). Shutdown persists the manifest again
    after the final flush so the next boot starts with exact ranges. Verified for both binaries
    across restart, hour-boundary and previous-hour cases, a peer's flush learned by listing, and a
    random write/flush/restart property test.
  notes: >-
    The Grafana-level check is tests/playwright/tests/restart-buffer-visibility.spec.ts, run against a
    stack seeded by scripts/bench/restart-ab/seed.py (not wired into CI yet); the A/B perf and
    correctness smoke is scripts/bench/restart-ab/perf_smoke.py.

