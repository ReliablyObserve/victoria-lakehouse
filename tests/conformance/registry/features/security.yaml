    - lh.internal.peer_auth.body_cap_traces
  docs:
    - docs/security.md
    - docs/configuration.md
  changelog_bullets:
    - "Optional peer authentication of the pods' internal endpoints, off by default (no change with the default settings)."
  highlight: >-
    **Optional peer authentication**: off by default, so nothing changes until it is switched on. `peer.auth_enabled` makes the pods refuse a request without the shared peer key on their internal write endpoints (manifest update, cache clear, stats and tenant sync) and on the peer cache and buffer query; the key comes from a Kubernetes Secret and the process will not start enabled without one. The key is sent whenever it is set, so a rolling restart configures it first and enforces it second.
  description: >-
    Upstream protects its internal endpoints by the network only. Lakehouse adds mutating internal
    endpoints of its own on the client port, so an opt-in credential closes the case where the
    network is not enough, without changing the default for anyone. Enforcement and the key are
    separate settings so a fleet can move to it without a flag day. Constant-time comparison and
    capped request bodies are always on because neither can refuse a legitimate peer.

- id: lh.feature.security.cross_signal_auth
  title: Cross-signal hint authentication
  status: shipped
  since: v0.18.1
  area: security
  readme_section: Cross-Signal Prefetch
  surfaces: [api, flag]
  tests:
    - internal/crosssignal/handler_test.go#TestEvictHintHandler_NoAuthKey_AllowAll
    - internal/crosssignal/handler_test.go#TestEvictHintHandler_ValidRequest
  docs:
    - docs/security.md
    - docs/configuration.md
  highlight: >-
    **Auth key support**: optional `X-Cross-Signal-Key` header for securing cross-deployment communication.
  description: >-
    Logs and traces deployments exchange hints across deployment boundaries, which may not share
    a trust domain. The key is optional so a single-tenant lab stays simple, and enforced
    everywhere it is set.

- id: lh.feature.security.ssrf_guard
  title: S3 endpoint SSRF guard
  status: shipped
  since: v0.18.2
  area: security
  surfaces: [flag]
  tests:
    - internal/config/config_security_test.go#TestValidate_S3EndpointSSRF
    - internal/config/config_security_test.go#TestValidate_S3EndpointInternalNetworks
    - internal/config/config_security_test.go#TestValidate_S3EndpointScheme
  docs:
    - docs/security.md
  highlight: >-
    **SSRF guard**: a custom S3 endpoint is validated before use — scheme restricted, link-local addresses and cloud metadata endpoints refused — so an operator-supplied or templated endpoint cannot be pointed at the instance metadata service.
  description: >-
    The S3 endpoint is an operator-controlled URL the process will fetch from, which is the
    classic SSRF shape. Validation happens at configuration time with an explicit deny list, and
    the attack vectors are enumerated in tests rather than assumed.

- id: lh.feature.security.container_hardening
  title: Container and pod hardening
  status: shipped
  since: v0.10.0
  area: security
  surfaces: [cli]
  tests:
    - tests/verification/probe_fips_active.sh
    - tests/verification/probe_image_size.sh
    - charts/victoria-lakehouse/test_templates.sh
    - scripts/ci/tests/test_fips_build_arg.py
  docs:
    - docs/security.md
    - docs/kubernetes-deployment.md
  notes: >-
    CI runs the linked chart template test and the Dockerfile FIPS test, and the trivy-image jobs
    check the build settings of the built binary of each variant. The linked probes check built
    images and a deployed stack, and are run by hand.
  highlight: >-
    **Hardened images and pods**: minimal non-root images with a read-only root filesystem and dropped capabilities, and chart defaults that set the matching pod security context rather than leaving it to the deployer.
  description: >-
    The default deployment should be the safe one. The images carry no shell-level extras, the
    chart's security context is restrictive out of the box, and probes verify the shipped image
    actually has the properties claimed. The default image is built with Go's standard crypto and
    only the `-fips` variant (build argument `FIPS=1`, exact match) is built with the FIPS 140
    module; a static test and a check of the built binaries keep the two apart.

- id: lh.feature.security.ci_pipeline
  title: CI security pipeline
  status: shipped
  since: v0.10.0
  area: security
  surfaces: [cli]
  tests:
    - tests/verification/probe_image_freshness.sh
  docs:
    - docs/security.md
  notes: >-
    The scans themselves are the Security and CodeQL workflows, which run on every PR but are not
    tests the catalog can link. The linked image-freshness probe runs against a deployed stack and
    is not run in CI.
  highlight: >-
    **CI security gates**: static analysis, dependency and image scanning on every change, plus an image-freshness probe that catches a deploy still running a stale binary.
  description: >-
    Scanning that runs on every PR is the only kind that finds things before release. The
    freshness probe closes the other half of the problem — a scanned artifact that was never
    actually deployed — by comparing each running container's image against the newest source
    commit.
