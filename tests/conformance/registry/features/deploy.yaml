    - lakehouse-traces/ring_self_test.go#TestNewCompactionOwnership_DiscoveryConfiguredButEmpty_OwnsNothing
    - lakehouse-traces/ring_self_test.go#TestOwnership_RollingRestart_NewIP_ReResolves
    - lakehouse-traces/ring_multiinstance_test.go#TestMultiInstance_TwoWritersTwoSelects_EveryPartitionCompactedByExactlyOneWriter
    - internal/selfaddr/selfaddr_test.go#TestSelfaddr_Forms
    - internal/selfaddr/fuzz_test.go#FuzzSelfaddrResolve
    - internal/compaction/ownership_self_test.go#TestOwnership_SelfUnresolved_OwnsNothing_GaugeZero
    - internal/peercache/ring_self_test.go#TestPeercacheRing_IsSelf_Hostname
    - internal/smartcache/ring_self_test.go#TestController_OwnKeysCauseNoSelfHTTP
    - internal/selfaddr/env_test.go#TestSystemEnv_EvictionKeepsInflightEntries
    - internal/selfaddr/env_test.go#TestSystemEnv_HungResolverDoesNotPinTheSlots
    - internal/selfaddr/env_test.go#TestSystemEnv_RefreshDoesNotRewriteAReturnedSlice
    - internal/metrics/ring_self_test.go#TestAlerts_RingSelfUnresolved
    - internal/metrics/ring_self_test.go#TestAlerts_NoWriterInCompactionRing
    - charts/victoria-lakehouse/test_templates.sh
    - internal/compaction/ownership_self_test.go#TestOrphanSweep_TierA_SecondaryFoundByIP
    - internal/compaction/ownership_self_test.go#TestOrphanSweep_TierB_UnresolvedSelf_DoesNothing
    - internal/compaction/ownership_self_test.go#TestOwnership_DrainingSelf_ResolvedButNotInPeers
    - internal/compaction/ownership_self_test.go#TestOwnership_ListenAddrAndHostnameMembers_OneOwnerEach
    - internal/compaction/ownership_self_test.go#TestOwnership_SinglePodNoDiscovery_OwnsAll
    - internal/compaction/ownership_self_test.go#TestOwnership_ZeroEnvIsTheSystemEnv
    - internal/metrics/ring_self_test.go#TestRingSelfGauges_ExportedPerRing
    - internal/peercache/ring_self_test.go#TestPeercacheRing_EmptyRing_IsSelf
    - internal/peercache/ring_self_test.go#TestPeercacheRing_IsSelf_IPAndZones
    - internal/peercache/ring_self_test.go#TestPeercacheRing_SelfUnresolved_NeverLocal
    - internal/selfaddr/env_test.go#TestSystemEnv_AddressesAndNames
    - internal/selfaddr/env_test.go#TestSystemEnv_CachedForAMinute
    - internal/selfaddr/env_test.go#TestSystemEnv_CacheEviction
    - internal/selfaddr/env_test.go#TestSystemEnv_LookupFailureKeepsTheLastAnswer
    - internal/selfaddr/env_test.go#TestSystemEnv_LookupHostIsAsyncAndCached
    - internal/selfaddr/env_test.go#TestSystemEnv_LookupIsBounded
    - internal/selfaddr/env_test.go#TestSystemEnv_RealProcess
    - internal/selfaddr/env_test.go#TestSystemEnv_SourceErrors
    - internal/selfaddr/selfaddr_test.go#TestSelfaddr_DashedAddr
    - internal/selfaddr/selfaddr_test.go#TestSelfaddr_DNSRule
    - internal/selfaddr/selfaddr_test.go#TestSelfaddr_ResultReasons
    - internal/selfaddr/tracker_test.go#TestTracker_LogsOncePerChange
    - internal/selfaddr/tracker_test.go#TestTracker_ResolvesMemoisesAndReportsGauges
  docs:
    - docs/architecture/roles.md
    - docs/kubernetes-deployment.md
    - docs/observability.md
  highlight: >-
    **Pods find themselves in the ring**: compaction ownership and the peer cache recognise a pod's own entry in the discovered member list by IP, StatefulSet hostname or dashed-IP name, so every partition has one scheduler owner whether the headless service lists IPs or hostnames and whatever availability zones the pods run in (the orphan sweep's Tier A can still merge a partition the owner is merging, issue 602).
  description: >-
    A pod listens on :9428 and service discovery lists it as an IP or a hostname, which never
    compared equal, so the pod added its listen address to the ring as an extra member: with
    several writers, 66 to 88% of the partitions had no scheduler owner and 12 to 32% had one
    in every writer. internal/selfaddr matches the list against the pod's addresses (POD_IP,
    POD_IPS, interfaces), hostname (POD_NAME) and a cached DNS lookup; a pod it cannot identify
    owns nothing and never invents a member. Gauges lakehouse_ring_self_resolved and
    lakehouse_ring_self_in_peers and the alert LakehouseRingSelfUnresolved say when a pod is not
    found. Pods in different availability zones hash over the same whole writer list. Known gaps: the orphan sweep's Tier A secondary can still merge a partition the
    primary is merging (issue 602); other places compare the listen address by string
    (issue 603).
