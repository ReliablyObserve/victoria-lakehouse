- id: lh.feature.tenancy.policy_overrides
  title: Per-tenant policy overrides
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [api, flag]
  tests:
    - internal/tenant/effective_test.go
    - internal/stats/api_tenant_policy_test.go
    - internal/tenant/handler_test.go
    - tests/e2e/tenant_policy_yaml_test.go#TestTenantPolicy_YAMLConfig_LivesOnStack
    - tests/e2e/tenant_policy_endpoint_test.go#TestTenantPolicy_Endpoint_RespondsOnLiveStack
  docs:
    - docs/multi-tenancy.md
  highlight: >-
    **Per-tenant config overrides** with global-default inheritance: `Retention`, `Cardinality`, `Ingest` rate limits, `Lifecycle` transitions, and `S3` bucket can be overridden per `(AccountID, ProjectID)` via a YAML policy file. Unspecified knobs fall back to the global defaults. Overrides keyed by OrgID alias re-resolve on the same cadence as alias sync, so late-registered tenants pick up their overrides without a restart.
  description: >-
    One policy file describes every exception; everything unspecified inherits. `/api/v1/tenants/policy`
    reports what actually resolved for each tenant, including pending aliases, so "why is this
    tenant not rate-limited" has an answer that does not require reading the file.

- id: lh.feature.tenancy.bucket_migration
  title: Retroactive tenant bucket migration
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [api]
  tests:
    - internal/tenant/migrate_test.go
    - internal/tenant/admin_handler_test.go
    - tests/e2e/tenant_admin_migrate_test.go#TestTenantAdmin_Migrate_AuthGate
  docs:
    - docs/multi-tenancy.md
  highlight: >-
    **Retroactive bucket migration**: `POST /lakehouse/api/v1/admin/tenant/migrate` server-side-copies existing Parquet objects from the shared bucket to a tenant's new dedicated bucket, then flips `manifest.FileInfo.Bucket` and deletes the source — auth-gated via the existing global-read credential surface (header or Bearer token), closed by default.
  description: >-
    Moving a tenant to its own bucket after the fact is otherwise a manual, error-prone S3
    exercise. The admin endpoint does the copy server-side, flips the manifest to the new
    location, then removes the source — and refuses to run without the admin credential.

- id: lh.feature.tenancy.global_read
  title: Global read mode for cross-tenant queries
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [api, flag]
  tests:
    - internal/config/tenant_test.go
    - tests/e2e/isolation_verify_test.go#TestVerifyIsolation_GlobalRead_SeesAllTenants
    - tests/e2e/multitenancy_test.go#TestMultitenancy_GlobalReadWithCorrectSecret
    - tests/e2e/multitenancy_test.go#TestMultitenancy_GlobalReadWithWrongSecret
    - tests/e2e/multitenancy_test.go#TestMultitenancy_GlobalReadMissingHeader
    - internal/tenant/global_read_test.go
    - internal/storage/global_read_test.go
    - lakehouse-traces/internal/selectapi/global_read_test.go
  docs:
    - docs/multi-tenancy.md
    - docs/security.md
  highlight: >-
    **Global read mode**: configurable `X-Lakehouse-Global-Read` header (or Bearer token) allows admin/Grafana dashboards to query across all tenants (must be explicitly enabled).
  description: >-
    Fleet-wide dashboards need to see everything, and nothing else should. Global read is off
    until enabled, requires a credential, and is covered by tests for the correct secret, the
    wrong secret and the missing header — the three cases that decide whether isolation holds.

- id: lh.feature.tenancy.cardinality_limits
  title: Per-tenant cardinality limits
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [ingest, flag]
  tests:
    - internal/tenant/cardinality_test.go
    - internal/stats/cardinality_limiter_test.go
    - internal/tenant/integration_test.go
  docs:
    - docs/multi-tenancy.md
    - docs/tenant-stats.md
  highlight: >-
    **Per-tenant cardinality limits**: `tenant.CardinalityLimiter` gates streams at the insert path so a tenant over its `max_streams`/`max_fields` cap drops the offending rows rather than letting cardinality leak through to the writer.
  description: >-
    Cardinality is the failure mode that spreads: one tenant's runaway label explodes the
    metadata every other tenant pays for. The limiter refuses the offending streams at ingest,
    where the damage can still be contained, and reports what it dropped.

- id: lh.feature.tenancy.ingest_rate_limits
  title: Per-tenant ingest rate limits
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [ingest, api, flag]
  tests:
    - internal/tenant/ratelimit_test.go
    - internal/tenant/ratelimit_middleware_test.go
    - internal/tenant/integration_test.go
  docs:
    - docs/multi-tenancy.md
    - docs/configuration.md
  highlight: >-
    **Per-tenant ingest rate limits**: `tenant.IngestRateLimiter` adds independent byte/sec and row/sec token buckets with `X-RateLimit-*` headers and HTTP 429 on overflow.
  description: >-
    Bytes and rows are different resources — a flood of tiny rows and a flood of large ones fail
    differently — so each has its own bucket. Clients are told their budget and remaining
    allowance in headers instead of discovering the limit as an opaque error.

- id: lh.feature.tenancy.lifecycle_overrides
  title: Per-tenant lifecycle overrides
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [flag, storage]
  tests:
    - internal/delete/tenant_lifecycle_test.go#TestStorageClassDetector_DetectForKey_TenantOverrideWins
    - internal/delete/tenant_lifecycle_test.go#TestStorageClassDetector_DetectForKey_FallsBackToGlobal
    - internal/delete/tenant_lifecycle_test.go#TestParseTenantFromKey
  docs:
    - docs/tenant-stats.md
    - docs/multi-tenancy.md
  highlight: >-
    **Per-tenant lifecycle overrides**: tenants with their own S3 transition schedule (e.g. `ONEZONE_IA @ 7d` → `GLACIER @ 60d`) shadow the global rules; the storage-class detector and rewriter scheduler both consult the per-tenant rules so manual predictions and the background rewriter agree.
  description: >-
    Storage-class policy is a cost decision each tenant may make differently. Both the predictor
    that estimates cost and the scheduler that acts on it read the same per-tenant rules, so an
    estimate is never computed against a policy the fleet does not actually apply.

- id: lh.feature.tenancy.aliases
  title: Tenant aliases and name mapping
  status: shipped
  area: tenancy
  surfaces: [api]
  tests:
    - internal/tenant/persistence_test.go
    - internal/tenant/resolver_test.go
    - internal/stats/api_tenant_name_test.go
    - internal/stats/api_tenant_mapping_test.go
    - tests/e2e/string_tenant_test.go#TestStringTenant_AliasCreate
  docs:
    - docs/tenant-stats.md
    - docs/multi-tenancy.md
  changelog_bullets:
    - 'Tenant aliases are config-mapped, reconstructed, and persisted.'
  highlight: >-
    **Tenant aliases**: human-readable `X-Scope-OrgID` names map to the numeric account/project pair, are reconstructed from config, persisted across restarts, and surfaced in every stats view.
  description: >-
    Operators think in tenant names; the storage layout is numeric. Aliases are resolved from
    config, kept durable so a restart does not orphan a mapping, and decorated onto stats output
    so dashboards show names rather than ids.

- id: lh.feature.tenancy.stats_registry
  title: CRDT tenant registry
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Tenant Stats & Storage Metrics
  surfaces: [api]
  tests:
    - internal/stats/registry_test.go
    - internal/stats/aggregate_test.go
    - internal/stats/integration_test.go
    - tests/e2e/tenant_stats_consistency_test.go#TestTenantStats_OverviewMatchesTenantSum
  docs:
    - docs/tenant-stats.md
  highlight: >-
    **TenantRegistry**: CRDT-based in-memory registry tracking per-tenant files, bytes, rows, time ranges, storage classes, and query activity.
  description: >-
    Every pod observes part of the truth and none of them can block on the others, so the
    registry is a CRDT: merges are order-independent and convergent, which is what lets per-tenant
    totals be correct without a coordinator.

- id: lh.feature.tenancy.fleet_sync
  title: Fleet stats synchronization
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Tenant Stats & Storage Metrics
  surfaces: [api, flag]
  tests:
    - internal/stats/sync_test.go
    - internal/tenant/sync_test.go
    - internal/tenant/persistence_test.go
  docs:
    - docs/tenant-stats.md
  highlight: >-
    **Fleet synchronization**: delta broadcast with ZSTD compression (configurable interval), S3 snapshot fallback for crash recovery.
  description: >-
    Pods broadcast compressed deltas to each other on an interval and checkpoint to S3, so a pod
    that restarts or joins converges from the snapshot plus the next deltas instead of starting
    from an empty view of the fleet.

- id: lh.feature.tenancy.storage_class_awareness
  title: S3 storage-class awareness per tenant
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Tenant Stats & Storage Metrics
  surfaces: [storage, api]
  tests:
    - internal/stats/storageclass_test.go
    - internal/delete/storageclass_test.go
    - internal/storage/parquets3/tier_transition_test.go
  docs:
    - docs/tenant-stats.md
  highlight: >-
    **S3 storage class awareness**: lifecycle prediction (zero API cost), HeadObject sampling, optional S3 Inventory import.
  description: >-
    Knowing which class an object is in decides both its cost and whether deleting it is
    expensive. Prediction from the lifecycle rules is free and usually right; sampling and
    Inventory import are there for when exactness is worth the API calls.

- id: lh.feature.tenancy.cost_estimation
  title: Per-tenant cost estimation and attribution
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Tenant Stats & Storage Metrics
  surfaces: [api]
  tests:
    - internal/stats/cost_test.go
    - internal/stats/cost_regression_test.go
    - internal/stats/handlecost_lifecycle_test.go
    - tests/e2e/endpoints_verification_test.go#TestEndpoint_Stats_Cost
  docs:
    - docs/tenant-stats.md
    - docs/multi-tenancy.md
  highlight: >-
    **Cost estimation**: per-class pricing model with lifecycle savings calculation, request cost tracking, and per-tenant cost allocation — backed by per-prefix S3 Inventory or per-bucket billing for chargeback.
  description: >-
    Cost is computed from what the fleet actually stores and requests, per storage class and per
    tenant, including what lifecycle transitions already saved. Because files are physically
    separated per tenant, the attribution is exact rather than a share-out of a bucket total.

