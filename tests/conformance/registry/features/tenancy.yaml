# Tenancy features: how one process serves many tenants, how their data and
# their costs are kept apart, and what it reports about them.

- id: lh.feature.tenancy.header_routing
  title: Header-routed multi-tenancy in one process
  status: shipped
  since: v0.49.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [api, ingest]
  rows: [lh.tenants.list.schema]
  tests:
    - internal/tenant/middleware_test.go
    - internal/tenant/resolver_test.go
    - tests/e2e/tenant_mapping_test.go#TestTenantMapping_StringAndIntPaths
    - tests/e2e/isolation_verify_test.go#TestVerifyIsolation_OrgID_NoCrossTenantLeak
    - tests/e2e/endpoints_verification_test.go#TestEndpoint_MultiTenant_DataIsolation
    - internal/storage/parquets3/tenant_scope_test.go
    - internal/storage/parquets3/tenant_scope_labelindex_test.go
    - lakehouse-traces/internal/storage/parquets3/tenant_scope_test.go
    - lakehouse-traces/internal/storage/parquets3/tenant_scope_labelindex_test.go
    - lakehouse-traces/internal/storage/parquets3/tenant_scope_traces_test.go
    - internal/selectapi/tenant_scope_test.go
    - internal/buffer/handler_tenant_test.go
    - internal/manifest/tenant_scope_test.go
    - tests/e2e/multitenancy_test.go#TestMultitenancy_TenantScope_Logs_ExactCounts
    - tests/e2e/multitenancy_test.go#TestMultitenancy_TenantScope_Traces_ExactCounts
    - tests/parity/tenant_scope_parity_test.go#TestTenantParity_PerTenantQueryReturnsOnlyOwnedData
  docs:
    - docs/multi-tenancy.md
    - docs/multi-tenancy.md#read-scoping-which-data-a-request-sees
    - docs/configuration.md
  highlight: >-
    **Single binary, all tenants**: one lakehouse-logs/traces process serves all tenants simultaneously via header-based routing (`X-Scope-AccountID` / `X-Scope-ProjectID`, vmauth-compatible). Same pattern as Grafana Loki and Tempo.
  description: >-
    Tenancy is resolved from request headers at the edge of every path — insert, query, admin —
    and carried through to the storage prefix, so there is no per-tenant process to schedule and
    no per-tenant config to reload. A select request reads exactly one tenant, as upstream
    VictoriaLogs and VictoriaTraces do: the tenant in its headers, or `0:0` when there are none,
    on every query class — row scans, metadata fast paths, field and stream enumeration, pmeta
    catalog answers, the buffer bridge and the Jaeger API. Isolation is asserted by an invariant
    matrix over query class × request shape × tenant layout and by e2e tests that count each
    tenant's rows exactly and try to read across tenants.

- id: lh.feature.tenancy.s3_prefix_isolation
  title: In-path per-tenant S3 isolation
  status: shipped
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [storage, ingest]
  tests:
    - internal/storage/parquets3/stats_attribution_test.go
    - tests/e2e/tenant_s3_isolation_test.go#TestTenantS3Isolation_ParquetLandsUnderPerTenantPrefix
    - tests/e2e/multitenancy_test.go#TestMultitenancy_S3TenantSeparation
    - tests/e2e/multitenancy_test.go#TestMultitenancy_S3NoUnprefixedData
  docs:
    - docs/multi-tenancy.md
    - docs/storage-flow.md
  changelog_bullets:
    - 'Multi-tenant S3 isolation (PR #111)'
  highlight: >-
    **In-path S3 isolation**: `BatchWriter` groups rows by `(AccountID, ProjectID)` at flush and writes one Parquet file per tenant per partition under the resolved `{AccountID}/{ProjectID}/<mode>/` prefix. Single-tenant batches keep the fast path (one upload, one manifest entry, one stats callback). Every Parquet tool (DuckDB, ClickHouse, Trino, Spark) can query a tenant's prefix directly.
  description: >-
    Isolation happens where the bytes are written, not as a filter on the way out: a file
    contains exactly one tenant's rows and lives under that tenant's prefix. That is what makes
    per-tenant cost attribution, per-tenant lifecycle and external analytics per tenant possible
    at all.

- id: lh.feature.tenancy.per_tenant_buckets
  title: Per-tenant bucket overrides
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [storage, flag]
  tests:
    - internal/tenant/bucket_entries_test.go
    - internal/s3reader/pool_registry_test.go
    - internal/storage/parquets3/bucket_routing_test.go
    - internal/tenant/effective_test.go
    - internal/manifest/tenant_buckets_refresh_test.go
    - internal/manifest/tenant_range_walk_test.go
    - tests/e2e/multitenancy_test.go#TestMultitenancy_TenantScope_BucketLayout
  docs:
    - docs/multi-tenancy.md
    - docs/configuration.md
  highlight: >-
    **One process, many buckets**: optional per-tenant bucket overrides route a tenant's reads and writes to its own S3 bucket via the YAML policy file's `tenant.bucket` field (no template required). The s3reader pool registry caches a separate client per bucket so a single lakehouse process serves isolated buckets without restart. Manifest sidecars stay in the default bucket so a fleet-wide manifest still resolves files across many tenant buckets.
  description: >-
    Some tenants need their data in their own bucket for billing or IAM reasons, and they should
    not force every tenant into that shape. A per-tenant override is a policy entry, not a
    deployment: clients are pooled per bucket and the manifest keeps resolving across all of them.

- id: lh.feature.tenancy.bucket_template
  title: Bucket-template hard isolation
  status: shipped
