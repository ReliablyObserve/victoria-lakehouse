- id: lh.feature.tenancy.pmeta_isolation
  title: Tenant-isolated partition metadata
  status: shipped
  area: tenancy
  surfaces: [storage]
  tests:
    - internal/pmeta/persist_test.go
    - internal/storage/parquets3/pmeta_integration_test.go
    - internal/stats/pmeta_cardinality_test.go
    - tests/e2e/stats_metadata_test.go#TestStatsOverviewMetadata
  docs:
    - docs/tenant-stats.md
    - docs/architecture/pb-scale-resources-pmeta.md
  changelog_bullets:
    - 'Tenant-isolated pmeta metadata + exact per-tenant size (Phase E).'
  highlight: >-
    **Tenant-isolated metadata**: partition metadata is stored per tenant, so a tenant's catalog, blooms and size accounting live under its own prefix and its exact metadata footprint is reportable.
  description: >-
    Shared metadata would leak field names and value cardinalities across tenants and make
    per-tenant size an estimate. Isolating the bundle per tenant keeps both the content and the
    cost attributable.
