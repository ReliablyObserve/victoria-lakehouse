- id: lh.feature.tenancy.stats_breakdown
  title: Exact per-tenant storage breakdown
  status: shipped
  since: v0.100.0
  area: tenancy
  readme_section: Multi-Tenancy
  surfaces: [api]
  tests:
    - internal/stats/api_tenant_breakdown_test.go
    - internal/stats/endpoint_coverage_test.go
    - tests/e2e/tenant_ui_breakdown_test.go#TestTenantAPI_BreakdownEndpointGroupsByTenant
    - tests/e2e/tenant_ui_breakdown_test.go#TestTenantUI_RendersBidirectionalMapping
  docs:
    - docs/tenant-stats.md
    - docs/multi-tenancy.md
  highlight: >-
    **Tenant stats & monitoring**: real-time per-tenant statistics (files, bytes, rows, cost) with CRDT fleet sync, JSON API, and Prometheus metrics. `/api/v1/stats/breakdown?group_by=tenant` returns exact per-tenant facets (not estimated shares) with `org_id` decoration; `/api/v1/tenants/policy` lists every resolved override plus pending aliases; `/api/v1/tenants/{id}` includes a `policy` block when configured.
  description: >-
    A breakdown grouped by tenant is computed from the per-tenant facets the metadata already
    holds, so the numbers add up to the totals exactly. Alias decoration means the answer is
