  highlight: >-
    **Upstream delete API**: VictoriaLogs' and VictoriaTraces' `/delete/run_task`, `stop_task` and `active_tasks`, behind upstream's `-delete.enable`; a task becomes a tombstone scoped to the requesting tenant.
  description: >-
    A client written for VictoriaLogs or VictoriaTraces deletes through the same routes on the
    lakehouse: off by default with upstream's own answer, served through upstream's handler (a
    drift-tested copy of VictoriaTraces' in the traces binary) when `-delete.enable` and the
    lakehouse `delete.enabled` are both on. Each task is registered as a tombstone scoped to the
    requesting tenant and hidden at once on every pod that reads the bucket. A task delivered
    twice with the same content (the fan-out of one task to several nodes) is a success;
    physical removal per `delete.default_mode` is planned.
