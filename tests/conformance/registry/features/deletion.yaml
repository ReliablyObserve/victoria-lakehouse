  # The 0.132.1 leftovers API (GET .../leftovers) is removed in this release: a delete no longer
  # has retired or pending keys or unfinished rewrites to list, and the route answers 404. The
  # released changelog line stays in history; it maps here, to the feature that replaced it.
  changelog_bullets:
    - 'Delete leftovers API — what an instance still owes.'
  highlight: >-
    **Write-once tombstones**: a delete is a small object that is created once and never overwritten; every pod, writer or reader, learns it by listing the new keys, within one minute, and a pod that cannot refresh fails reads closed instead of showing rows that may be deleted.
  description: >-
    A delete is the definition object plus, when a hide delete is undone, an undo object. Both are
    written once with If-None-Match, so nothing under the tombstone prefix is ever rewritten, pods
    cannot overwrite each other, a pod's disk can never bring back a deleted tombstone, and no
    progress record exists to go stale. Key times are pod clocks only (an upstream task id is its
    creator's nanosecond clock, so a duplicate lands on the same key). A pod lists only the keys
    created in the last ten minutes each minute (one request, however many tombstones exist) and
    everything once an hour; it drops a tombstone only on positive evidence (an un-delete of a
    hide delete, retention, a 404) and never because a listing did not contain it. A tombstone
    lives until the data it covers is past retention, so rows a writer flushes late are still
    hidden. The read gate is active only when delete.enabled is true.

- id: lh.feature.deletion.physical_removal
  title: Physical removal of deleted rows (permanent and auto modes)
  status: planned
  area: deletion
  surfaces: [api, storage]
  rows: [lh.delete.physical_removal_not_enabled]
  docs:
    - docs/deletion-strategy.md
  highlight: >-
    **Physical removal** (planned): rewriting stored objects so `permanent` and `auto` deletes remove data from the bucket.
  description: >-
    Rewriting stored objects to remove the rows a delete hides, so that the `permanent` and
    `auto` modes remove data from the bucket and the read cost of an active tombstone ends. Until
    it ships every mode hides the rows at query time and compaction copies them forward unchanged
    (they stay hidden because the tombstone stays in force until retention).

