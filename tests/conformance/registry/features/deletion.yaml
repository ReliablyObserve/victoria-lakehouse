    - internal/vlstorage/internal_delete_gate_test.go#TestInternalDelete_DefaultAnswersLikeUpstreamAndHidesNothing
    - internal/vlstorage/internal_delete_gate_test.go#TestInternalDelete_EnabledRunTaskIsTenantScoped
    - lakehouse-traces/internal_delete_mount_test.go#TestUpstreamInternalDelete_MatchesVendoredVTSelect
