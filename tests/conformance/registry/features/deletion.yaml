    - internal/delete/handler_scope_test.go#TestDeleteAPI_ListGetUndeleteVerifyAreTenantScoped
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_BothTenantFormsOnBothKeyLayouts
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_UnknownOrgIDAnswersLikeSelect
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_IntTenantAnswerIndependentOfAliases
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_OrgIDLayoutRefusesNonZeroProject
    - internal/delete/tasks_test.go#TestPublicTasks_AreTenantScoped
    - internal/delete/tasks_test.go#TestRunTask_RelativeTimeFilterIsPinnedToTheTaskTimestamp
    - cmd/lakehouse-logs/public_delete_mount_test.go#TestMountPublicDelete_TasksAreTenantScoped
    - lakehouse-traces/public_delete_test.go#TestMountPublicDelete_TasksAreTenantScoped
    - cmd/lakehouse-logs/public_delete_tenant_forms_test.go#TestMountPublicDelete_StringTenants
    - cmd/lakehouse-logs/public_delete_tenant_forms_test.go#TestMountPublicDelete_IntTenantAnswerIndependentOfAliases
    - lakehouse-traces/public_delete_tenant_forms_test.go#TestMountPublicDelete_StringTenants
    - lakehouse-traces/public_delete_tenant_forms_test.go#TestMountPublicDelete_IntTenantAnswerIndependentOfAliases
  docs:
    - docs/deletion-strategy.md#tenant-scope
    - docs/multi-tenancy.md#delete-path
    - docs/operations.md#tombstone-management
  highlight: >-
    **Tenant-scoped deletes**: a tombstone names the tenant that issued it (integer AccountID/ProjectID, or a string X-Scope-OrgID through the aliases) and never hides, rewrites or compacts away another tenant's rows; each tenant lists, stops and un-deletes only its own.
  description: >-
    A delete is resolved to its tenant exactly like a select — integer tenants as upstream,
    string OrgIDs through the aliases as a lakehouse extension — and the tombstone it creates acts
    only on objects and buffered rows of that tenant: on every read path, in the rewriter and in
    compaction, so one tenant's delete can neither hide nor remove another's data, nor cost it a
    metadata fast path. The lakehouse delete API and upstream's stop_task and active_tasks show
    each tenant only its own; the global-read credential is the operator view. A record naming no
    tenant is not a tombstone: it is never created and is rejected on restore.

- id: lh.feature.deletion.upstream_api
  title: Upstream delete API (`/delete/run_task`, `stop_task`, `active_tasks`)
  status: shipped
  area: deletion
  readme_section: Deletion
  surfaces: [api, flag]
  rows:
    - vl.delete.run_task.status
    - vl.delete.stop_task.status
    - vl.delete.active_tasks.status
    - vt.delete.run_task.status
    - vt.delete.stop_task.status
    - vt.delete.active_tasks.status
  tests:
    - internal/internaldelete/gate_test.go#TestPublicHandler_GatesLikeHandler
    - cmd/lakehouse-logs/public_delete_mount_test.go#TestMountPublicDelete_GatedByDefault
    - cmd/lakehouse-logs/public_delete_mount_test.go#TestPublicDeleteFlag_IsUpstreams
    - cmd/lakehouse-logs/public_delete_mount_test.go#TestMountPublicDelete_RunTaskIsTenantScoped
    - lakehouse-traces/public_delete_test.go#TestMountPublicDelete_GatedByDefault
    - lakehouse-traces/public_delete_test.go#TestMountPublicDelete_RunTaskIsTenantScoped
    - lakehouse-traces/public_delete_test.go#TestUpstreamPublicDelete_MatchesVendoredVTSelect
    - internal/delete/tasks_test.go#TestRunTask_RegistersATenantScopedTombstone
    - internal/delete/tasks_test.go#TestRunTask_EdgeCases
    - lakehouse-traces/internal/vlstorage/internal_delete_gate_test.go#TestInternalDelete_EnabledRunTaskIsTenantScoped
  docs:
    - docs/deletion-strategy.md#upstream-delete-api-delete
    - docs/deletion-strategy.md#cluster-delete-protocol-internaldelete
    - docs/configuration.md
  changelog_bullets:
    - "Upstream's delete API: `/delete/run_task`, `/delete/stop_task` and `/delete/active_tasks`."
  highlight: >-
    **Upstream delete API**: VictoriaLogs' and VictoriaTraces' `/delete/run_task`, `stop_task` and `active_tasks`, behind upstream's `-delete.enable`; a task becomes a tombstone scoped to the requesting tenant.
  description: >-
    A client written for VictoriaLogs or VictoriaTraces deletes through the same routes on the
    lakehouse: off by default with upstream's own answer, served through upstream's handler (a
    drift-tested copy of VictoriaTraces' in the traces binary) when `-delete.enable` and the
    lakehouse `delete.enabled` are both on. Each task is registered as a tombstone scoped to the
    requesting tenant, hidden at once and physically removed per `delete.default_mode`.
