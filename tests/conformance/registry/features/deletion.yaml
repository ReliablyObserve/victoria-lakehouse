- id: lh.feature.deletion.undelete
  title: Un-delete of a hide delete
  status: shipped
  since: v0.18.2
  area: deletion
  readme_section: Deletion
  surfaces: [api]
  rows: [lh.delete.undelete_hide_only, lh.delete.permanent_undelete_refused]
  tests:
    - internal/delete/handler_test.go#TestHandler_handleTombstoneByID_DeleteExisting
    - internal/delete/protocol_test.go#TestUndelete_PropagatesWithinOnePoll
    - internal/delete/protocol_test.go#TestUndelete_PermanentAndAutoAreIrreversible
    - internal/delete/tombstone_test.go#TestTombstoneStore_Remove
  docs:
    - docs/deletion-strategy.md
    - docs/operations.md#un-delete-restoring-data
  highlight: >-
    **Un-delete**: undo a hide-mode tombstone and its rows are visible again on every pod within one minute; permanent and auto deletes cannot be undone.
  description: >-
    Because a hide-mode delete never touched the data, it is reversible: undoing the tombstone
    writes a write-once undo key, and the rows are visible again on the pod that undid it at once
    and on every other pod at its next poll. A permanent or auto delete (never the default: delete.default_mode
    is hide) is meant to remove the rows physically, so it is not reversible and the call
    answers 409. That is what makes hide the safe mode for an over-broad predicate.

