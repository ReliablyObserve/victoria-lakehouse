    live. The estimate answers that first — matched rows and files, broken down by storage class,
    with the rewrite and request cost each class implies.

- id: lh.feature.deletion.verify
  title: Delete verification
  status: shipped
  since: v0.18.2
  area: deletion
  readme_section: Deletion
  surfaces: [api]
  rows: [lh.delete.verify.status]
  tests:
    - internal/delete/handler_test.go#TestHandler_handleVerify_WithMatchingTombstone
    - internal/delete/handler_test.go#TestHandler_handleVerify_PartialCoverage
    - internal/delete/scheduler_test.go#TestSchedulerVerify
    - tests/e2e/delete_test.go#TestDelete_Verify
  docs:
    - docs/deletion-strategy.md
  highlight: >-
    **Verification**: `/delete/logsql/verify` (or `/delete/tracessql/verify`) confirms tombstoned data is invisible (normal mode) or physically deleted (deep mode).
  description: >-
    Compliance needs proof, not a promise. Normal verification re-runs the predicate and asserts
    nothing is returned; deep verification checks the objects themselves, and partial coverage is
    reported as partial rather than rounded up to success.

- id: lh.feature.deletion.undelete
  title: Un-delete by removing a tombstone
  status: shipped
  since: v0.18.2
  area: deletion
  readme_section: Deletion
  surfaces: [api]
  tests:
    - internal/delete/integration_test.go#TestIntegration_Undelete
    - internal/delete/handler_test.go#TestHandler_handleTombstoneByID_DeleteExisting
    - internal/delete/tombstone_test.go#TestTombstoneStore_Remove
    - internal/delete/tombstone_removal_test.go#TestUndelete_SurvivesACrashWhileTheS3DeleteIsPending
    - internal/delete/intents_test.go#TestHandler_UndeleteMidRewriteIsAConflict
  docs:
    - docs/deletion-strategy.md
    - docs/operations.md#un-delete-restoring-data
  highlight: >-
    **Un-delete**: remove a tombstone to restore data visibility instantly.
  description: >-
    Because a hide-mode delete never touched the data, it is reversible: deleting the tombstone
    makes the rows visible again immediately, which is what makes tombstone-first the safe
    default for an accidental over-broad predicate.

- id: lh.feature.deletion.compliance
  title: Glacier-safe, GDPR-compatible deletion
  status: shipped
  since: v0.18.2
  area: deletion
  readme_section: Deletion
  surfaces: [api, storage]
  tests:
    - internal/delete/storageclass_test.go
    - internal/delete/tenant_lifecycle_test.go
    - internal/delete/handler_test.go#TestHandler_handleVerify_WithMatchingTombstone
  docs:
    - docs/deletion-strategy.md
  highlight: >-
    **Glacier-safe**: never triggers retrieval fees — the tombstone suppresses reads and data ages out via lifecycle. **GDPR compliant**: immediate inaccessibility satisfies right-to-erasure, with optional physical delete for strict compliance.
  description: >-
    The two constraints that usually conflict — "erase it now" and "do not pay to retrieve an
    archive" — are reconciled by separating visibility from physical presence: erasure is
    immediate and total from every read path, while the bytes leave on the lifecycle schedule
    unless physical deletion is explicitly demanded.

- id: lh.feature.deletion.leftovers_api
  title: Leftovers API — what an instance still owes
  status: shipped
  area: deletion
  readme_section: Deletion
  surfaces: [api]
  rows: [lh.delete.leftovers.status]
  tests:
    - internal/delete/handler_leftovers_test.go#TestLeftovers_ListsRetiredPendingAndUnfinishedRewrites
    - internal/delete/handler_leftovers_test.go#TestLeftovers_IsBounded
    - internal/delete/handler_leftovers_test.go#TestLeftovers_RejectsNonGET
    - internal/delete/handler_leftovers_test.go#TestLeftovers_IsRegistered
    - internal/delete/handler_scope_test.go#TestDeleteAPI_LeftoversTenantView
    - internal/metrics/assets_test.go#TestDeleteMetrics_AreVisibleSomewhere
  docs:
    - docs/deletion-strategy.md
    - docs/operations.md#what-this-instance-still-owes-prefixleftovers
    - docs/operations.md#rolling-back
  changelog_bullets:
    - 'Delete leftovers API — what an instance still owes.'
  highlight: >-
    **Leftovers API**: `GET /delete/logsql/leftovers` (or `/delete/tracessql/leftovers`) names the retired keys, unpublished uploads and unfinished rewrites an instance is still holding on to.
  description: >-
    The alerts on retired-key eviction, non-durable tombstone records and unfinished rewrites all
    ask an operator to act on specific objects, which until now no API could name. The listing is
    read-only, bounded by a limit, and reports for each entry why it is still there — the delete
    that is owed, the upload that is held, or the rewrite state a restart would resolve from. Like
    the tombstone listing beside it, a tenant sees its own objects and tombstones and the
    global-read credential the whole instance.

