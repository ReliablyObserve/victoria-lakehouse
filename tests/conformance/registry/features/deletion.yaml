    - lakehouse-traces/internal_delete_mount_test.go#TestMountInternalProtocol_DeleteIsGatedByDefault
  docs:
    - docs/deletion-strategy.md
  highlight: >-
    **`lakehouse-logs`**: `/delete/logsql/*` endpoints. **`lakehouse-traces`**: `/delete/tracessql/*` endpoints.
  description: >-
    Both binaries expose the same delete surface in their own query language, including listing
    active tombstones and addressing one by id, so deletion is scriptable and auditable rather
    than an out-of-band S3 operation. The upstream cluster delete protocol (`/internal/delete/*`)
    is served through upstream's own handler (VictoriaLogs' vlselect in the logs binary): only with
    `-internaldelete.enable` (default off), plus `delete.enabled`; a delete task becomes a tombstone
    scoped to the task's tenants.

- id: lh.feature.deletion.tombstones
  title: Tombstones and query-time suppression
  status: shipped
  since: v0.18.2
  area: deletion
  surfaces: [api, storage]
  rows: [lh.delete.hide_survives_crash, lh.query.tombstone_per_file_fast_path]
  tests:
    - internal/delete/tombstone_test.go#TestTombstoneStore_AddAndActive
    - internal/delete/protocol_test.go#TestRestart_FromStaleCache_DoesNotResurrectAnUndeletedTombstone
    - internal/delete/multiinstance_test.go#TestMI_RestartLosesNothingAndNoProgressRecordExists
    - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
    - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
    - internal/delete/handler_test.go#TestHandler_handleDelete_Valid
    - tests/e2e/delete_test.go#TestDelete_TombstoneAndQuery
    - internal/storage/parquets3/fields_tombstones_test.go#TestFieldValues_TombstonedValueDisappears
    - internal/storage/parquets3/fields_tombstones_span_test.go#TestFieldValues_TombstoneInsideAScannedFileButOutsideTheWindow
    - internal/storage/parquets3/pure_buffer_tombstone_test.go#TestRunQuery_PureBufferWindowHonoursTombstones
    - lakehouse-traces/internal/storage/parquets3/fields_tombstones_span_test.go#TestTraceFieldValues_TombstoneInsideAScannedFileButOutsideTheWindow
  docs:
    - docs/deletion-strategy.md
    - docs/operations.md#tombstone-management
    - docs/operations.md#where-tombstones-are-applied
    - docs/durability.md#31-deletes-and-rewrites
  highlight: >-
    **Tombstones**: a delete is recorded as a predicate and applied at query time, so data disappears from every read immediately and at zero S3 cost.
  description: >-
    The tombstone view is consulted on every query path, including the ones that answer from
    metadata, so a tombstoned row cannot reappear through a fast path. Compaction copies the rows
    forward unchanged and they stay hidden, because the tombstone stays in force until the data
    is past retention. Physical removal is planned (lh.feature.deletion.physical_removal).

- id: lh.feature.deletion.modes
  title: Hide, permanent and auto delete modes
  status: shipped
  since: v0.18.2
  area: deletion
  readme_section: Deletion
  surfaces: [api, flag]
  tests:
    - internal/delete/handler_test.go#TestHandler_handleDelete_ModeHide
    - internal/delete/handler_test.go#TestHandler_handleDelete_ModePermanent
    - internal/delete/handler_test.go#TestHandler_handleDelete_ModeAuto
  docs:
    - docs/deletion-strategy.md
    - docs/configuration.md
  highlight: >-
    **Three modes**: `hide` (tombstone only, never rewrites), `permanent` and `auto` (physical removal once it ships; until then they hide, like `hide`).
  description: >-
    The mode is the operator's statement about intent and budget: `hide` never touches S3, and
    `permanent` and `auto` ask for physical removal, `auto` choosing per file from its storage
    class so an archival object is never dragged out of Glacier by a routine delete. Physical
    removal is not enabled yet: every mode hides the rows at query time and the mode is recorded
    in the definition for when it is.

