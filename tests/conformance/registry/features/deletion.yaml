    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_UnknownOrgIDAnswersLikeSelect
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_IntTenantAnswerIndependentOfAliases
    - internal/delete/handler_tenant_forms_test.go#TestDeleteAPI_OrgIDLayoutRefusesNonZeroProject
    - internal/delete/tasks_test.go#TestRunTask_RelativeTimeFilterIsPinnedToTheTaskTimestamp
    - internal/delete/tasks_test.go#TestPublicTasks_AnswerTheSameToEveryCaller
    - cmd/lakehouse-logs/public_delete_mount_test.go#TestMountPublicDelete_TasksAnswerTheSameToEveryCaller
    - lakehouse-traces/public_delete_test.go#TestMountPublicDelete_TasksAnswerTheSameToEveryCaller
    - cmd/lakehouse-logs/public_delete_tenant_forms_test.go#TestMountPublicDelete_StringTenants
    - cmd/lakehouse-logs/public_delete_tenant_forms_test.go#TestMountPublicDelete_IntTenantAnswerIndependentOfAliases
    - lakehouse-traces/public_delete_tenant_forms_test.go#TestMountPublicDelete_StringTenants
    - lakehouse-traces/public_delete_tenant_forms_test.go#TestMountPublicDelete_IntTenantAnswerIndependentOfAliases
  docs:
    - docs/deletion-strategy.md#tenant-scope
    - docs/multi-tenancy.md#delete-path
    - docs/operations.md#tombstone-management
  highlight: >-
    **Tenant-scoped deletes**: a tombstone names the tenant that issued it (integer AccountID/ProjectID, or a string X-Scope-OrgID through the aliases) and never hides, rewrites or compacts away another tenant's rows; each tenant lists, stops and un-deletes only its own.
  description: >-
    A delete is resolved to its tenant exactly like a select — integer tenants as upstream,
    string OrgIDs through the aliases as a lakehouse extension — and the tombstone it creates acts
    only on objects and buffered rows of that tenant, on every read path, so one tenant's delete can neither hide nor remove another's data, nor cost it a
    metadata fast path. The lakehouse delete API shows each tenant only its own tombstones (the
    global-read credential is the operator view); upstream's stop_task and active_tasks answer the
    same to every caller (a registered task is finished). A definition
    naming no tenant is not a tombstone: it is never created and is rejected when read.

