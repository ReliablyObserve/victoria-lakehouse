  docs:
    - docs/deletion-strategy.md
  highlight: >-
    **Glacier-safe**: never triggers retrieval fees — the tombstone suppresses reads and data ages out via lifecycle. **Right to erasure**: the data is inaccessible from every read path at once; physical removal for strict compliance is planned.
  description: >-
    The two constraints that usually conflict — "erase it now" and "do not pay to retrieve an
    archive" — are reconciled by separating visibility from physical presence: erasure is
    immediate and total from every read path, while the bytes leave on the lifecycle schedule.
    Physical deletion on demand is planned (lh.feature.deletion.physical_removal) and is not
    available yet.

