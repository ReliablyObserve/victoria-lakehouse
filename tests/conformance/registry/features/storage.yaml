  highlight: >-
    **Manifest push**: an insert pod tells its peers about a new file over `/internal/manifest/update` instead of leaving them to discover it on the next S3 refresh.
  description: >-
    Newly flushed files become visible fleet-wide within a round trip: the writer pushes the
    manifest delta to peers, which apply it to their in-memory manifest. The periodic S3 refresh
    stays as the backstop for pods that missed a push.

- id: lh.feature.storage.metadata_persistence
  title: Metadata survives restarts
  status: shipped
  since: v0.9.0
  area: storage
  readme_section: Infrastructure
  surfaces: [storage]
  tests:
    - internal/cache/persist_test.go
