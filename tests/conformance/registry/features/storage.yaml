  highlight: >-
    **Storage-class tiering**: aged, compacted objects transition to cheaper S3 classes, and the storage-class detector keeps cost estimates and delete decisions aware of where each object actually lives.
  description: >-
    Because compaction produces large immutable objects, they are exactly what lifecycle
    transitions want. The detector predicts an object's class from the lifecycle rules at zero
    API cost, with HeadObject sampling and optional S3 Inventory import when exactness matters.
