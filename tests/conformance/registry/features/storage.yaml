  changelog: ["0.81.0"]
  changelog_bullets:
    - 'pmeta `retire-sidecar-writes` — stop writing ALL legacy sidecars the facets replace: `_file_metadata.json`, per-file `.bloom`, and partition `_bloom.bin` (`-lakehouse.pmeta.retire-sidecar-writes`, off by default, both modules).'
  highlight: >-
    **Sidecar retirement**: with the facets carrying the same information, `-lakehouse.pmeta.retire-sidecar-writes` stops writing `_file_metadata.json`, per-file `.bloom` and partition `_bloom.bin` — fewer objects, fewer PUTs, less S3 cost per flush.
  description: >-
    The flag is off by default and retires only the sidecars whose readers have already flipped
    to the bundle, so a cluster can move at its own pace and roll back by turning the flag off.

- id: lh.feature.storage.pmeta_self_heal
  title: Self-healing partition metadata
  status: shipped
  since: v0.79.0
  area: storage
  surfaces: [storage]
  tests:
    - internal/pmeta/facet_field_catalog_test.go#TestFieldCatalog_SelfHealRebuildParity
    - internal/pmeta/bundle_test.go#TestStore_FlushAndRebuild
    - internal/pmeta/hardening_test.go
    - internal/pmeta/persist_test.go
    - lakehouse-traces/internal/storage/parquets3/pmeta_wire_coverage_test.go#TestWarmCatalogFromS3_RebuildMissingBundle
  docs:
    - docs/architecture/restore-and-elasticity-pmeta.md
    - docs/architecture/metadata-consolidation.md
  highlight: >-
    **Self-healing metadata**: a lost or damaged partition bundle is rebuilt from the Parquet footers themselves, so metadata loss degrades performance rather than correctness.
  description: >-
    Because every fact in the bundle is derivable from the files it describes, a missing bundle
    is a cache miss, not data loss: the partition is rebuilt from footers on demand and the
    rebuild is asserted to produce the same catalog the incremental path produces.

- id: lh.feature.storage.s3_read_path_tier1
  title: S3 read-path hygiene, adaptive read-ahead and coalescing
  status: shipped
  since: v0.83.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/s3reader/adaptive_test.go
    - internal/s3reader/coalescing_reader_test.go
    - internal/storage/parquets3/coverage_s3_paths_test.go#TestInteg_openParquetFile_ConcurrentDownloads
    - internal/storage/parquets3/coverage_integration_test.go#TestInteg_openParquetFile_RangeRead
  docs:
    - docs/architecture/metadata-and-s3-optimization.md
    - docs/read-path.md
  changelog: ["0.9.0", "0.83.0"]
  changelog_bullets:
    - 'S3 read-path Tier 1 (batch 1) — parquet open hygiene, adaptive read-ahead, BDP coalescing, singleflight, S3-op observability (both modules).'
    - 'Circuit breaker'
  notes: >-
    The v0.9.0 S3 circuit breaker was removed in the VL-integration refactor (PR #37); S3
    failure and load behavior is governed by resource bounds, singleflight and adaptive
    read-ahead instead. Its changelog bullet belongs to this feature's history.
  highlight: >-
    **S3 read-path Tier 1**: parquet-open hygiene, adaptive read-ahead sized to the bandwidth-delay product, coalesced ranges, singleflight de-duplication and per-operation S3 metrics.
  description: >-
    Opening a Parquet file over an object store is dominated by round trips. This batch fixed the
    open sequence, sized read-ahead to the connection's bandwidth-delay product, coalesced nearby
    ranges into one GET, de-duplicated concurrent identical fetches and made every S3 operation
    observable so the next optimization has numbers to argue with.

- id: lh.feature.storage.read_ahead_waste_feedback
  title: Waste-feedback read-ahead
  status: shipped
  since: v0.85.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/s3reader/waste_feedback_test.go
    - internal/s3reader/adaptive_test.go#TestBufferedReaderAt_WastedBytes
    - internal/config/s3_readpath_knobs_test.go#TestS3ReadAheadWasteThreshold_DefaultAndMerge
  docs:
    - docs/architecture/metadata-and-s3-optimization.md
  changelog: ["0.85.0"]
  changelog_bullets:
    - 'S3 batch 2a — waste-feedback read-ahead: the adaptive window now SHRINKS when it fetches bytes nobody reads (both modules).'
  highlight: >-
    **Waste-feedback read-ahead**: the adaptive window shrinks when it fetches bytes nobody reads, so read-ahead stops paying for itself in wasted transfer on selective queries.
  description: >-
    Read-ahead that only grows is a bandwidth tax on point lookups. The reader tracks how much of
    each prefetched window is actually consumed and contracts the window when the waste ratio
    crosses a configurable threshold.

- id: lh.feature.storage.plan_then_fetch
  title: Plan-then-fetch exact column ranges
  status: in-progress
  since: v0.87.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/storage/parquets3/projected_fetch_test.go#TestGetFieldValues_PlannedFetch_OnlyPlannedRangesRequested
    - internal/storage/parquets3/projected_fetch_test.go#TestPlanProjectedRanges_Derivation
    - internal/s3reader/planned_fetch_test.go#TestPlannedFetch_CoalescingCorrectness
    - lakehouse-traces/internal/storage/parquets3/projected_fetch_test.go#TestRunQuery_PlannedVsWindow_Equivalence_Traces
    - internal/config/s3_readpath_knobs_test.go#TestS3ProjectedFetchKnobs_DefaultsMergeValidate
  docs:
    - docs/architecture/metadata-and-s3-optimization.md
    - docs/read-path.md
  changelog: ["0.87.0"]
  changelog_bullets:
    - 'S3 Tier-2 plan-then-fetch: column-projected reads now fetch EXACT coalesced column-chunk ranges — no speculative window (both modules).'
  highlight: >-
    **Plan-then-fetch**: a projected read plans the exact column-chunk byte ranges it needs and fetches those, coalesced — no speculative window at all. Opt-in per signal while the benchmark gate decides whether it becomes the default.
  description: >-
    With the footer in hand the reader knows precisely which byte ranges a projection touches,
    so it can ask for those and nothing else. It is opt-in until it beats the windowed path on
    every benchmark scenario at both latency profiles — the graduation rule for any performance
    default in this repo.

- id: lh.feature.storage.planned_fetch_v2
  title: Planned-fetch v2 levers (footer prefetch, span concurrency, gap discipline)
  status: in-progress
  since: v0.88.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/s3reader/planned_fetch_test.go#TestPlannedFetch_V2LeversSimMeasurement
    - internal/s3reader/planned_fetch_test.go#TestPlannedFetch_MaxInflightRespected
    - internal/s3reader/planned_fetch_test.go#TestPlannedFetch_SpanCapSplits
    - internal/storage/parquets3/projected_fetch_test.go#TestFooterPrefetch_OversizeFooterFitsPerSignalDefault
    - internal/config/s3_readpath_knobs_test.go#TestS3PlannedFetchV2Knobs_DefaultsMergeValidate
  docs:
    - docs/architecture/metadata-and-s3-optimization.md
    - docs/benchmarks/full-scope-s3.md
  changelog: ["0.88.0"]
  changelog_bullets:
    - 'Planned-fetch v2 slices 0+1: per-signal footer prefetch, span concurrency k=16, per-SPAN cap, gap discipline, and the S\* whole-file ladder (both modules; every slice-1 lever is opt-in-planned-path only — the `window` default is untouched).'
  highlight: >-
    **Planned-fetch v2**: per-signal footer prefetch removes the second open round trip, spans are fetched with bounded concurrency and a per-span cap, and gap discipline decides when to bridge a hole rather than split a request.
  description: >-
    The v2 levers attack the measured causes of cold-open latency: two serial round trips per
    file, a per-plan cap that punished the very coalescing that removes GETs, and too little
    concurrency across the spans of one file. Every lever is confined to the opt-in planned path
    so the default read path is unchanged until the numbers say otherwise.

- id: lh.feature.storage.wildcard_range_read
  title: Lazy range reads for wildcard queries
  status: shipped
  since: v0.87.0
  area: storage
  surfaces: [storage]
  tests:
    - internal/storage/parquets3/range_reader_test.go#TestShouldUseWildcardRangeRead
    - lakehouse-traces/internal/storage/parquets3/range_reader_test.go#TestShouldUseWildcardRangeRead
    - internal/storage/parquets3/range_reader_test.go#TestShouldUseRangeRead
  docs:
    - docs/read-path.md
    - docs/architecture/metadata-and-s3-optimization.md
  highlight: >-
    **Wildcard range reads**: a wildcard query over large files opens them through a lazy S3 ReaderAt instead of downloading each file whole, bounding heap to the working row-group set rather than cumulative file bytes.
  description: >-
    Buffered full downloads made wildcard scans scale with worker count times file size. Above a
    size threshold the reader switches to reading row groups through a range-reading ReaderAt, so
    peak memory follows the working set instead of the fleet's concurrency.

- id: lh.feature.storage.row_group_geometry
  title: Row-group geometry and statistics pruning
  status: shipped
  since: v0.8.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/storage/parquets3/rg_skip_test.go
