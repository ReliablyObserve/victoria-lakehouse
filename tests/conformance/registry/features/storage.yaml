  docs:
    - docs/architecture/restart-and-warmup-design.md
    - docs/cache-architecture.md
  highlight: >-
    **Metadata persistence**: manifest, label index, cache metadata, and smart cache snapshots survive restarts.
  description: >-
    Everything expensive to rebuild is snapshotted to disk and reloaded on start: the manifest,
    the label index, the Parquet footer cache and the smart cache's entry metadata. A restarted
    pod serves from warm metadata instead of re-listing S3.

