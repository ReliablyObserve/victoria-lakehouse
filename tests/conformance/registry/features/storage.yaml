- id: lh.feature.storage.schema_registry
  title: Schema registry with typed columns
  status: shipped
  since: v0.9.0
  area: storage
  readme_section: Read Path
  surfaces: [storage]
  tests:
    - internal/schema/registry_test.go
    - internal/schema/verify_test.go
  docs:
    - docs/storage-flow.md
    - docs/open-parquet-format.md#column-naming-convention
  highlight: >-
    **Schema-driven FieldType system**: centralized type-aware formatting for all Parquet column types (INT64 nanoseconds to RFC3339Nano, INT32 to decimal, etc.) via `FieldType.FormatValue()`. Eliminates scattered `fmt.Sprintf`/`time.Format` calls — all query paths use the schema registry for consistent output.
  description: >-
    One registry carries every column's Parquet type and how to render it, so a timestamp reads
    the same whether it came back through LogsQL, the stats API or the UI. Formatting bugs are
    fixed once, in the registry, instead of at each call site.

- id: lh.feature.storage.schema_autodiscovery
  title: OTLP schema auto-discovery and promoted columns
  status: shipped
  since: v0.9.0
  area: storage
  readme_section: Infrastructure
  surfaces: [storage, flag]
  tests:
    - internal/schema/registry_parity_test.go
    - internal/schema/label_columns_test.go
  docs:
    - docs/open-parquet-format.md#column-naming-convention
    - docs/configuration.md
  highlight: >-
    **Schema auto-discovery**: OTLP column names in Parquet, mapped to VL/VT names at query time. Schema registry carries per-column type information (FieldType) for type-aware formatting, extensible via `--lakehouse.schema.extra-promoted` with typed columns (string, int32, int64, float64, bool, timestamp_nano).
  description: >-
    Files keep OTLP-native column names so external engines see familiar schemas, while queries
    keep VL/VT field names; the registry maps between them. Operators can promote additional
    attributes to typed columns without a code change.

- id: lh.feature.storage.dedicated_columns
  title: Dedicated columns for hot attributes
  status: shipped
  since: v0.90.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/schema/dedicated_test.go
    - internal/storage/parquets3/dedicated_equivalence_test.go
    - internal/storage/parquets3/dedicated_e2e_test.go#TestDedicated_E2E_PromotedColumn
    - internal/vlstorage/slot_e2e_test.go#TestTier2_SlotRoundTrip
    - lakehouse-traces/internal/storage/parquets3/dedicated_equivalence_test.go
  docs:
    - docs/architecture/dedicated-columns.md#two-tiers
    - docs/benchmarks/dedicated-columns.md
  changelog: ["0.90.0"]
  changelog_bullets:
    - 'Dedicated columns (Tier 1): promote hot OTel attributes out of the maps into typed Parquet columns.'
    - 'Dedicated columns (Tier 2): operator-configurable custom-attribute promotion.'
  highlight: >-
    **Dedicated columns**: the highest-volume OTel attributes are promoted out of the attribute maps into typed Parquet columns — smaller files and order-of-magnitude faster filters on promoted keys, with Tier 2 letting operators promote their own keys.
  description: >-
    Tier 1 promotes a fixed set of hot OTel attributes; Tier 2 lets an operator name their own.
    Promoted keys become first-class columns with statistics and projection, so filters on them
    prune row groups instead of decoding attribute maps. Equivalence tests assert a promoted key
    answers exactly what the map-stored form answered.

