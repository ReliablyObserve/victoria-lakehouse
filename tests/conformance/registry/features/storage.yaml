  highlight: >-
    **Row-group pruning**: min/max statistics and the page index skip row groups and pages before any decode, with row-group size scheduled by the age and level of the data.
  description: >-
    Files are written with a row-group geometry chosen for the access pattern, and reads use the
    standard Parquet statistics and page index to skip everything the predicate excludes. Both
    sides are tested, including the out-of-order page-bound cases that first exposed the
    aggregation bug behind them.

- id: lh.feature.storage.zstd_compression
  title: ZSTD compression tuning by age
  status: shipped
  since: v0.85.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/storage/parquets3/writer_test.go#TestWriteLogsParquet_CompressionLevels
    - internal/compaction/ttl_compression_test.go
    - internal/config/config_test.go#TestCompressionLevelForOutput_GlobalSchedule
    - internal/storage/parquets3/writer_realdata_bench_test.go#TestRealDataCompressionBenchmark
  docs:
    - docs/zstd-compression-benchmark.md
    - docs/open-parquet-format.md
  highlight: >-
    **Age-aware compression**: compression level steps up as data ages and is compacted, so recent data stays cheap to write while archives get the ratio — measured on real e2e data, not guessed.
  description: >-
    Ingest writes at a level chosen for throughput; each compaction level re-encodes at a higher
    level. The schedule is configurable, and the repo carries the measured benchmark that chose
    the defaults.

- id: lh.feature.storage.retention
  title: Retention enforcement
  status: shipped
  since: v0.9.0
  area: storage
  surfaces: [flag, storage]
  tests:
    - internal/retention/retention_test.go
    - internal/retention/coverage_hardening_test.go
    - tests/e2e/smoke_components_test.go#TestSmoke_Retention_ConfigLoaded
  docs:
    - docs/configuration.md
    - docs/deletion-strategy.md
  highlight: >-
    **Retention**: aged partitions are removed on a schedule, per fleet or per tenant, with the manifest and metadata updated in the same pass.
  description: >-
    Retention deletes what is past its window and keeps the manifest honest about it. Per-tenant
    retention overrides shadow the global window so one tenant's compliance requirement does not
    dictate the fleet's.

- id: lh.feature.storage.lifecycle_tiering
  title: S3 storage-class lifecycle tiering
  status: shipped
