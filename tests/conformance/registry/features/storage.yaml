  changelog: ["0.100.0"]
  changelog_bullets:
    - 'Per-field storage/metadata size stats — foundation.'
  highlight: >-
    **Per-field size accounting**: how many on-S3 bytes each field costs, in data and in metadata, computed from partition metadata rather than estimated.
  description: >-
    The size of every field — its column bytes on S3 and the metadata bytes it costs in the
    partition bundle — is accounted per partition and rolled up, which is what makes the UI's
    per-field storage tables and the cardinality explorer's cost column exact rather than a
    share-out of a total.

- id: lh.feature.storage.pmeta
  title: Unified partition metadata (pmeta) with field/value catalog
  status: shipped
  since: v0.79.0
  area: storage
  surfaces: [storage, flag]
  tests:
    - internal/pmeta/bundle_test.go
    - internal/pmeta/facet_field_catalog_test.go
    - internal/storage/parquets3/pmeta_integration_test.go
    - internal/storage/parquets3/pmeta_wire_test.go
    - lakehouse-traces/internal/storage/parquets3/pmeta_integration_test.go
  docs:
    - docs/architecture/metadata-consolidation.md
