  changelog: ["0.79.0"]
  changelog_bullets:
    - 'pmeta — unified partition-metadata layer + field/value catalog (`-lakehouse.pmeta.enabled`, off by default).'
  highlight: >-
    **Unified partition metadata**: one metadata object per partition carries file statistics, the field/value catalog and bloom facets — one read serving every consumer instead of a sidecar per concern.
  description: >-
    pmeta replaces the per-file metadata sidecars with a single bundle per partition: file
    statistics, the field and value catalog behind field-name/value queries and the cardinality
    explorer, and bloom facets for file skipping. One GET answers what several used to, and the
    bundle is the unit that is cached, rebuilt and tenant-scoped.

