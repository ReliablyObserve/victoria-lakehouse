# Storage features: the on-S3 format, the partition manifest, the unified
# partition-metadata layer, and how bytes are fetched back out of S3.

- id: lh.feature.storage.open_parquet_format
  title: Plain, tool-readable Parquet on S3
  status: shipped
  since: v0.8.0
  area: storage
  surfaces: [storage]
  tests:
    - internal/storage/parquets3/writer_test.go#TestWriteLogsParquet
    - internal/storage/parquets3/footer_parse_test.go#TestParseFooterFromBytes_WideSchema23Cols
    - internal/schema/verify_test.go
    - scripts/ci/parquet-readback/verify.py
  docs:
    - docs/open-parquet-format.md#s3-layout
    - docs/open-parquet-format.md#querying-with-external-tools
  highlight: >-
    **Open Parquet on S3**: every object is a standard Parquet file with no custom framing, so DuckDB, pyarrow, ClickHouse, Trino and Spark read the same bytes Lakehouse queries — Lakehouse metadata rides in the footer key-value area or in sidecars, never in a proprietary container.
  description: >-
    The storage format is the product's contract with its users: data written by Lakehouse stays
    readable by any Parquet engine, with no import step and no vendor decoder. Lakehouse-specific
    metadata (the trace index, partition metadata) is carried in standard footer key-value
    metadata or in separate objects, so stripping Lakehouse never strips the data.

- id: lh.feature.storage.manifest
  title: Partition manifest with label pruning
  status: shipped
  since: v0.7.0
  area: storage
  readme_section: Write Path
  surfaces: [api, storage]
  rows: [lh.manifest.range.schema, lh.manifest.partitions.schema]
  tests:
    - internal/manifest/manifest_test.go
    - internal/manifest/api_test.go
    - internal/manifest/manifest_range_test.go
    - internal/manifest/refresh_tenantscoped_test.go
  docs:
    - docs/manifest-system.md#data-structures
    - docs/manifest-system.md#api-endpoints
  changelog: ["0.7.0", "0.8.0"]
  changelog_bullets:
    - 'Manifest management'
    - 'Manifest label pruning'
    - 'Manifest partitions API'
    - 'GetPartitions()'
    - 'PartitionsHandler'
  highlight: >-
    **Manifest label pruning**: `FileInfo.Labels` enables query-time file skipping based on label values without opening Parquet files.
  description: >-
    The manifest is the index of what exists: which files cover which time range, for which
    tenant, with which labels and row counts. It answers "is there anything here at all" without
    an S3 GET, prunes files by label before any Parquet is opened, and exposes the partition and
    range APIs the select side and the hot-boundary discovery use.

- id: lh.feature.storage.manifest_fastpath
  title: Manifest fast path for empty and metadata-only queries
  status: shipped
  since: v0.8.0
