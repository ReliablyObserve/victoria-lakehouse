# Compaction features: how small files become large ones, who decides to do
# it, and what the rollups repair on the way.

- id: lh.feature.compaction.level_based
  title: Level-based background compaction
  status: shipped
  area: compaction
  surfaces: [storage, flag]
  rows: [lh.stats.compaction.schema]
  tests:
    - internal/compaction/policy_test.go
    - internal/compaction/compactor_test.go
    - internal/compaction/scheduler_test.go
    - internal/compaction/integration_test.go
    - internal/compaction/planner_test.go
    - internal/compaction/per_tenant_planning_test.go
    - internal/compaction/property_test.go#TestStorageHealth_CompactionProperties
    - internal/compaction/fault_matrix_test.go
    - internal/compaction/concurrency_test.go
    - internal/compaction/tenant_paths_test.go
    - internal/manifest/compaction_groups_test.go
  docs:
    - docs/operations.md
    - docs/write-path.md
  changelog_bullets:
    - 'Level-based Parquet compaction'
  highlight: >-
    **Level-based compaction**: small flush-time files are rolled up level by level into large immutable objects, so file count stays bounded as data ages instead of growing with ingest.
  description: >-
    Ingest optimizes for latency and produces many modest files; compaction optimizes for reads
    and cost, merging them upward through levels. Each level re-encodes at a higher compression
    level and a larger row-group size, which is also exactly the shape S3 lifecycle transitions
    want.

- id: lh.feature.compaction.election_free
  title: Election-free compaction ownership
  status: shipped
  since: v0.37.3
  area: compaction
  surfaces: [storage]
  tests:
    - internal/compaction/ownership_test.go
    - internal/compaction/ownership_coverage_test.go
    - internal/compaction/scheduler_test.go#TestScheduler_NoOwnership_NoWork
    - internal/compaction/fair_share_test.go
  docs:
    - docs/operations.md
    - docs/petabyte-scale-audit.md
  changelog_bullets:
    - 'Election-free compaction (spec 2026-05-31)'
    - 'Leader election'
    - 'K8s leader election test pyramid'
    - 'Real-K8s e2e for leader election'
    - '`internal/election/README.md` + `RUNBOOK.md`'
  notes: >-
    Supersedes the Kubernetes lease leader election shipped in v0.10.0 and hardened in v0.37.1;
    that package was removed in v0.37.3, so its changelog bullets belong to this feature's
    history.
  highlight: >-
    **Election-free compaction**: every pod derives which partitions it owns from the ring, so compaction needs no leader, no lease and no split-brain handling — a pod that loses ownership simply stops working on it.
  description: >-
    Leader election made compaction a single point of coordination and a source of K8s lease
    churn. Deriving ownership deterministically from the hash ring gives the same
    "exactly-one-worker-per-partition" property with fair sharing across the fleet, and makes
    scale-up and scale-down uneventful.

- id: lh.feature.compaction.hints_manual_trigger
  title: Compaction hints and manual recompaction
  status: shipped
  area: compaction
  surfaces: [api]
  tests:
    - internal/compaction/recompact_trigger_test.go#TestRecompactHandler
    - internal/compaction/recompact_trigger_test.go#TestForceCompactPartition_E2E_FragmentedClears
    - internal/compaction/recompact_hint_test.go#TestRecompactionLevel
    - internal/compaction/recompact_e2e_test.go#TestRecompact_E2E_StaleSchemaDrivesCompaction
    - internal/manifest/compaction_candidates_test.go#TestComputeCompactionStats
  docs:
    - docs/operations.md
  changelog_bullets:
    - 'Compaction hints + manual recompaction trigger.'
  highlight: >-
    **Compaction hints and a manual trigger**: the stats API says which partitions would benefit from recompaction and why, and `POST /lakehouse/compaction/recompact` acts on it without waiting for the schedule.
  description: >-
    Operators need an answer to "is this partition fragmented, and can I fix it now". Hints rank
    candidates by fragmentation and schema staleness; the trigger compacts a named partition on
    demand, which is also how a schema change is rolled forward deliberately.

- id: lh.feature.compaction.bloom_retention
  title: Combined bloom retention across merges
  status: shipped
  area: compaction
  surfaces: [storage, api]
  tests:
    - internal/compaction/combined_bloom_test.go#TestCombinedBloomOnCompaction_E2E
    - internal/storage/parquets3/bloom_compaction_test.go#TestCompaction_RebuildBloomAfterMerge
    - internal/stats/compaction_handler_test.go#TestHandleCompaction
    - internal/compaction/coverage_hardening_test.go#TestCompactor_WithBloomRebuilder
  docs:
    - docs/bloom-index.md
    - docs/operations.md
  changelog_bullets:
    - 'Compaction retains the combined bloom of all merged parquets + exposes bloom footprint in stats.'
  highlight: >-
    **Blooms survive compaction**: a merged file carries the combined bloom of all its inputs, so point lookups stay fast after a rollup instead of falling back to a full scan — with the bloom footprint reported in stats.
  description: >-
    Losing the bloom on compaction would trade write cost for read cost silently. The compactor
    rebuilds the filter for the merged output and reports how many bytes the blooms cost, so the
    trade-off is visible rather than assumed.

- id: lh.feature.compaction.attribute_repromotion
  title: Attribute re-promotion during compaction
  status: shipped
  area: compaction
  surfaces: [storage]
  tests:
    - internal/vlstorage/repromote_test.go#TestRepromoteLogRow
    - internal/vlstorage/repromote_test.go#TestRepromoteLogRow_Tier2Slots
    - lakehouse-traces/internal/vlstorage/repromote_test.go#TestRepromoteTraceRow
    - lakehouse-traces/internal/vlstorage/repromote_test.go#TestRepromoteTraceRow_Tier2Slots
    - internal/storage/parquets3/dedicated_equivalence_test.go#TestDedicated_DualReadEquivalence_Logs
    - internal/compaction/recompact_e2e_test.go#TestRecompact_E2E_StaleSchemaDrivesCompaction
  docs:
    - docs/architecture/dedicated-columns.md
    - docs/operations.md
  changelog_bullets:
    - 'Compaction re-promotes map-stored attributes into dedicated columns (heals old files forward).'
  highlight: >-
    **Schema healing forward**: when a key is promoted to a dedicated column, compaction rewrites older files that stored it in the attribute map, so the whole history gradually gains the faster layout without a migration job.
  description: >-
    A promotion that only applies to new files leaves a permanent seam in query performance.
    Compaction closes it: files written under an older schema are re-promoted through the same
    mappers ingest uses as they are merged, and partitions still holding stale-schema files are
    picked for recompaction even when the level policy alone would leave them.

- id: lh.feature.compaction.row_group_by_level
  title: Row-group size by output level
  status: shipped
  area: compaction
  surfaces: [flag, storage]
  tests:
    - internal/compaction/rowgroup_schedule_test.go
    - internal/config/rowgroup_schedule_test.go
    - internal/config/config_test.go#TestDefaultConfig_CompactionCompressionSchedule
  docs:
    - docs/configuration.md
    - docs/performance.md
  changelog_bullets:
    - 'Compression step 4 — 2× row groups on L2+ rollups: `compaction.row_group_size_by_output_level` (both modules).'
  highlight: >-
    **Row groups grow with level**: L2 and higher rollups double their row-group size, which measurably cuts row-group count and metadata on aged data at the same file size.
  description: >-
    Aged data is scanned in bulk and pruned coarsely, so larger row groups are strictly better
    there, while recent data keeps small groups for selective queries. The schedule is a
    configuration table, not a constant.

- id: lh.feature.compaction.lifecycle_freeze
  title: Compaction keeps away from tiered objects
  status: shipped
  area: compaction
  surfaces: [storage, flag]
  tests:
    - internal/compaction/lifecycle_freeze_test.go
    - internal/compaction/size_cap_test.go
    - internal/compaction/refresh_class_test.go
    - internal/compaction/freeze_warnings_test.go
    - internal/compaction/per_tenant_planning_test.go#TestScan_NeverRewritesTieredObjects
    - internal/compaction/tenant_paths_test.go#TestTierA_RespectsFreeze
    - internal/compaction/tenant_paths_test.go#TestForceCompactPartition_RespectsFreeze
    - internal/manifest/class_from_list_test.go
    - internal/delete/storageclass_transition_test.go
    - cmd/lakehouse-logs/compaction_freeze_test.go
    - lakehouse-traces/compaction_freeze_test.go
  docs:
    - docs/operations.md
    - docs/observability.md
    - docs/write-path.md
  highlight: >-
    **Compaction keeps away from tiered objects**: it skips objects the bucket listing reports outside STANDARD, partitions past the first mirrored lifecycle transition, and old data with no mirrored rule, so it does not trigger retrieval fees, early-deletion charges or Glacier errors.
  description: >-
    Rewriting an object after lifecycle moved it costs a retrieval fee plus the early-deletion
    charge, and fails outright in Glacier Flexible Retrieval and Deep Archive. The storage class
    of each object comes from the manifest's bucket listing refresh, at no extra request, and
    compaction skips every class that is not STANDARD or INTELLIGENT_TIERING. Between refreshes,
    and for objects S3 has not moved yet, the lifecycle rules mirrored in the config apply
    (delete.lifecycle_rules, per-tenant overrides, stats.s3_lifecycle_rules): a partition older
    than the first transition minus a margin is skipped. A tenant with no rule gets no size
    merges on partitions older than compaction.size_merge_max_age (7 days by default). Lakehouse
    never issues a HEAD to learn a class, and the Intelligent-Tiering archive tiers are not
    detected. The manual recompact trigger and the orphan sweep honour the same rules.
