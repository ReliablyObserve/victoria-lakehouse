# Ingest features: everything between "a client sends rows" and "a Parquet
# file exists on S3". Schema: registry/features.go (Feature.Validate).

- id: lh.feature.ingest.vl_insert_protocols
  title: Full VictoriaLogs insert protocol surface
  status: shipped
  area: ingest
  readme_section: Write Path
  surfaces: [api, ingest]
  tests:
    - tests/e2e/roundtrip_test.go#TestRoundTrip_Logs_InsertAndQuery
    - internal/upstreamreuse/upstreamreuse_test.go#TestVLVTSymbolsAreImported
    - tests/conformance/drift_test.go#TestCheckDrift_AgreesWithCoverageDocOnInsertPrefixes
  docs:
    - docs/write-path.md
    - docs/getting-started.md
  changelog_bullets:
    - 'VL-compatible insert APIs'
  highlight: >-
    **Full VL insert protocol support**: jsonline, Loki (JSON + protobuf), ES bulk, syslog, journald, Datadog, OTLP, Splunk, native insert — all via VL's upstream `vlinsert` handlers.
  description: >-
    Lakehouse mounts the upstream `vlinsert` handlers instead of re-implementing them, so every
    ingest protocol VictoriaLogs speaks is accepted unchanged and stays in step with the pinned
    upstream. The Lakehouse delta is the storage behind them: rows land in the insert buffer and
    are flushed to Parquet on S3 rather than into local hot storage.

- id: lh.feature.ingest.crash_safe_durability
  title: Crash-safe durability without a WAL
  status: shipped
  area: ingest
  readme_section: Write Path
  surfaces: [ingest, flag]
  tests:
    - internal/storage/parquets3/buffer_flusher_segments_test.go
    - internal/storage/parquets3/buffer_restart_test.go
    - internal/vlstorage/insert_adapter_test.go
    - internal/manifest/segments_test.go
    - internal/compaction/scheduler_segments_test.go
    - internal/delete/scheduler_test.go#TestSchedulerRunOnce_WaitsForTheBufferSegmentOfAnObject
    - internal/config/config_test.go#TestLoad_RemovedInsertKeysAreRefused
    - tests/e2e/chaos_durability_test.go#TestChaos_RestartRestoresTheBuffer
    - tests/e2e/chaos_durability_test.go#TestChaos_Kill9LosesNothingBeyondTheUpstreamWindow
    - lakehouse-traces/internal/storage/parquets3/buffer_flusher_segments_test.go
    - lakehouse-traces/internal/storage/parquets3/buffer_restart_test.go
    - lakehouse-traces/internal/vlstorage/insert_adapter_test.go
  docs:
    - docs/durability.md
    - docs/storage-flow.md
  changelog_bullets:
    - 'Write-ahead log (WAL)'
    - 'WAL integration in BatchWriter'
  notes: >-
    The original write-ahead log was replaced by the insert buffer: a sequence of upstream
    logstorage segments drained whole to Parquet; the WAL changelog bullets belong to this
    feature's history.
  highlight: >-
    **Crash-safe durability (no WAL)**: the insert buffer is a sequence of upstream logstorage segments on a persistent volume (the same engine hot VL/VT use, parts fsynced within 5 s, restored on open); every sealed segment is drained completely to Parquet — late and backfilled rows included — and a restart drains whatever is left without rewriting what is stored, so the crash-loss window matches hot VL/VT. See [Persistence & Durability](docs/durability.md).
  description: >-
    Buffered rows are persisted by the same logstorage engine the hot tier uses, so a pod that
    dies mid-window restores its segments on open. The flusher's state records which segments
    are committed and which one was being drained, so a restart writes only what is missing,
    with the same bytes and keys, and never twice. An insert is acknowledged once upstream
    has the rows, as in hot VL/VT.

- id: lh.feature.ingest.adaptive_file_sizing
  title: Adaptive Parquet file sizing
  status: shipped
  area: ingest
  readme_section: Write Path
  surfaces: [ingest, flag]
  tests:
    - internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_GroupsAreBoundedInRows
    - internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_SealPolicy
    - internal/storage/parquets3/buffer_flusher_segments_test.go#TestPlanSlices
    - lakehouse-traces/internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_GroupsAreBoundedInRows
    - lakehouse-traces/internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_SealPolicy
    - internal/storage/parquets3/raw_bytes_test.go#TestEstimateRawBytesLogs_CountsEveryStringColumn
    - lakehouse-traces/internal/storage/parquets3/raw_bytes_test.go#TestEstimateRawBytesTraces_CountsEveryStringColumn
  docs:
    - docs/write-path.md
    - docs/configuration.md
  changelog_bullets:
    - 'Adaptive file sizing'
  highlight: >-
    **Adaptive file sizing**: a buffer segment is sealed early once its estimated size approaches `insert.target_file_size`, and is written in objects of at most that size, for optimal Parquet file sizes with bounded flush memory.
  description: >-
    The flusher seals a segment when its estimated size approaches the configured target (or
    after the flush interval) and plans each tenant's objects from the segment's per-second row
    counts, so files land in the size band that keeps S3 request counts and row-group geometry
    sane instead of being dictated by wall-clock flush intervals alone, and one object is all
    that is ever in memory.

- id: lh.feature.ingest.atomic_s3_writes
  title: Atomic single-PutObject Parquet writes
  status: shipped
  since: v0.8.0
  area: ingest
  readme_section: Write Path
  surfaces: [storage, ingest]
  tests:
    - internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_FailedPutIsRetriedWithTheSameBytes
    - internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_LateRowsReachParquet
    - lakehouse-traces/internal/storage/parquets3/buffer_flusher_segments_test.go#TestSegments_FailedPutIsRetriedWithTheSameBytes
  docs:
    - docs/write-path.md
    - docs/durability.md
  highlight: >-
    **Atomic S3 writes**: each Parquet file is written via a single S3 PutObject (1x write amplification). No WAL replay deduplication, no compactor reconciliation — contrast with Loki/Tempo's 3-5x write amplification from WAL→chunk→S3 pipelines.
  description: >-
    A drain produces complete Parquet objects per (partition, tenant, slice) and uploads each with
    one PutObject, so a file is either absent or complete — there is no partially visible object to
    reconcile, and write amplification stays at 1x.

- id: lh.feature.ingest.buffer_query_bridge
  title: Buffer query bridge across insert pods
  status: shipped
  area: ingest
  readme_section: Write Path
  surfaces: [api, ingest]
  tests:
    - internal/buffer/handler_test.go
    - internal/storage/parquets3/buffer_bridge_test.go
    - internal/storage/parquets3/buffer_bridge_az_test.go
    - lakehouse-traces/internal/storage/parquets3/buffer_bridge_az_test.go
  docs:
    - docs/write-path.md
    - docs/read-path.md
  changelog_bullets:
    - 'Buffer query bridge'
  highlight: >-
    **Buffer query bridge**: select pods fan out to ALL insert pods across ALL AZs via `/internal/buffer/query` for zero-delay reads of unflushed data. AZ-aware routing is only used for peer cache (L3), never for buffer queries — same-AZ-only would miss 2/3 of buffered rows in a 3-AZ deployment.
  description: >-
    Rows are queryable the moment they are accepted: a select pod asks every insert pod for its
    unflushed window over `/internal/buffer/query` and merges the answer with what S3 already
    holds. The fan-out is deliberately AZ-blind — buffered rows live wherever the writer that
    accepted them runs.

- id: lh.feature.ingest.logstore_buffer
  title: Engine-native queryable insert buffer
  status: shipped
  area: ingest
  surfaces: [ingest]
  tests:
    - internal/membuffer/store_test.go
    - internal/storage/parquets3/local_buffer_readmerge_test.go#TestQueryBufferBridge_LocalBufferServesRecent
    - internal/storage/parquets3/buffer_view_test.go#TestBufferView_EachRowOnceThroughTheWholeHandoff
    - internal/vlstorage/buffer_rows_test.go
    - lakehouse-traces/internal/storage/parquets3/buffer_view_test.go#TestBufferView_EachRowOnceThroughTheWholeHandoff
    - lakehouse-traces/internal/storage/parquets3/buffer_view_test.go#TestBufferView_TraceByIDThroughTheHandoff
  docs:
    - docs/read-path.md
    - docs/storage-flow.md
  changelog_bullets:
    - 'Option B — logstorage-native queryable buffer (cold-tier recently-flushed parity).'
    - 'Option B — logstorage-native queryable insert buffer (cold-tier recently-flushed parity with hot VT).'
  highlight: >-
    **Engine-native insert buffer**: recently ingested rows are held in the upstream logstorage engine and answered through the same query path as flushed data, so the recently-flushed window matches hot VL/VT instead of degrading.
  description: >-
    Instead of a bespoke in-memory buffer with its own query semantics, the insert buffer is the
    upstream logstorage engine itself. Queries read buffered and flushed rows through one path;
    the objects a buffered segment wrote carry its nonce and are dropped from the scan while the
    segment is served, so a row is answered exactly once at every stage of the drain.

- id: lh.feature.ingest.label_extraction
  title: Write-time label extraction for manifest pruning
  status: shipped
  area: ingest
  surfaces: [storage, ingest]
  tests:
    - internal/storage/parquets3/labels_test.go
    - internal/storage/parquets3/writer_test.go#TestUploadGroups_PopulatesLabels
    - internal/schema/label_columns_test.go
    - internal/compaction/labels_merge_test.go
  docs:
    - docs/manifest-system.md
    - docs/write-path.md
  changelog_bullets:
    - 'Label extraction'
  highlight: >-
    **Write-time label extraction**: the values a query is most likely to filter on are recorded per file at flush time, so the manifest can skip files without opening them.
  description: >-
    The writer extracts the label values present in each flushed file and stores them on the
    manifest entry. Compaction merges the label sets of its inputs so the pruning information
    survives rollups.
