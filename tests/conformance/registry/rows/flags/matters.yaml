  surface: vl
  kind: flag
  origin: native
  expect: pass
  targets: [hot, cold]
  upstream: { flag: internaldelete.enable }
  compare: { type: error, options: { hot_status: "400", cold_status: "400", body_prefix: "requests to /internal/delete/* are disabled" } }
  layers: [api]
  pending: true
  notes: "Default off on both sides. The logs binary mounts vlselect.RequestHandler for /internal/delete/*, so the flag and its answers are upstream's."

