- id: vl.flag.max_backfill_age
  title: "-maxBackfillAge — cold tiering changes the effective backfill window"
  surface: vl
  kind: flag
  origin: native
  expect: differ
  differ_note: "Hot enforces maxBackfillAge against local storage retention; once data tiers to cold, the age check has no local-storage analog and the LH compaction/retention path governs instead. See docs/parity-and-gaps.md."
  targets: [hot, cold]
  upstream: { flag: maxBackfillAge }
  compare: { type: status }
  layers: [api]
  pending: true

