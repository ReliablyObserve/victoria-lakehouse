# Flags that matter: only flags that changed between versions, or that touch
# LH compatibility (queueing/admission, retention, insert limits, cold-tier
# lookbehind windows). kind: flag rows need no `request` and no `seed`.
#
# Flags without a row here are the drift gate's SOFT warnings: the upstream
# binary registers them, Lakehouse inherits whatever they do, and no Lakehouse
# behaviour depends on the difference. Ingest-format knobs (syslog.*, splunk.*,
# journald.*, datadog.*, loki.*), storage-node/TLS plumbing (storageNode.*),
# local-disk and auth-key knobs (storageDataPath, *AuthKey,
# inmemoryDataFlushInterval, retention.maxDisk*) and the internal peer
# transport caps (internalinsert.*, internalselect.*) are all in that class:
# they are either pre-storage admission control Lakehouse mounts verbatim, or
# they act on the hot local storage Lakehouse replaces wholesale. The triage is
# summarised in tests/conformance/README.md.

- id: vl.flag.search_max_concurrent_requests
  title: "-search.maxConcurrentRequests — admission control, same semantics on LH"
  surface: vl
  kind: flag
  origin: native
  expect: pass
  targets: [hot, cold]
  upstream: { flag: search.maxConcurrentRequests }
  compare: { type: status }
  layers: [api]
  pending: true

- id: vl.flag.search_max_queue_duration
  title: "-search.maxQueueDuration — VL queues, LH returns 429"
  surface: vl
  kind: flag
  origin: native
  expect: differ
  differ_note: "vlselect's queue is not linked into LH; LH's query.max_concurrent admission control rejects immediately instead of queueing. See docs/parity-and-gaps.md."
  targets: [hot, cold]
  upstream: { flag: search.maxQueueDuration }
  compare: { type: status }
  layers: [api]
  pending: true

