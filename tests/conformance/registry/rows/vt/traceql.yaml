# VT TraceQL metrics functions — one row per upstream function, via
# /select/tempo/api/metrics/query_range. Metrics results are time series.

- id: vt.traceql.rate.basic
  title: "TraceQL metrics function rate()"
  surface: vt
  kind: traceql
  origin: native
  expect: pass
  targets: [hot, cold, global]
  seed: [traces.base]
  upstream: {traceql: rate}
  request: {method: GET, path: /select/tempo/api/metrics/query_range, params: {q: "{ } | rate()", start: "{{seed.start}}", end: "{{seed.cold_end}}", step: "15s"}}
  compare: {type: series, options: {rel_tolerance: "0.02"}}
  layers: [api]
  pending: true

