# VT /insert/* ingest families. Comparator is `count` (spans ingested vs. spans
# retrievable). The rows whose route the ingest parity matrix sends data to, or
# probes, run in CI (tests/e2e/ingest_matrix_test.go, docs/ingest-parity.md) and carry
# refs; the others stay pending: true.

- { id: vt.insert.otel_traces_json.count, title: "/insert/opentelemetry/v1/traces — OTLP/HTTP traces, JSON body", surface: vt, kind: insert, origin: native, expect: differ, differ_note: "Known divergence from hot, tracked: a trace_id query returns each flushed span twice while the buffer still holds it (https://github.com/ReliablyObserve/victoria-lakehouse/issues/279). Executed by the ingest parity matrix (docs/ingest-parity.md#known-gaps).", targets: [hot], seed: [traces.base], upstream: { route: /insert/opentelemetry/v1/traces }, request: { method: POST, path: /insert/opentelemetry/v1/traces, headers: { Content-Type: "application/json", AccountID: "{{tenant.account}}", ProjectID: "{{tenant.project}}" } }, compare: { type: count }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Traces] } }
- { id: vt.insert.otel_traces_protobuf.count, title: "/insert/opentelemetry/v1/traces — OTLP/HTTP traces, protobuf body", surface: vt, kind: insert, origin: native, expect: differ, differ_note: "Known divergence from hot, tracked: a trace_id query returns each flushed span twice while the buffer still holds it (https://github.com/ReliablyObserve/victoria-lakehouse/issues/279); spans are stored with VictoriaLogs' default _msg text instead of VictoriaTraces' - (https://github.com/ReliablyObserve/victoria-lakehouse/issues/332). Executed by the ingest parity matrix (docs/ingest-parity.md#known-gaps).", targets: [hot], seed: [traces.base], upstream: { route: /insert/opentelemetry/v1/traces }, request: { method: POST, path: /insert/opentelemetry/v1/traces, headers: { Content-Type: "application/x-protobuf" } }, compare: { type: count }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Traces] } }
- { id: vt.insert.ready.status, title: "/insert/ready — ingest readiness probe", surface: vt, kind: insert, origin: native, expect: pass, targets: [hot, cold], seed: [traces.base], upstream: { route: /insert/ready }, request: { method: GET, path: /insert/ready }, compare: { type: status }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Probes] } }
- { id: vt.internal.insert.count, title: "/internal/insert — peer-to-peer ingest replication", surface: vt, kind: internal, origin: native, expect: pass, targets: [global], seed: [traces.base], upstream: { route: /internal/insert }, request: { method: POST, path: /internal/insert }, compare: { type: count }, layers: [api], pending: true }

- id: vt.insert.native.differ
  title: "/insert/native — VT native binary protocol ingest (VT 0.11.0+)"
  surface: vt
  kind: insert
  origin: native
  expect: differ
  differ_note: "Known divergence from hot, tracked: spans are stored with VictoriaLogs' default _msg text instead of VictoriaTraces' - (https://github.com/ReliablyObserve/victoria-lakehouse/issues/332); a trace_id query returns each flushed span twice while the buffer still holds it (https://github.com/ReliablyObserve/victoria-lakehouse/issues/279). Executed by the ingest parity matrix (docs/ingest-parity.md#known-gaps)."
  since: { vt: "0.11.0" }
  targets: [hot]
  seed: [traces.base]
  upstream: { route: /insert/native }
  request: { method: POST, path: /insert/native }
  compare: { type: count }
  layers: [api]
  refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Traces] }

