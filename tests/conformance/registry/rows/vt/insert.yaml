  kind: insert
  origin: native
  expect: differ
  differ_note: "Live at the pinned VT 0.11.0: lakehouse-traces mounts vtinsert.RequestHandler wholesale, so the route is served. End-to-end native ingest through the cold tier (a vtagent payload landing in Parquet) is not exercised yet — the verification round covers it (docs/parity-and-gaps.md)."
  since: { vt: "0.11.0" }
  targets: [hot]
  seed: [traces.base]
  upstream: { route: /insert/native }
  request: { method: POST, path: /insert/native }
  compare: { type: count }
  layers: [api]
  pending: true

