- id: vt.tempo.v2_search_tag_values.span_kind_strings
  title: "/select/tempo/api/v2/search/tag/kind/values — span kind as strings (VT 0.10.0+)"
  surface: vt
  kind: select
  origin: native
  expect: differ
  differ_note: "Both tiers now run VT 0.11.0, which returns span kind values as strings (SPAN_KIND_SERVER, ...) rather than the pre-0.10.0 ints; the cold tier must produce the same strings, which the parity run checks (docs/parity-and-gaps.md)."
  since: { vt: "0.10.0" }
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/v2/search/tag/ }
  request: { method: GET, path: "/select/tempo/api/v2/search/tag/kind/values", params: { start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
