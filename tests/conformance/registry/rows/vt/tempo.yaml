- id: vt.tempo.search.spansets_full
  title: "/select/tempo/api/search — full spanSets response shape (VT 0.9.4+)"
  surface: vt
  kind: select
  origin: native
  expect: differ
  differ_note: "The pinned VT 0.11.0 returns the full spanSets shape (multiple matched spans per trace, with match highlighting) rather than the pre-0.9.4 single-spanSet one; whether the cold tier reproduces it is verified by the parity run (docs/parity-and-gaps.md)."
  since: { vt: "0.9.4" }
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/search }
  request: { method: GET, path: /select/tempo/api/search, params: { q: '{ resource.service.name = "checkout" } | count() > 1', start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: trace }
  layers: [api]
  pending: true

