# VT Tempo-compat surface. TraceQL queries use VT-native field names:
# resource_attr:service.name, name, duration, span_attr:<key>, trace_id,
# span_id, kind, status_code. metrics/query_range rows live in traceql.yaml
# (one row per TraceQL metrics function).

- id: vt.tempo.echo.basic
  title: "/select/tempo/api/echo — liveness echo"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold, global]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/echo }
  request: { method: GET, path: /select/tempo/api/echo }
  compare: { type: status }
  layers: [api]
  pending: true

- id: vt.tempo.v2_search_tags.basic
  title: "/select/tempo/api/v2/search/tags — attribute tag names"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/v2/search/tags }
  request: { method: GET, path: /select/tempo/api/v2/search/tags, params: { start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: exact-json }
  layers: [api]
  pending: true

- id: vt.tempo.v2_search_tags.intrinsic_scope
  title: "/select/tempo/api/v2/search/tags — scope=intrinsic (VT 0.9.4+)"
  surface: vt
  kind: select
  origin: native
  expect: differ
  differ_note: "Live at the pinned VT 0.11.0 (arrived in 0.9.4). Whether the cold tier reports the same intrinsic tag set is verified by the parity run (docs/parity-and-gaps.md)."
  since: { vt: "0.9.4" }
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/v2/search/tags }
  request: { method: GET, path: /select/tempo/api/v2/search/tags, params: { scope: "intrinsic", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: exact-json }
  layers: [api]
  pending: true

