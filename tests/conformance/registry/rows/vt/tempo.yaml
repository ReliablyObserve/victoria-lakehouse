  kind: select
  origin: native
  expect: differ
  differ_note: "scope=intrinsic filtering arrives in VT 0.9.4; absent at the pinned 0.9.2. Re-check after the version bump (docs/parity-and-gaps.md)."
  since: { vt: "0.9.4" }
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/v2/search/tags }
  request: { method: GET, path: /select/tempo/api/v2/search/tags, params: { scope: "intrinsic", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: exact-json }
  layers: [api]
  pending: true

