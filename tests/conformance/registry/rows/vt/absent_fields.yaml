  notes: "The numeric span columns are nullable (#274); start_time_unix_nano keeps its DELTA_BINARY_PACKED encoding in every writer (flush, compaction, delete rewrite), so a traces object is not larger for it. The parity case checks that no edge row carries one of the four fields on either tier; the edge counts and values are computed independently by each tier and are not compared here. Known difference, not covered by the lock: the edge row lacks the trace_service_graph_stream field that hot returns (https://github.com/ReliablyObserve/victoria-lakehouse/issues/479)."
