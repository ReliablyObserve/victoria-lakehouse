- { id: vt.ingest.internal_insert.numeric, title: "/internal/insert: storage-node ingest used by a vtinsert tier (not mounted in lakehouse-traces)", surface: vt, kind: internal, origin: native, expect: differ, differ_note: "Known divergence from hot, tracked: lakehouse-traces answers 404 where hot VictoriaTraces answers 200 on POST /internal/insert (https://github.com/ReliablyObserve/victoria-lakehouse/issues/334). The matrix observes both statuses and fails when Lakehouse starts answering 200 (docs/ingest-parity.md#known-gaps).", targets: [hot, cold], seed: [ingest.matrix], upstream: { route: /internal/insert }, request: { method: POST, path: /internal/insert }, compare: { type: status }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_RouteGaps] }, notes: "the request carries no body: hot answers 200 to an empty POST with version=v1" }
