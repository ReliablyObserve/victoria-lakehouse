# Ingest parity matrix rows for VictoriaTraces: one row per protocol x tenant form.
#
# Each row is executed in CI by tests/e2e/ingest_matrix_test.go (TestIngestMatrix_Traces):
# the same payload goes to hot VictoriaTraces and to lakehouse-traces, the ingest answers (status and body)
# are compared, the rows are read back from the unflushed buffer and again after the
# flush to Parquet and must equal the hot rows field for field, and the ingest counters
# must move. The case table lives in tests/ingestmatrix; the drift gate
# tests/conformance/ingest_matrix_test.go ties it to the vendored upstream routes and flags.

- { id: vt.ingest.otlp_traces_protobuf.numeric, title: "/insert/opentelemetry/v1/traces: OTLP/HTTP traces, protobuf [numeric tenant]", surface: vt, kind: insert, origin: native, expect: differ, differ_note: "Known divergence from hot, tracked: spans are stored with VictoriaLogs' default _msg text instead of VictoriaTraces' - (https://github.com/ReliablyObserve/victoria-lakehouse/issues/332); spans flushed to Parquet come back without _msg (VictoriaTraces returns -) (https://github.com/ReliablyObserve/victoria-lakehouse/issues/333); a trace_id query returns each flushed span twice while the buffer still holds it (https://github.com/ReliablyObserve/victoria-lakehouse/issues/279). The matrix compares every other field exactly and fails when a divergence goes away (docs/ingest-parity.md#known-gaps).", targets: [hot, cold], seed: [ingest.matrix], upstream: { route: /insert/opentelemetry/v1/traces }, request: { method: POST, path: /insert/opentelemetry/v1/traces }, compare: { type: ndjson-multiset }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Traces] }, notes: "AccountID/ProjectID headers" }
