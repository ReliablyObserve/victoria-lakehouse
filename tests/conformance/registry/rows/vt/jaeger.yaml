- id: vt.select.jaeger_tempo_query_deadline
  title: "Jaeger and Tempo requests run under -search.maxQueryDuration (default 30s), lowered by the 'timeout' argument; a stalled S3 read ends at the deadline and frees its file-budget slot (a stalled consumer frees its row-group decode slots); the expired request fails with a 400 deadline error where hot VictoriaTraces answers an empty 200"
  surface: vt
  kind: select
  origin: native
  expect: differ
  differ_note: "A request that hits the deadline fails with 400 '...context deadline exceeded' on the cold tier; hot VictoriaTraces answers 200 with an empty body (hot logstorage RunQuery/searchParallel and the cluster netselect client return nil when the context ends; reviewer probe on services, search, Tempo search and TraceQL metrics). Kept on purpose: an empty 200 for a query that did not finish is a silently wrong answer. 400 vs 503 is the owner's decision; the Jaeger/Tempo handlers format errors with %s and so drop a status code (#773), which keeps it 400 until that patch lands. docs/read-path.md."
  targets: [cold]
  seed: [traces.base]
  upstream: { route: /select/jaeger/api/services }
  request: { method: GET, path: /select/jaeger/api/services, params: { timeout: "30s" } }
  compare: { type: status }
  layers: [api, chaos]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_StalledReadEndsAtTheDeadline
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_WrapperAddsNothingToTheHandlerAnswer
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_TimeoutArgument
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_DefaultIsUpstreams
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_DeadlineFreesTheWorkers
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_ClientCancelEndsTheRead
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_KeepTheGlobalReadScope
      - lakehouse-traces/internal/selectapi/query_deadline_test.go#TestJaegerTempoRoutes_ZeroFlagFailsEveryRequestAtOnce
      - lakehouse-traces/internal/selectapi/query_deadline_drift_test.go#TestGetMaxQueryDuration_MatchesVendoredVTSelect
      - lakehouse-traces/internal/selectapi/query_deadline_drift_test.go#TestQueryContext_MatchesVendoredVTSelectRequestHandler
      - lakehouse-traces/internal/selectapi/query_deadline_drift_test.go#TestExemptPathsMatchVendoredVTSelect
      - lakehouse-traces/internal/storage/parquets3/query_deadline_http_test.go#TestJaegerTempoDeadline_StalledObjectReadEndsAtTheDeadlineAndFreesSlots
      - lakehouse-traces/internal/storage/parquets3/query_deadline_http_test.go#TestJaegerTempoDeadline_StalledConsumerFreesDecodeSlots
      - lakehouse-traces/internal/storage/parquets3/query_deadline_http_test.go#TestJaegerTempoDeadline_StalledPeerBridgeEndsAtTheDeadline
      - lakehouse-traces/search_max_query_duration_test.go#TestNewSelectHandler_JaegerAndTempoDeadlineIsTheFlag
  notes: "Fixes #778. What the registry run checks here is only that a normal request with timeout=30s answers with the same status as hot; the deadline guarantee itself is proven by the linked tests: TestJaegerTempoRoutes_StalledReadEndsAtTheDeadline (every route, a stalled store, the deadline carried and the request ended at it), TestJaegerTempoDeadline_StalledObjectReadEndsAtTheDeadlineAndFreesSlots (real Storage, hung objects, the file-budget slot freed), TestJaegerTempoDeadline_StalledConsumerFreesDecodeSlots (decode slots freed), TestJaegerTempoDeadline_StalledPeerBridgeEndsAtTheDeadline (a stalled peer bridge call). Upstream's vtselect.RequestHandler wraps every non-tail request in context.WithTimeout(ctx, getMaxQueryDuration(r)); the traces binary cannot link vtselect, so selectapi carries a drift-tested copy and registers the flag (lakehouse-traces/search_max_query_duration.go). Surfaces (all had no deadline before): Jaeger trace-by-ID, search, services, operations, dependencies (select and bare /api aliases); Tempo search/TraceQL, tags, tag values, trace-by-ID v1 and v2; TraceQL metrics. Not covered: upstream's -search.maxConcurrentRequests / -search.maxQueueDuration admission on these routes (tracked in #800). The logs binary is unaffected; the LogsQL routes of the traces binary still ignore the flag (see vt.flag.search_max_query_duration)."
