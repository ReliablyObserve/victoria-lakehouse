# prefixed) shims. Queries use VT-native field names throughout:
# resource_attr:service.name, name, duration (ns), span_attr:<key>, trace_id,
# span_id, kind, status_code.

- id: vt.jaeger.services.basic
  title: "/select/jaeger/api/services — service list"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold, global]
  seed: [traces.base]
  upstream: { route: /select/jaeger/api/services }
  request: { method: GET, path: /select/jaeger/api/services, headers: { AccountID: "{{tenant.account}}", ProjectID: "{{tenant.project}}" } }
  compare: { type: exact-json }
  layers: [api]
