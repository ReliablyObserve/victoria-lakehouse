# Tenant read scoping on the VT Jaeger surface, for both tenant layouts.
# Same rule and layouts as rows/vl/tenant_scope.yaml; the Jaeger handlers
# derive the tenant from the request exactly like the LogsQL endpoints.

- id: vt.jaeger.services.tenant_scope.default.prefix
  title: "/select/jaeger/api/services — no tenant headers → the default tenant 0:0 only (prefix layout)"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold]
  seed: [tenants.iso]
  upstream: { route: /select/jaeger/api/services }
  request: { method: GET, path: /select/jaeger/api/services }
  compare: { type: exact-json }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [lakehouse-traces/internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go, tests/parity/tenant_scope_parity_test.go] }
  notes: "Without AccountID/ProjectID headers VL scopes the read to tenant 0:0; the cold tier must answer with tenant 0:0's data only (plus legacy untenanted objects, which belong to 0:0). Layout: tenants share one bucket under {AccountID}/{ProjectID}/."

- id: vt.jaeger.services.tenant_scope.default.bucket
  title: "/select/jaeger/api/services — no tenant headers → the default tenant 0:0 only (bucket layout)"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [cold]
  seed: [tenants.iso]
  upstream: { route: /select/jaeger/api/services }
  request: { method: GET, path: /select/jaeger/api/services }
  compare: { type: exact-json }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [lakehouse-traces/internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go, tests/parity/tenant_scope_parity_test.go] }
  notes: "Without AccountID/ProjectID headers VL scopes the read to tenant 0:0; the cold tier must answer with tenant 0:0's data only (plus legacy untenanted objects, which belong to 0:0). Layout: the tenant's objects live in a dedicated bucket (s3.bucket override); the request must not reach any other tenant's bucket."

- id: vt.jaeger.services.tenant_scope.scoped.prefix
  title: "/select/jaeger/api/services — tenant headers → exactly that tenant (prefix layout)"
  surface: vt
  kind: select
  origin: native
  expect: pass
