- id: vt.jaeger.services.tenant_scope.global.prefix
  title: "/select/jaeger/api/services — valid global-read credential → every tenant (prefix layout)"
  surface: vt
  kind: select
  origin: native
  expect: pass
  targets: [cold]
  seed: [tenants.iso]
  upstream: { route: /select/jaeger/api/services }
  request: { method: GET, path: /select/jaeger/api/services, headers: { X-Lakehouse-Global-Read: "{{tenant.global_read}}" } }
  compare: { type: exact-json }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [lakehouse-traces/internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go, tests/parity/tenant_scope_parity_test.go] }
  notes: "Only a request presenting the configured global-read header or bearer token is widened to all tenants; a wrong value keeps the default-tenant scope. Cold-only: hot VL has no global-read credential. Layout: tenants share one bucket under {AccountID}/{ProjectID}/."

