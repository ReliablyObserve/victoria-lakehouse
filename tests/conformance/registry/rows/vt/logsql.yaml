# VictoriaTraces v0.12.0 applies -search.latencyOffset (default 30s) to every
# LogsQL query API below except live tailing, /select/tenant_ids and
# /select/logsql/query_time_range, and lets a request opt out with
# disable_latency_offset=true. Before v0.12.0 only the Jaeger and Tempo APIs had
# it. lakehouse-traces serves these routes through VictoriaTraces' own
# app/vtselect/logsql handlers (lakehouse-traces/internal/selectapi), so the
# offset is upstream's code; the cold tier and the buffer bridge take their time
# range from the query and honour it (cold: internal/storage/parquets3
# latency_offset_cold_test.go; served-vs-upstream on the same data:
# internal/selectapi/logsql_equivalence_test.go). The seed's newest spans are
# older than the offset, so the query rows below need a fresh span: the runner
# writes one to both tiers a few seconds before the request, and start=-2m
# scopes the query to it.
- { id: vt.select.logsql_query.latency_offset, title: "/select/logsql/query — spans younger than -search.latencyOffset are hidden (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:*", start: "-2m", disable_latency_offset: "false" } }, compare: { type: ndjson-multiset, project: [trace_id] }, layers: [api], pending: true, notes: "The window is the last two minutes, in which the runner has written one span a few seconds before the request: it is absent on hot VT and on the cold tier alike. Parity case: tests/parity/traces_latency_offset_test.go (TestParity_Traces_LogsQLLatencyOffset); unit cases: lakehouse-traces/internal/selectapi/latency_offset_test.go." }
- { id: vt.select.logsql_query.latency_offset_disabled, title: "/select/logsql/query — disable_latency_offset=true shows spans younger than the offset (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:*", start: "-2m", disable_latency_offset: "true" } }, compare: { type: ndjson-multiset, project: [trace_id] }, layers: [api], pending: true, notes: "The opt-out: the span written a few seconds before the request is returned by hot VT and by the cold tier (from the unflushed buffer). Malformed values are a 400 on both (cannot parse disable_latency_offset=... as bool)." }
- { id: vt.select.logsql_hits.latency_offset, title: "/select/logsql/hits — the latency offset caps the last bucket (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/hits }, request: { method: GET, path: /select/logsql/hits, params: { query: "*", start: "-1h", step: "1m", disable_latency_offset: "false" } }, compare: { type: series, options: { rel_tolerance: "0" } }, layers: [api], pending: true, notes: "Applied after the step alignment, as upstream does: buckets keep their aligned edges and rows newer than now-offset drop out of the last one." }
- { id: vt.select.logsql_stats_query.latency_offset, title: "/select/logsql/stats_query — the latency offset applies to instant stats (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/stats_query }, request: { method: GET, path: /select/logsql/stats_query, params: { query: "name:* | stats count() as total", start: "-1h", disable_latency_offset: "false" } }, compare: { type: count }, layers: [api], pending: true }
- { id: vt.select.logsql_field_values.latency_offset, title: "/select/logsql/field_values — the latency offset applies to field enumeration (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/field_values }, request: { method: GET, path: /select/logsql/field_values, params: { query: "trace_id:*", field: "resource_attr:service.name", start: "-1h", disable_latency_offset: "false" } }, compare: { type: values-with-hits, options: { hits_tolerance: "0" } }, layers: [api], pending: true }
- { id: vt.select.tenant_ids.no_latency_offset, title: "/select/tenant_ids — not subject to the latency offset (VT 0.12.0)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [global], seed: [tenants.iso], upstream: { route: /select/tenant_ids }, request: { method: GET, path: /select/tenant_ids, params: { start: "-1h" } }, compare: { type: exact-json }, layers: [api], pending: true, notes: "ProcessTenantIDsRequest does not go through parseCommonArgs upstream, so no filter is added; the cold tier's wrapper leaves this route out too (selectapi.Register)." }
- { id: vt.select.logsql_query.latency_offset_rate, title: "/select/logsql/query — stats rate() divides by the range upstream uses (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:* | stats rate() r", start: "-1h", disable_latency_offset: "false" } }, compare: { type: count }, layers: [api], pending: true, notes: "rate() and rate_sum() take their step from the query's time range, so a latency-offset filter that is not upstream's own shifts them (a hand-built end at now-offset differs from upstream's by the step upstream derives: about 10% on a 3000s range). Served-vs-upstream equality on the same data: TestLogsQLServedEqualsUpstreamOnTheSameData; absolute value: TestRateThroughTheServedHandler." }
- { id: vt.select.logsql_query.latency_offset_time_offset, title: "/select/logsql/query — options(time_offset=...) composes with the latency offset (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "options(time_offset=1h) trace_id:* | stats count() n", start: "-3h", disable_latency_offset: "false" } }, compare: { type: count }, layers: [api], pending: true, notes: "With time_offset=1h upstream's end is now-1h-30s. Counts agree on both tiers; the _time column of a non-aggregated time_offset query does not (see vt.select.logsql_query.time_offset_time_column)." }
- { id: vt.select.logsql_query.latency_offset_ignore_global_time_filter, title: "/select/logsql/query — options(ignore_global_time_filter=true) adds no offset filter, subqueries included (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "options(ignore_global_time_filter=true) trace_id:* | stats count() n", start: "-3h", disable_latency_offset: "false" } }, compare: { type: count }, layers: [api], pending: true }
- { id: vt.select.logsql_query.latency_offset_subqueries, title: "/select/logsql/query — in(), join and union subqueries inherit the offset like the main query (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:* | union (trace_id:*) | stats count() n", start: "-3h", disable_latency_offset: "false" } }, compare: { type: count }, layers: [api], pending: true, notes: "The cold tier resolves the query's subqueries with upstream's own initSubqueries (patches/vl-*/external_query.go.src), so in() inside a pipe, join and union (which used to panic in its pipe processor) behave as on hot storage." }
- { id: vt.select.logsql_query.time_offset_time_column, title: "/select/logsql/query — options(time_offset=...) shifts the returned _time on hot storage only", surface: vt, kind: select, origin: native, expect: differ, differ_note: "Hot storage adds the time_offset to the _time values it returns (storage_search.go subTimeOffsetToTimestamps); the cold tier filters by the shifted range but returns _time unshifted. Pre-existing and independent of the latency offset (found by TestLogsQLServedEqualsUpstreamOnTheSameData, which pins the difference).", targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "options(time_offset=1h) trace_id:* | limit 5", start: "-3h" } }, compare: { type: ndjson-multiset, project: [trace_id, _time] }, layers: [api], pending: true }
- { id: vt.select.logsql_query.in_subquery_without_pipes, title: "/select/logsql/query — an in() subquery in a query with no pipes is resolved on the cold tier", surface: vt, kind: select, origin: native, expect: pass, notes: "A query with no pipes whose in() holds a subquery is routed through RunQueryExternalWithSubqueries (QueryHasFilterSubqueries), so the filter is resolved as upstream does. Pinned by TestLogsQLServedEqualsUpstreamOnTheSameData (in() subquery without pipes, and inside a union branch) and TestRealStore_ResolvedInSubqueryWithManyValues (real parquets3 store).", targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:in(trace_id:* | fields trace_id)", start: "-3h" } }, compare: { type: ndjson-multiset, project: [trace_id] }, layers: [api], pending: true }
- { id: vt.select.logsql_query_time_range.ignores_latency_offset_arg, title: "/select/logsql/query_time_range — never parses disable_latency_offset (VT 0.12.0)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query_time_range }, request: { method: GET, path: /select/logsql/query_time_range, params: { query: "trace_id:*", start: "-1h", disable_latency_offset: "x" } }, compare: { type: status, options: { hot_status: "200", cold_status: "200" } }, layers: [api], pending: true, notes: "Upstream's ProcessQueryTimeRangeRequest never applies the offset and never parses the argument, so a malformed value is not a 400 there (it is on every other query route). Served by the same handler on the traces binary: TestLatencyOffset_PerAPI." }

