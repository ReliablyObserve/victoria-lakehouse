# VictoriaTraces v0.12.0 applies -search.latencyOffset (default 30s) to every
# LogsQL query API below except live tailing and /select/tenant_ids, and lets a
# request opt out with disable_latency_offset=true. Before v0.12.0 only the
# Jaeger and Tempo APIs had it. lakehouse-traces serves LogsQL through
# VictoriaLogs' handlers, so lakehouse-traces/internal/selectapi adds the same
# "_time up to now-offset" filter; the cold tier and the buffer bridge see it in
# the query and honour it (cold: internal/storage/parquets3 latency_offset_cold_test.go).
# The seed's newest spans are older than the offset, so the query rows below need a
# fresh span: the runner writes one to both tiers a few seconds before the request, and start=-2m scopes the query to it.
- { id: vt.select.logsql_query.latency_offset, title: "/select/logsql/query — spans younger than -search.latencyOffset are hidden (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:*", start: "-1h", disable_latency_offset: "false" } }, compare: { type: ndjson-multiset, project: [trace_id] }, layers: [api], pending: true, notes: "The window is the last two minutes, in which the runner has written one span a few seconds before the request: it is absent on hot VT and on the cold tier alike. Parity case: tests/parity/zz_traces_latency_offset_test.go (TestParity_Traces_LogsQLLatencyOffset); unit cases: lakehouse-traces/internal/selectapi/latency_offset_test.go." }
- { id: vt.select.logsql_query.latency_offset_disabled, title: "/select/logsql/query — disable_latency_offset=true shows spans younger than the offset (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/query }, request: { method: GET, path: /select/logsql/query, params: { query: "trace_id:*", start: "-1h", disable_latency_offset: "true" } }, compare: { type: ndjson-multiset, project: [trace_id] }, layers: [api], pending: true, notes: "The opt-out: the span written a few seconds before the request is returned by hot VT and by the cold tier (from the unflushed buffer). Malformed values are a 400 on both (cannot parse disable_latency_offset=... as bool)." }
- { id: vt.select.logsql_hits.latency_offset, title: "/select/logsql/hits — the latency offset caps the last bucket (VT 0.12.0+)", surface: vt, kind: select, origin: native, expect: pass, since: { vt: "0.12.0" }, targets: [hot, cold], seed: [traces.base], upstream: { route: /select/logsql/hits }, request: { method: GET, path: /select/logsql/hits, params: { query: "*", start: "-1h", step: "1m", disable_latency_offset: "false" } }, compare: { type: series, options: { rel_tolerance: "0" } }, layers: [api], pending: true, notes: "Applied after the step alignment, as upstream does: buckets keep their aligned edges and rows newer than now-offset drop out of the last one." }
