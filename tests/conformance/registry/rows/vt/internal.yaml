- id: vt.select.tail.unsupported
  title: "/select/logsql/tail — cold tier returns the documented no-op"
  surface: vt
  kind: select
  origin: lh-shim
  expect: unsupported
  targets: [cold]
  seed: [traces.base]
  upstream: { route: /select/logsql/tail }
  request: { method: GET, path: /select/logsql/tail, params: { query: "*" } }
  compare: { type: status, options: { cold_status: "501" } }
  layers: [api]
  pending: true
  notes: "501, not 404: internal/selectapi/handler.go routes tail and returns StatusNotImplemented; 404 would mean the path itself was unrouted."

