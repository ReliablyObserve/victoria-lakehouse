  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}", limit: "1000" }, headers: { X-Scope-OrgID: "{{tenant.org_id}}" } }
  compare: { type: ndjson-multiset }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/tenant/middleware_autoregister_test.go, internal/selectapi/tenant_autoregister_test.go, tests/e2e/string_tenant_autoregister_test.go] }
  notes: "With auto-register on, only an ingest request registers an OrgID. A select, field, stream, hits or stats request with an OrgID no alias names answers 200 with the empty result of a tenant without data (it never falls through to 0:0 or to any other tenant), does not appear in the alias list or in the shared alias registry, and is counted in lakehouse_tenant_unknown_orgid_reads_total."

