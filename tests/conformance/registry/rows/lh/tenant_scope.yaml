- id: lh.tenant_scope.logs.alias_collision_rejected
  title: "Logs — an alias that collides with an existing one is rejected with 409"
  surface: lh
  kind: admin
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [tenants.iso]
  request: { method: POST, path: /lakehouse/api/v1/tenants/aliases }
  compare: { type: status }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/tenant/registry_test.go, cmd/lakehouse-logs/tenant_autoregister_test.go, tests/e2e/string_tenant_autoregister_test.go] }
  notes: "Creating an alias whose AccountID:ProjectID already belongs to another OrgID, whose OrgID already maps to another ID, or whose AccountID lies in the auto-register range answers 409 and changes nothing: the reverse map (display name, org_id, metric label) is never overwritten. The same entry arriving over the peer sync is logged, counted in lakehouse_tenant_alias_rejected_total and dropped. Startup refuses configured aliases that collide with each other or sit inside the range."

