# String tenants (X-Scope-OrgID) and their AccountIDs, for both signals.
#
# String tenants are a Lakehouse addition (VictoriaLogs and VictoriaTraces know
# only the integer AccountID/ProjectID pair), so these rows are lh-addition with
# no upstream counterpart. Int tenant semantics are unchanged by them.
#
# Rule: an OrgID that is configured, persisted or auto-registered owns exactly
# one AccountID:ProjectID and that pair belongs to exactly that OrgID.
# Auto-registration happens only on an ingest request and allocates from the
# reserved range [2147483648, 4294967294] (ProjectID 0), never an ID a configured
# alias, a persisted alias or a tenant with data holds. A read with an unknown
# OrgID is answered as a tenant without data and registers nothing. The
# compose stack configures acme-corp:1001 and staging-team:1002.
# Semantics: docs/multi-tenancy.md#auto-register-range-and-the-shared-registry.

- id: lh.tenant_scope.logs.auto_registered_orgid
  title: "Logs — an auto-registered OrgID gets a reserved-range ID and reads only its own rows"
  surface: lh
  kind: insert
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [tenants.iso]
  request: { method: POST, path: /insert/jsonline, params: { _stream_fields: "service.name" }, headers: { X-Scope-OrgID: "{{tenant.org_id}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/tenant/registry_test.go, internal/tenant/middleware_autoregister_test.go, internal/selectapi/tenant_autoregister_test.go, tests/e2e/string_tenant_autoregister_test.go] }
  notes: "Ingest as an OrgID no pod has seen, with acme-corp:1001 and staging-team:1002 configured: the OrgID is assigned an AccountID in [2147483648, 4294967294] and ProjectID 0, acme-corp and staging-team keep 1001 and 1002, and no two OrgIDs share an ID. A select as each OrgID returns exactly that OrgID's rows, so the _msg sets of the three are pairwise disjoint."

