  notes: "Two insert-buffer segments are committed, the pod is restarted after a downtime shorter than, just past, and well past 2 x the buffer grace (the compaction guard), and compaction merges the segments' objects into compacted-L1 objects once, synchronously, with the guard's clock set to the restart time: the count, field_values and stats, and the LogsQL `trace_id:=` lookup must equal the acked total at fixed stages (after the restart, after compaction, in the buffer, within grace) and never double (#379). The test SIMULATES the restart (a flusher reloaded over the surviving state and bucket, the restart clock overridden); it does not SIGTERM or kill -9 a process, it does not run compaction continuously, and the read surfaces it checks are the LogsQL query API only; Jaeger and Tempo reads are not exercised by it. The restarted flusher restores each segment's real commit time from its flush state and holds the segments it restored (only those; segments committed after the start follow the normal grace) until a complete S3 manifest refresh has been applied (not failed, not partial, not rejected: a listing that drops more than half of the tracked files is applied only when a HEAD sample of the dropped keys finds them all gone, also for the first listing after a snapshot load), then retires those past their grace in the same step; while a segment is held its rows are served and are duplicated if a peer compacted its objects: bounded in size, not in time (alert LakehouseBufferRestoredSegmentsHeld, gauges lakehouse_buffer_held_segments and lakehouse_buffer_oldest_held_age_seconds). On a select pod the bridge answers the held segments for the whole hold, so those duplicates last as long as the hold, and a select pod that restarted too and serves while warming may miss rows an insert pod already retired until its own refresh has applied the objects; a state written before the commit records existed (no `commits`) gives its segments a grace from the restart, once. Known residuals: #406 (crash between the marker PUT and the state write), #411 (a narrower release than the full refresh). SCHEMA LIMIT: as for the same-hour restart rows, the registry has no model of a downtime or of the buffer layer, so this request covers the cold-side half only; the invariant is asserted by TestBufferRestart_DowntimeBeyondGuardWithCompaction_CountsExact, TestBufferRestart_LoadRestoresCommitTime, TestBufferRestartReview_StaleSnapshot_RowsServedUntilFirstRefresh, TestBufferRestartHold_* (refresh failure, guard rejection, partial listing, only restored segments held, view before list, concurrent queries), TestRefreshFromS3_* (sentinels), TestCliffHead_* (HEAD confirmation), TestPartial_*, TestProperty_ListingsNeverLoseLiveObjectsOrForgetOwedRetirements, TestSegments_HoldCommittedOnlyHoldsWhatIsCommittedAtThatPoint, TestAlerts_RestoredSegmentsHeld and TestBufferFlusher_Property_VisibleLifetimeBelowGuard. Stays pending."

- id: lh.select.manifest.incomplete_listing_deletes_nothing_logs
  title: "LH cold read after an incomplete manifest listing (a skipped tenant, a truncated LIST) — nothing is deleted, no deleted row returns, no retirement is forgotten (logs)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api, chaos]
  pending: true
  refs: { doc: docs/durability.md, tests: [internal/manifest/refresh_head_confirm_test.go, internal/manifest/listing_property_test.go, internal/manifest/review404_sparse_listing_test.go, internal/manifest/review404_r4_test.go, internal/manifest/review420_conc_test.go, internal/delete/sparse_first_listing_test.go, internal/delete/listing_property_test.go, internal/delete/review404_r4_test.go, internal/compaction/sparse_first_listing_tierb_test.go, internal/compaction/orphan_sweep_unlisted_test.go, internal/compaction/listing_tierb_property_test.go, internal/compaction/orphan_sweep_test.go, internal/compaction/review404_r4_test.go, internal/metrics/manifest_refresh_alerts_test.go] }
  notes: "#418, #404 rounds 3-4. A listing that skipped a tenant keeps that tenant's entries (each key once, including a file flushed while it ran) and is not complete; a listing that drops more than half of the tracked files is applied only when a HEAD sample of the dropped keys finds them all gone. No destructive decision rests on absence from the manifest alone: the orphan sweep (Tier B) deletes only objects the manifest holds a retirement record for (retired at least OrphanTTL ago, not named by an unfinished rewrite), never an unrecorded absent object; the delete scheduler marks an absent key reaped only when the manifest retired it or a HEAD finds no object; the scheduler and compaction complete a tombstone only after a complete listing that began after the tombstone was created. Every state is persisted (warm-up and periodic), a loaded snapshot is never treated as a listing, and a key tracked twice is dropped on refresh and load (a merge group naming a source twice is refused). Verified at unit/property level in the manifest, compaction and delete packages (shared by both binaries) plus the buffer hold in each binary; the conformance runner does not execute it yet (pending). Residuals: a successful LIST that covers every prefix and silently drops fewer than half of the objects is believed for serving (a dropped retired key's record is forgotten; an object dropped before the delete scheduler discovered it is not covered by its HEAD check, TestReview404R4_Residual_SilentDropBeforeDiscovery); unrecorded objects are never reclaimed by Tier B."

