- id: lh.select.split.insert_buffer_visible_logs
  title: "LH select pod answers with the insert pods' unflushed rows through the buffer bridge (logs)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs: { doc: docs/read-path.md, tests: [internal/storage/parquets3/buffer_bridge_discovery_test.go, cmd/lakehouse-logs/discovery_enabled_test.go, charts/victoria-lakehouse/test_templates.sh] }
  notes: "A select pod (role=select) of a split deployment finds the insert pods through select.insert_headless_service (the chart sets it to the release's insert headless service of the signal), requests each discovered host:port over http://, and returns the rows they have not flushed yet together with the cold rows, each once. Before, the bridge requested host:port without a scheme (the URL did not parse) and select.insert_headless_service was read by nothing, so a select pod saw a row only after its insert pod flushed it. Covered by TestBufferBridge_ReachesDiscoveredHostPort, TestRefreshDiscovery_* and TestDiscoveryEnabled, and by the chart's rendered-content checks. SCHEMA LIMIT: the runner has one Lakehouse node per signal (no select/insert split) and no target for the unflushed layer, so this row can only express the cold-side request. Stays pending."

