- id: lh.select.restart.downtime_beyond_guard_compaction_logs
  title: "LH cold read after a restart that followed a downtime longer than the compaction guard, with compaction running — every row exactly once (logs)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api, chaos]
  pending: true
  refs: { doc: docs/durability.md, tests: [internal/storage/parquets3/buffer_restart_compaction_test.go, internal/storage/parquets3/buffer_flusher_restore_test.go, internal/storage/parquets3/buffer_restart_review_test.go, internal/storage/parquets3/buffer_restart_hold_test.go, internal/manifest/refresh_sentinel_test.go, internal/manifest/refresh_head_confirm_test.go, internal/manifest/listing_property_test.go, internal/membuffer/segments_hold_test.go, internal/membuffer/segments_test.go] }
  notes: "Two insert-buffer segments are committed, the pod is restarted after a downtime shorter than, just past, and well past 2 x the buffer grace (the compaction guard), and compaction merges the segments' objects into compacted-L1 objects once, synchronously, with the guard's clock set to the restart time: the count, field_values and stats must equal the acked total at fixed stages (after the restart, after compaction, in the buffer, within grace) and never double (#379). The test SIMULATES the restart (a flusher reloaded over the surviving state and bucket, the restart clock overridden); it does not SIGTERM or kill -9 a process, it does not run compaction continuously, and the read surfaces it checks are the LogsQL query API only. The restarted flusher restores each segment's real commit time from its flush state and holds the segments it restored (only those; segments committed after the start follow the normal grace) until a complete S3 manifest refresh has been applied (not failed, not partial, not rejected: a listing that drops more than half of the tracked files is applied only when a HEAD sample of the dropped keys finds them all gone, also for the first listing after a snapshot load), then retires those past their grace in the same step; while a segment is held its rows are served and are duplicated if a peer compacted its objects: bounded in size, not in time (alert LakehouseBufferRestoredSegmentsHeld, gauges lakehouse_buffer_held_segments and lakehouse_buffer_oldest_held_age_seconds). On a select pod the bridge answers the held segments for the whole hold, so those duplicates last as long as the hold, and a select pod that restarted too and serves while warming may miss rows an insert pod already retired until its own refresh has applied the objects; a state written before the commit records existed (no `commits`) gives its segments a grace from the restart, once. Known residuals: #406 (crash between the marker PUT and the state write), #411 (a narrower release than the full refresh). SCHEMA LIMIT: as for the same-hour restart rows, the registry has no model of a downtime or of the buffer layer, so this request covers the cold-side half only; the invariant is asserted by TestBufferRestart_DowntimeBeyondGuardWithCompaction_CountsExact, TestBufferRestart_LoadRestoresCommitTime, TestBufferRestartReview_StaleSnapshot_RowsServedUntilFirstRefresh, TestBufferRestartHold_* (refresh failure, guard rejection, partial listing, only restored segments held, view before list, concurrent queries), TestRefreshFromS3_* (sentinels), TestCliffHead_* (HEAD confirmation), TestPartial_*, TestProperty_ListingsNeverLoseLiveObjectsOrForgetOwedRetirements, TestSegments_HoldCommittedOnlyHoldsWhatIsCommittedAtThatPoint, TestAlerts_RestoredSegmentsHeld and TestBufferFlusher_Property_VisibleLifetimeBelowGuard. Stays pending."

