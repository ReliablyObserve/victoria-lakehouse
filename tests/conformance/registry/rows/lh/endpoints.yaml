# LH-addition endpoints: capabilities that exist only on the Lakehouse and
# have no upstream VL/VT counterpart. origin=lh-addition rows carry no
# `upstream` key (nothing to join against in the drift check).

- id: lh.stats.overview.schema
  title: "LH stats overview — tier sizes, object counts, compaction backlog"
  surface: lh
  kind: admin
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /internal/lh/stats/overview }
  compare: { type: schema }
  layers: [api]
  pending: true

