- id: lh.select.restart.same_hour_buffer_visible_logs
  title: "LH cold read after a graceful restart — rows buffered in the same UTC hour as the shutdown flush are visible exactly once (logs)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api, chaos]
  pending: true
  refs: { doc: docs/durability.md, tests: [internal/storage/parquets3/buffer_restart_test.go, internal/storage/parquets3/inferred_bounds_test.go, internal/storage/parquets3/bounds_resolve_test.go, internal/manifest/bounds_inferred_test.go, cmd/lakehouse-logs/shutdown_snapshot_test.go] }
  notes: "Seed cold rows in hour H, restart the pod gracefully (SIGTERM; the buffer closes and the restarted pod drains the segments to Parquet), then ingest rows with _time in the same hour H and query the window: query=*, stats count and field_values must show every cold row and every new row exactly once (cold N + buffered M), not only the cold ones. The previous-hour case and rows that straddle the hour boundary give the same totals. Covered at unit and lifecycle level by the listed tests (TestBufferRestart_*, TestResolveFaults_*, TestResolveBounds_*). SCHEMA LIMIT: the registry has no target or seed for the unflushed (buffer) layer (targets are hot|cold|global) and no placeholder for a window that reaches past the cold seed (only {{seed.start}}..{{seed.cold_end}}), so this request can only express the cold-side half of the expectation; the post-restart rows and the window spanning both layers are asserted by the tests above until the runner models the buffer layer. Stays pending."

