- id: lh.internal.buffer_query.all_tenants_needs_peer_key_logs
  title: "LH insert pod serves /internal/buffer/query?all_tenants=true only to a caller presenting the peer key (logs)"
  surface: lh
  kind: internal
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /internal/buffer/query, params: { start: "0", end: "9223372036854775807", mode: logs, tenant_scope: v1, all_tenants: "true" } }
  compare: { type: status }
  layers: [api]
  pending: true
  refs: { doc: docs/security.md, tests: [internal/buffer/handler_auth_test.go, internal/storage/parquets3/buffer_bridge_auth_test.go, cmd/lakehouse-logs/buffer_query_mount_test.go, tests/e2e/buffer_query_auth_test.go] }
  notes: "Security (#384). A pod without peer.auth_key answers all_tenants=true with 403 and the body 'all_tenants=true is served only to an authenticated peer; set the same peer.auth_key on every pod', whatever Authorization the caller sends; a pod with a key answers 401 without it or with another key, and 200 with every tenant's unflushed rows (X-Lakehouse-Tenant-Scope: *) to Authorization: Bearer <key>. Before, every caller that reached the insert port got every tenant's rows. Covered by TestBufferQueryAuth_*, TestBridgeAuth_GlobalReadNeedsThePeerKey, TestMountBufferQuery_PeerKey and the e2e TestBufferQueryAuth_Credentials (with and without LH_PEER_AUTH_KEY). SCHEMA LIMIT: the runner sends no Authorization header and has no target for the unflushed layer or the stack's key, so the request expresses the no-credential case only. Stays pending."

