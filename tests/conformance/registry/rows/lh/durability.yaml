      - internal/storage/parquets3/drain_stalled_move_aside_test.go#TestDrain_MovingAStalledSegmentAside
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_StalledGaugeAfterTransientMismatchThenOutage
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_PersistentGroupMismatchKeepsTheGaugeAtOne
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_StopLeavesTheStalledGaugeAsItWas
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_StopAfterAFailedCheckLeavesTheStalledGaugeAsItWas
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_StalledGaugeClearsWhenOnlyThePlanCheckRan
      - internal/storage/parquets3/drain_stalled_gauge_test.go#TestDrain_AttemptWithoutACheckLeavesTheStalledGaugeAsItWas
      - internal/storage/parquets3/drain_stalled_gauge_nocheck_test.go#TestDrain_LaterAttemptWithoutACheckKeepsTheGaugeFromAnEarlierFailedCheck
      - internal/storage/parquets3/drain_collect_once_test.go#TestDrain_CancelDuringPlanCountsCollectOnce_TwoTenants
      - internal/storage/parquets3/drain_collect_once_test.go#TestDrain_StopMidDrainCountsCollectOnce_TwoTenants
      - internal/metrics/must_stay_zero_test.go#TestMustStayZeroSeries_ExportedFromStart
      - internal/metrics/must_stay_zero_test.go#TestBufferFlushErrorStages_MatchCallSites
      - internal/metrics/buffer_stalled_test.go#TestAlerts_DrainPlanMismatchAndStalledSegment
      - internal/metrics/buffer_stalled_test.go#TestAlerts_DrainPlanMismatchPrintsAWholeNumber
  notes: "The runtime check that would have stopped #388: the drain compares its plan with a count of every row of every tenant over all of int64 time before the first upload, and each group's rows with the plan. A mismatch is lakehouse_buffer_flush_errors_total{stage=\"invariant\"}, an error log, lakehouse_buffer_stalled_segments = 1 while the latest attempt failed a check (written once when an attempt ends: an attempt that passes its checks sets 0 even if an upload then fails, a Stop leaves it), and the segment stays pending. The plan check uploads nothing in the attempt it stops; a group's check can fire after earlier groups were uploaded (no commit marker); the plan is made again on every attempt, so a mismatch that does not repeat clears, and a persistent one blocks the later segments until the volume's free-space floor answers 429. A drain cut short by Stop (a cancelled context makes upstream's query return partial rows) is not a mismatch: it is counted once under stage=\"collect\" and never under invariant. A healthy segment is never stalled: a property test draws random tenants (0:0 and the largest ids among them), times at the epoch, 1 ns and second and hour edges, exact duplicates, several parts and random group sizes. Runbook: docs/durability.md."

