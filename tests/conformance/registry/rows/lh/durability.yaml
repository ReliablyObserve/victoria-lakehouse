  notes: "Issue: https://github.com/ReliablyObserve/victoria-lakehouse/issues/772 (R1). Before, a listed object that was gone (NoSuchKey) was skipped with a log line and the read answered 200 with its rows missing (a Jaeger trace-by-ID answered 404 trace not found for a trace that exists). Now processOneFile and the field_values scan return a 502 ErrorWithStatusCode naming the object (cannot read <key>: the object was removed while this query ran; retry the query), like an unreadable object, which upstream answers 502 when a storage node cannot serve a read (netselect getFirstError); lakehouse_query_file_not_found_total keeps counting. handle404Recovery answers from the manifest only when the plan covers the object, the query is timestamp-only with no filter or tombstone, the object is entirely inside the window and its bounds are exact. The trace-by-ID footer lookup treats a gone object like an unreadable footer (a miss, so the span scan answers and fails for it), because the bound of the other objects could hide the spans of the removed one. Jaeger and Tempo trace-by-ID answer 400, not 502, because VictoriaTraces formats the error with %s (#773), never 404 and never 200. Multi-instance: nothing is shared between readers but the bucket and each reader's own listing, so a reader whose listing names the object fails alike (502) until it refreshes and a refreshed reader answers exactly while a stale one still fails; compaction and the writers are untouched. DIRECTION: upstream-exact status mapping (a gone object answers 502 as upstream's unavailable storage node); a read that used to answer short now fails."

