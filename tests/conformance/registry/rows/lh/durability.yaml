- id: lh.durability.slow_drain_outlasts_grace_logs
  title: "Logs: a drain that outlasts the grace does not keep a committed segment served after compaction merged its objects; every row is answered once on every insert and select pod"
  surface: lh
  kind: durability
  origin: lh-addition
  expect: pass
  targets: [cold]
  layers: [chaos]
  pending: true
  durability:
    fault: slow_drain_outlasts_grace
    mode: buffer-flush
    signal: logs
    guarantees: [no-duplicate]
  refs:
    doc: docs/durability.md
    tests:
      - internal/storage/parquets3/buffer_reap_independent_test.go#TestReap_ASlowDrainDoesNotKeepAGuardReleasedSegmentServed
      - internal/storage/parquets3/buffer_reap_independent_test.go#TestReap_FleetAnswersEveryRowOnce_RandomSchedules
      - internal/storage/parquets3/buffer_reap_independent_test.go#TestReap_StopEndsTheReapLoop
      - internal/storage/parquets3/buffer_reap_independent_test.go#TestReap_EveryAgeOfACommittedSegmentAnswersEachRowOnce
      - internal/storage/parquets3/buffer_reap_independent_test.go#TestReap_TheOtherSignalIsUnaffected
  notes: "Fixes #611. The flusher reaped the committed segments only after its drain loop, so a drain that outlasted the grace (a slow object store, a backlog after an outage) kept serving segments whose objects compaction was already free to merge (the segment guard releases them 2 x grace after the commit): a writer, and a select pod reading it over the buffer bridge, answered the rows once from the segment and once from the merged object. The flusher now reaps on its own cadence (BufferFlusher.reapLoop). The three listed tests fail on the flusher before the fix (no reap loop), measured: the first (10 rows, want 6) blocks a drain on real clocks and also bounds a committed segment's served time to the grace plus a check interval, well before 2 x grace; the second runs random schedules of ingest, flush, waits, guarded compaction and a drain that stalls over two insert pods running the real flusher and two select pods on one bucket, every pod bridged to both insert pods, and checks the count on three surfaces after every step; the third pins that the loop exists and ends with Stop. The last two listed tests, TestReap_EveryAgeOfACommittedSegmentAnswersEachRowOnce and TestReap_TheOtherSignalIsUnaffected, are contract locks that PASS without the fix (the first drives Reap itself and pins the guard's 2 x grace, the second is the bridge's isolation of the other signal): they are not evidence that the fix exists, and are kept referenced only because the registry gate does not let a pass row drop a test reference."

