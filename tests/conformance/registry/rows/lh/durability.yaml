  notes: "Fixes https://github.com/ReliablyObserve/victoria-lakehouse/issues/748 (logs binary). The state of a drain (draining_seq) records the rows per group (draining_max_rows) and the plan scheme (draining_plan) the segment was planned with; a resumed drain uses them, the next segment uses the configured value. A state of the release before (a draining segment without them) or of another plan scheme stops the process at start with the operator action; rows are never skipped. The lock of the bug is the 5-then-1000 restart case of TestAckedRows_NotRejudgedByAFreshCardinalityLimiter and the issue's reproduction (5 of 12 rows stored on main). The crash matrix kills after every upload (and with the marks lost, and between the last upload and the state commit) for a normal and for crowded seconds."

