- id: lh.durability.compaction_swap_within_bound_logs
  title: "Logs: a read that overlaps a compaction swap (the sources deleted right after the merged object is published) answers with every row exactly once (known gap, #772: today it fails with 502 instead of answering short)"
  surface: lh
  kind: durability
  origin: lh-addition
  expect: differ
  differ_note: "Known gap, not approved as a difference. The compactor publishes the merged object and deletes its sources at once; a query lists its objects once, so a read that overlaps the swap cannot be answered completely. It now fails with 502 (never short, never doubled) instead of answering without the sources' rows. Closed by deferring the delete past the longest read (#772, later changes)."
  targets: [cold]
  layers: [chaos]
  pending: true
  durability:
    fault: compaction_swap_within_bound
    mode: compaction
    signal: logs
    guarantees: [no-loss, no-duplicate]
    gap: https://github.com/ReliablyObserve/victoria-lakehouse/issues/772
  refs:
    doc: docs/durability.md
    tests:
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedSourceMidQuery_Fails502
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedSourceMidQuery_TwoReaders
      - internal/storage/parquets3/row_read_http_test.go#TestRowReadHTTP_UnreadableObject_IsNotAnOKAnswer
  notes: "Issue: https://github.com/ReliablyObserve/victoria-lakehouse/issues/772. Since the 502 change (R1) a read that lists a source the compactor deleted meanwhile fails with 502 instead of answering without that source's rows and without an error; the answer is still not complete, because the sources are deleted at once and the merged object is not in the read's listing. The cell turns to pass when compaction defers the deletes past the longest read (R4 and the lineage the pods learn the swap from). The tests pin the interim: the read fails with 502 and two readers over one bucket fail alike, then answer exactly once their listing names the merged object. DIRECTION: none (the gap is the owner-accepted interim between the 502 change and the deferred delete)."

- id: lh.durability.compaction_swap_past_bound_logs
  title: "Logs: an object a read listed and that is gone (removed by a compaction or a retention run) or unreadable fails the read with 502 on every surface, and is never skipped: the answer is never short; only an exact answer from the manifest (a timestamp-only count of an object entirely inside the window) goes on"
  surface: lh
  kind: durability
  origin: lh-addition
  expect: pass
  targets: [cold]
  layers: [chaos]
  pending: true
  durability:
    fault: compaction_swap_past_bound
    mode: compaction
    signal: logs
    guarantees: [no-duplicate, rejected-502]
  refs:
    doc: docs/durability.md
    tests:
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_UnreadableObject_FailsInsteadOfPartial
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedObject_FailsWith502
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedObject_ListingWithoutItIsComplete
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_ClassifiedByTheS3Error_NotByItsText
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_EverySurface_FailsOnUnreadableObject
      - internal/storage/parquets3/row_read_http_test.go#TestRowReadHTTP_UnreadableObject_IsNotAnOKAnswer
      - internal/storage/parquets3/row_read_gone_object_test.go#TestGoneObject_ManifestAnswersOnlyWhenExact
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedObject_StaysTolerated
      - internal/storage/parquets3/row_read_gone_object_test.go#TestGoneObject_OtherSignalIsUnaffected
      - internal/storage/parquets3/inferred_bounds_test.go#TestResolveFaults_InferredObjectIsNotAnsweredFromMetadata
  notes: "Issue: https://github.com/ReliablyObserve/victoria-lakehouse/issues/772 (R1). Before, a listed object that was gone (NoSuchKey) was skipped with a log line and the read answered 200 with its rows missing (a Jaeger trace-by-ID answered 404 trace not found for a trace that exists). Now processOneFile and the field_values scan return a 502 ErrorWithStatusCode naming the object (cannot read <key>: the object was removed while this query ran; retry the query), like an unreadable object, which upstream answers 502 when a storage node cannot serve a read (netselect getFirstError); lakehouse_query_file_not_found_total keeps counting. handle404Recovery answers from the manifest only when the plan covers the object, the query is timestamp-only with no filter or tombstone, the object is entirely inside the window and its bounds are exact. The trace-by-ID footer lookup treats a gone object like an unreadable footer (a miss, so the span scan answers and fails for it), because the bound of the other objects could hide the spans of the removed one. Jaeger and Tempo trace-by-ID answer 400, not 502, because VictoriaTraces formats the error with %s (#773), never 404 and never 200. Multi-instance: nothing is shared between readers but the bucket and each reader's own listing, so a reader whose listing names the object fails alike (502) until it refreshes and a refreshed reader answers exactly while a stale one still fails; compaction and the writers are untouched. DIRECTION: upstream-exact status mapping (a gone object answers 502 as upstream's unavailable storage node); a read that used to answer short now fails."

