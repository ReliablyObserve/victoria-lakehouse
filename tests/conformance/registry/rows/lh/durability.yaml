# Durability cells (kind: durability): one fault shape x write mode x signal,
# each with the guarantees that hold after the fault and the Go tests that prove
# them. A cell is backed by tests, not by an HTTP request and compare. A known gap
# is a cell with expect: differ and a durability.gap issue link. Every fault has a
# _logs and a _traces cell. No registry runner executes these cells yet (pending:
# true): their tests run in the unit tier of CI.
#
# Checked by Row.Validate (the schema) and by registry.CheckDurability, which
# `confgen -check` and `go test ./tests/conformance/registry` run: every refs.tests
# entry must name a test that exists (path#TestName), a logs cell's unit tests live
# outside lakehouse-traces/ and a traces cell's under it, the twin cells agree on
# expect and guarantees, a loss-counted cell names a metric internal/metrics
# registers as a counter and whose name contains dropped, lost or errors, and
# docs/durability.md names every cell (or its family) and no cell that does not
# exist. The metric check is lexical: it stops a cell from naming a general
# counter such as lakehouse_insert_rows_total, but it does not prove that the code
# increments the counter on the loss, and it accepts any counter whose name
# contains "errors" (lakehouse_buffer_flush_errors_total counts failures that are
# retried, not losses). That is proved by the tests a cell cites, which read the
# counter before and after.

