- id: lh.durability.drain_plan_mismatch_logs
  title: "Logs: a segment whose rows the drain's plan does not cover is held, not committed; nothing is uploaded for it"
  surface: lh
  kind: durability
  origin: lh-addition
  expect: pass
  targets: [cold]
  layers: [chaos]
  pending: true
  durability:
    fault: drain_plan_mismatch
    mode: buffer-flush
    signal: logs
    guarantees: [no-loss]
  refs:
    doc: docs/durability.md
    tests:
      - internal/storage/parquets3/drain_invariant_test.go#TestDrain_HoldsASegmentWithRowsThePlanDoesNotCover
      - internal/storage/parquets3/drain_invariant_test.go#TestCollectSlice_RefusesAPlanThatDoesNotMatchTheSegment
      - internal/storage/parquets3/drain_invariant_test.go#TestPlanSegment_ReadErrorsAreNotInvariantViolations
      - internal/storage/parquets3/drain_invariant_test.go#TestPlanSegment_AFailingTenantIsReportedNotHeld
      - internal/storage/parquets3/drain_invariant_test.go#TestPlanTenant_Checks
  notes: "The runtime check that would have stopped #388: the drain compares its plan with a count of every row of every tenant over all of int64 time before the first upload, and each group's rows with the plan. A mismatch is lakehouse_buffer_flush_errors_total{stage=\"invariant\"}, an error log, and the segment stays pending (it blocks the later segments until the volume's free-space floor answers 429)."

