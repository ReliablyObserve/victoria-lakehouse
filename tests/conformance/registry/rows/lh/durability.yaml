  durability:
    fault: restart_cardinality_gate
    mode: buffer-flush
    signal: logs
    guarantees: [no-loss, no-duplicate, loss-counted]
    metric: lakehouse_insert_rows_dropped_total
  refs:
    doc: docs/durability.md
    tests:
      - internal/storage/parquets3/acked_rows_cardinality_test.go#TestAckedRows_NotRejudgedByAFreshCardinalityLimiter
      - internal/storage/parquets3/acked_rows_cardinality_test.go#TestAckedRows_FlushFilterNeverDropsOnCardinality
      - internal/storage/parquets3/acked_rows_cardinality_test.go#TestAckedRows_PropertyRandomRestartsAndLimits
      - internal/vlstorage/flush_keeper_test.go#TestFlushRowKeeper_IgnoresTheCardinalityGate
      - internal/vlstorage/insert_admission_test.go#TestInsertAdapter_CountsEveryRowRefusedForTheCardinalityLimit
      - internal/vlstorage/insert_admission_test.go#TestInsertAdapter_SameStreamTwoTenantsOneBatch
      - internal/vlstorage/insert_admission_cross_tenant_test.go#TestInsertAdapter_CrossTenantAdmissionBothOrders
      - internal/vlstorage/insert_admission_test.go#TestFlushRowsDroppedSeries_ExportedFromStart
      - internal/storage/epoch_test.go#TestReasonConstants_AreListedInMetrics
      - internal/storage/tenant_stream_map_test.go#TestTenantStreamMap_ZeroValue
      - internal/storage/tenant_stream_map_test.go#TestTenantStreamMap_SameHashTwoTenants
      - internal/storage/tenant_stream_map_test.go#TestTenantStreamMap_MatchesAPairKeyedMap
      - internal/storage/tenant_stream_map_fuzz_test.go#FuzzTenantStreamMap
      - internal/vlstorage/insert_admission_test.go#TestFlushRowKeeper_CountsTheTraceShapedDrop
      - internal/storage/epoch_test.go#TestNoteCardinalityRefused_CountsEveryRow
      - scripts/ci/tests/cardinality_restart_test.sh#cardinality_limit
  notes: "Fixes #389. The real binary is checked with a restart by scripts/ci/tests/cardinality_restart_test.sh (the code before the fix loses the acknowledged rows of stream a). Restart matrix (clean closes only): no restart, restart while the segment is active, restart after the seal, an upload failure in the middle of the drain then a restart; the fresh limiter admits other streams first. What the limiter admits is stated by a model in the test, not read back from the limiter; the rows the adapter really added to the buffer and the refusals it counted are compared to it on every request. A stream admitted before a restart can be refused after it and its new rows are counted in lakehouse_insert_rows_dropped_total{reason=\"cardinality_limit\"}: the known gap of https://github.com/ReliablyObserve/victoria-lakehouse/issues/485. The admission decision is made per tenant AND stream, so one batch that mixes tenants (/internal/insert and /insert/multitenant/native; /insert/multitenant/native in traces) refuses the tenant at its limit and admits the one with room, in either row order, and each refusal is attributed to the tenant whose limit refused it. The series that must stay 0 (lakehouse_insert_rows_dropped_total, lakehouse_buffer_flush_errors_total and the signal-specific drop counters) are exported at 0 from process start."

