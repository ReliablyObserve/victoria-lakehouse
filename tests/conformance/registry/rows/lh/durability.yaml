  surface: lh
  kind: durability
  origin: lh-addition
  expect: differ
  differ_note: "Known gap: the insert pod retires a committed segment after its own grace (2 x its manifest.refresh_interval + 30 s) and the select pod drops the segment's objects only while the insert pod serves it, so a select pod whose listing has not caught up misses the segment's rows (HTTP 200, not counted) until its next complete listing. The rows are in Parquet; they are hidden, not deleted. Measured in #391: 10,000 rows missing for 147 s with insert pods at 30 s and a select pod at 5m. The cited test pins this behaviour and is inverted by the fix."
  targets: [cold]
  layers: [chaos]
  pending: true
  durability:
    fault: select_pod_lists_after_segment_retired
    mode: buffer-flush
    signal: logs
    guarantees: [no-loss]
    gap: https://github.com/ReliablyObserve/victoria-lakehouse/issues/391
  refs:
