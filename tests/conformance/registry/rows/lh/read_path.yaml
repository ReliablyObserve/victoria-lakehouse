      - internal/s3reader/notfound_test.go#TestIsNotFound_ClassifiesByTheS3Error
  notes: "Fixes #503. A Lakehouse safety guarantee for the cold tier (hot VictoriaLogs reads local parts and has no unreadable-object case; its FATAL on a corrupt part is not comparable). processOneFile logged an error other than a 404 and dropped the object, fileWorkerLoop recorded a cancellation only at the top of its next iteration, and RunQuery returned a recorded error only when its own context was cancelled, so a failing or cancelled last object, or an unreadable object anywhere, gave 200 with rows missing. Now processOneFile returns the error, the first one stops the other workers and RunQuery returns it (cannot read <key>: <cause>), wrapped in httpserver.ErrorWithStatusCode 502, the status upstream gives a read whose storage node is unavailable (netselect getFirstError); the caller's own cancellation or deadline is returned unwrapped. field_values, streams, stream_ids and stream_field_* (scanFieldValuesParallel) behave alike, and so do the readers below them: a page or chunk that cannot be read inside an object (readInt64Column, readScalarColumnFormatted, readMapColumnToBlockColsKeys, scanProjectedFieldValues) returns its error. A failure is classified as a missing object by the S3 error it carries (s3reader.IsNotFound), never by its text. The trace-by-ID footer index (LookupTraceIndex) reports a miss, so that the span scan answers, when a footer could not be read. Jaeger stays 400 because VictoriaTraces formats the error with %s (#773). DIRECTION: a read that answered 200 with rows missing now answers 502 (logs endpoints, stats included); allow_partial_response is not implemented. NOT touched: query.max_rows (#774), QuerySpecificFiles (#750), unflushed-buffer/peer reads (#381), and the compaction swap (#772, row lh.query.removed_source_mid_query)."

- id: lh.query.live_bytes_budget_waits
  title: "query.max_live_bytes bounds the estimated decoded bytes of the objects a query reads at once: a file worker reserves an object's estimate before it takes any slot or opens it and waits, holding nothing, when the reserved bytes would pass the ceiling; it never cancels the read or drops a block, and a stalled consumer does not starve other queries"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [chaos]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_WaitsNeverDrops
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesCeiling_HighWaterMarkIsBounded
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_StalledConsumerDoesNotStarveOtherQueries
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_WaitsForRelease
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ContextEndReleasesWaiter
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_OversizeBlockAdmittedWhenIdle
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ConcurrentWorkersAllFinish
      - internal/storage/parquets3/row_read_complete_test.go#TestAcquireRGDecode_StopsWaitingWhenContextEnds
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_WaitsNeverDrops
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesCeiling_HighWaterMarkIsBounded
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_StalledConsumerDoesNotStarveOtherQueries
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_WaitsForRelease
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ContextEndReleasesWaiter
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_OversizeBlockAdmittedWhenIdle
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ConcurrentWorkersAllFinish
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestAcquireRGDecode_StopsWaitingWhenContextEnds
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_BoundsHeapAndKeepsEveryRow
  notes: "Fixes #503. The budget used to cancel the query context and drop the block, so a read whose budget tripped while the last objects were read answered 200 with their rows missing; and it counted blocks only after they were decoded, which bounded nothing (writeBlock is synchronous, so each worker already holds one decoded block). liveBytesGate reserves per object BEFORE the file-budget and row-group-decoder slots (ctx-aware, atomic, one object larger than the ceiling is admitted alone), so the reserved bytes never pass the ceiling, a waiting worker holds no process-wide slot, and a stalled consumer cannot starve another query. The estimate is the footer's uncompressed size when cached, else the stored size times an assumed 4: an estimate, not the real decoded size. lakehouse_query_memory_budget_exceeded_total counts waits, not cancelled queries (name kept). DIRECTION: the meaning of query.max_live_bytes changes from cancel (partial or failed read) to a real reservation (slower under pressure, never partial). Measured, 40 incompressible objects x 5,000 rows, 16 workers, slow consumer: a 1 MiB ceiling held reserved bytes at 0.6 MiB and peak heap growth at 1.1-2.8 MiB; the ceiling out of reach 9.9 MiB reserved and 11.4-31.4 MiB heap growth; every row in both."

- id: lh.query.removed_source_mid_query
  title: "A source object a compaction deleted while a query ran is skipped silently although its rows are in the merged object: the query answers without those rows and without an error (known gap, #772)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: differ
  differ_note: "Known gap, not approved as a difference. The compactor publishes the merged object and deletes its sources at once (internal/compaction/compactor.go, no grace period) while a query lists its objects once; a query running across the swap reads a deleted source (404), which RunQuery tolerates as 'gone' (handle404Recovery logs it) although the merged object that now holds its rows is not in the query's listing. Reproduced: RunQuery 1400 of 2100 rows with no error (logs and traces), field_values 1400 of 2100, Jaeger trace-by-ID 0 of 7 spans (404 trace not found for a trace that exists). Tracked in #772; the compaction protocol is a separate safety change."
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [chaos]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedSourceMidQuery_KnownGap772
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_RemovedSourceMidQuery_KnownGap772
  notes: "The test pins today's behaviour (the rows of the deleted source are missing, no error) so that the gap stays visible; fixing #772 must turn it into 'every row arrives'. Issue: https://github.com/ReliablyObserve/victoria-lakehouse/issues/772"
