# LH-addition read-path knobs: the cold-read defaults that decide how many S3 requests a query makes.
# kind: flag rows need no `request` and no `seed`.

- id: lh.flag.projected_fetch_mode
  title: "LH s3.projected_fetch_mode (-lakehouse.s3.projected-fetch-mode) — planned (default): a projected read fetches the exact coalesced column-chunk ranges in one wave per file; window is a deprecated fallback kept for one release"
