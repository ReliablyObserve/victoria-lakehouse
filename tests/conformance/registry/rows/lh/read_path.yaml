      - lakehouse-traces/internal/storage/parquets3/footer_overlay_test.go

- id: lh.query.retention_cut
  title: "A query never plans a file that is past its retention, although the retention loop may not have deleted it yet (one Policy object, upstream's day-partition rule, for the eviction loop and the read cut)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/retention/policy_test.go#TestPolicy_Basics
      - internal/retention/policy_test.go#TestPolicy_DayFloorMatchesUpstream
      - internal/retention/policy_test.go#TestPolicy_DayFloorProperty
      - internal/retention/policy_test.go#TestPolicy_SubDayTTLIsExact
      - internal/retention/policy_test.go#TestRunOnce_DeletesWhatThePolicyExpires
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PlansExcludeExpiredFiles
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_DayFloorBoundary
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PerTenantRetention
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_ZeroKeepCutsOnlyItsRule
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_UsesTheInjectedClock
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PlansExcludeExpiredFiles
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_DayFloorBoundary
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PerTenantRetention
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_ZeroKeepCutsOnlyItsRule
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_UsesTheInjectedClock
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_ExpectedValues
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionCut_EveryRoleInstallsThePolicy
      - cmd/lakehouse-logs/retention_policy_test.go#TestRun_InstallsTheRetentionPolicyForEveryRole
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetention_EvictionAndCutShareOnePolicy
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_ExpectedValues
      - lakehouse-traces/retention_policy_test.go#TestRetentionCut_EveryRoleInstallsThePolicy
      - lakehouse-traces/retention_policy_test.go#TestRun_InstallsTheRetentionPolicyForEveryRole
      - lakehouse-traces/retention_policy_test.go#TestRetention_EvictionAndCutShareOnePolicy
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
  notes: "Upstream VictoriaLogs/VictoriaTraces drop whole UTC day partitions: a partition is dropped when its day is before the day of now-retention (storage.go getMinAllowedDay; minimum retention one day). Lakehouse's eviction loop deleted files on its own schedule (and only on the insert and all roles), so a file past retention stayed readable until the loop reached it, and a select pod could serve it indefinitely. The cut and the eviction now use one Policy object with upstream's day rule for a TTL of a day or more; a TTL below a day (a Lakehouse extension, for example keep: 0d) is judged exactly by the newest row's age. DIRECTION: this changes results for data older than the retention that eviction has not yet removed, and it moves the eviction boundary to the day floor (later by up to 23 hours than the exact rule). NOT touched by this change: buffered rows, /select/tenant_ids and the stats and admin APIs (see #619). An alias-keyed tenant override that resolves after start applies to the cut and to eviction alike only after a restart."

- id: lh.query.tombstone_per_file_fast_path
  title: "A tombstone only turns the metadata fast paths off for the files it can match: a file whose time range, complete label set or pmeta bloom proves that no row of it can match stays on the fast path (a request that carries the timestamp-only hint makes no S3 read for a count; a count without it still reads every file), the other files are read and the deleted rows are excluded (one proof, memory only, in both binaries)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "* | stats count() n", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/delete/proof_test.go#TestKeepRows_EqualsPerRowReference
      - internal/delete/proof_test.go#TestCompileProofs_Terms
      - internal/delete/proof_test.go#TestFileProof_CannotMatch
      - internal/delete/proof_test.go#TestCompileProofs_TermsAreImpliedByAMatch
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_ValueNoFileHolds_KeepsMetadataPath
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_TaskOlderThanFile_KeepsMetadataPath
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_MixedWindow_OnlyMatchingFilesAreRead
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_FieldNamesAndFiltered_EqualScan
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_FieldValues_AggregateKeptForCleanFiles
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_CleanTombstoneIsInvisibleToReads
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_CompactedLabelSetIsNotTrusted
      - internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_ReaderPodOfACompactedFile
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_NeverProves
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_AnyTombstoneThatMayMatchWins
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_SameIDDifferentQuery
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_BloomFacetOnly
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_CleanLane_IsPerTenant
      - internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_PairBudget
      - internal/storage/parquets3/tombstone_proof_property_test.go#TestProperty_TombstoneProof_GatedEqualsScan
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_ValueNoFileHolds_KeepsMetadataPath
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_TaskOlderThanFile_KeepsMetadataPath
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_TraceIDDelete_OnlyTheFileHoldingItIsRead
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_MixedWindow_OnlyMatchingFilesAreRead
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_FieldValues_AggregateKeptForCleanFiles
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_CleanTombstoneIsInvisibleToReads
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_CompactedLabelSetIsNotTrusted
      - lakehouse-traces/internal/storage/parquets3/tombstone_gating_test.go#TestTombstoneProof_ReaderPodOfACompactedFile
      - lakehouse-traces/internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_NeverProves
      - lakehouse-traces/internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_TraceIDBloomFacetOnly
      - lakehouse-traces/internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_CleanLane_IsPerTenant
      - lakehouse-traces/internal/storage/parquets3/tombstone_proof_test.go#TestTombstoneProof_PairBudget
      - lakehouse-traces/internal/storage/parquets3/tombstone_proof_property_test.go#TestProperty_TombstoneProof_GatedEqualsScan
  notes: "A tombstone (an upstream-shaped delete task has no lower bound) used to switch off the manifest-answered counts, the label-count push-down and the metadata-only row-group reads for every file of the window, and to project its columns into every read. The read path now proves, per file and from memory only (the file's time range, a complete manifest label set holding none of the tombstone's exact values (not used for a compaction output, recognised by its level or by its compacted- key, whose label set is a union of its inputs' and partial when an input had none: #621), the pmeta bloom facet for a bloomed column; never a per-file .bloom read), that no row of the file can match any tombstone acting on its tenant, and reads that file as if there were no tombstone. A tombstone the proof cannot decide (a map attribute, a regex, a negation, an OR, an empty value, an exact prefix, an incomplete label set, no bloom facet, unknown time bounds) keeps today's path for the files it may match. Unflushed buffered rows are never proven clean. The per-row matcher resolves each tombstone's range and filter once per block and checks the time first. Results are identical; a file that really holds deleted rows still costs a read until compaction removes them. Perf guard: BenchmarkTombstoneGating and BenchmarkTombstoneGatingCold (internal/storage/parquets3/tombstone_gating_bench_test.go: 8 objects, K = 0/1/10/100 upstream-shaped tombstones; count, hits, filtered count, count by service, field_names). DIRECTION: none (internal optimisation, no change of any answer)."
