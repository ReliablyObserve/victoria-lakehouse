      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_ExpectedValues
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionCut_EveryRoleInstallsThePolicy
      - cmd/lakehouse-logs/retention_policy_test.go#TestRun_InstallsTheRetentionPolicyForEveryRole
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetention_EvictionAndCutShareOnePolicy
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_ExpectedValues
      - lakehouse-traces/retention_policy_test.go#TestRetentionCut_EveryRoleInstallsThePolicy
      - lakehouse-traces/retention_policy_test.go#TestRun_InstallsTheRetentionPolicyForEveryRole
      - lakehouse-traces/retention_policy_test.go#TestRetention_EvictionAndCutShareOnePolicy
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
  notes: "Upstream VictoriaLogs/VictoriaTraces drop whole UTC day partitions: a partition is dropped when its day is before the day of now-retention (storage.go getMinAllowedDay; minimum retention one day). Lakehouse's eviction loop deleted files on its own schedule (and only on the insert and all roles), so a file past retention stayed readable until the loop reached it, and a select pod could serve it indefinitely. The cut and the eviction now use one Policy object with upstream's day rule for a TTL of a day or more; a TTL below a day (a Lakehouse extension, for example keep: 0d) is judged exactly by the newest row's age. DIRECTION: this changes results for data older than the retention that eviction has not yet removed, and it moves the eviction boundary to the day floor (later by up to 23 hours than the exact rule). NOT touched by this change: buffered rows, /select/tenant_ids and the stats and admin APIs (see #619). An alias-keyed tenant override that resolves after start applies to the cut and to eviction alike only after a restart."

- id: lh.query.tombstone_per_file_fast_path
  title: "A tombstone only turns the metadata fast paths off for the files it can match: a file whose time range, complete label set or pmeta bloom proves that no row of it can match stays on the fast path (a request that carries the timestamp-only hint makes no S3 read for a count; a count without it still reads every file), the other files are read and the deleted rows are excluded (one proof, memory only, in both binaries)"
