      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_FirstErrorKeepsMixedErrorTypes
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_FailureStopsTheOtherWorkers
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_FirstErrorKeepsMixedErrorTypes
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_FailureStopsTheOtherWorkers
      - internal/storage/parquets3/row_read_columnar_errors_test.go#TestColumnarReader_ReportsAPageItCannotRead
      - internal/storage/parquets3/row_read_columnar_errors_test.go#TestColumnarReaders_ReportAnIOError
      - lakehouse-traces/internal/storage/parquets3/row_read_columnar_errors_test.go#TestColumnarReader_ReportsAPageItCannotRead
      - lakehouse-traces/internal/storage/parquets3/row_read_columnar_errors_test.go#TestColumnarReaders_ReportAnIOError
  notes: "Fixes #503. processOneFile logged an error other than a 404 and dropped the object, fileWorkerLoop recorded a cancellation only at the top of its next iteration, and RunQuery returned a recorded error only when its own context was cancelled, so a failing or cancelled last object, or an unreadable object anywhere, gave 200 with rows missing. Now processOneFile returns the error, the first one stops the other workers and RunQuery returns it (cannot read <key>: <cause>); the caller's own cancellation or deadline is returned too. field_values, streams, stream_ids and stream_field_* (scanFieldValuesParallel) behave alike, and so do the readers below them: a page or chunk that cannot be read inside an object (the columnar reader's readInt64Column, readScalarColumnFormatted and readMapColumnToBlockColsKeys, and scanProjectedFieldValues) returns its error where each handed back the values read so far, which left a column short or empty and the read answering 200 with rows missing. The object's key is cut out of the error text before it is classified as missing, so part-404.parquet is not tolerated. Error status: the error carries no status code, so upstream's handler answers it as it answers every other RunQuery error (400). DIRECTION: a read that answered 200 with rows missing now answers non-2xx (the status for the cluster-mode analogue, an unreadable storage node, is 502 upstream; allow_partial_response is upstream's opt-in partial answer and is not implemented). NOT touched: query.max_rows (an explicit ceiling), QuerySpecificFiles (no caller outside tests), and unflushed-buffer/peer reads, which degrade silently."

- id: lh.query.live_bytes_budget_waits
  title: "query.max_live_bytes makes a file worker wait for the consumer when the in-flight bytes reach the ceiling; it never cancels the read or drops a block, also while the last objects are read"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [chaos]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_WaitsNeverDrops
      - internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_BoundsHeapAndKeepsEveryRow
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_WaitsNeverDrops
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestRowRead_LiveBytesBudget_BoundsHeapAndKeepsEveryRow
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_WaitsForRelease
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ContextEndReleasesWaiter
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_OversizeBlockAdmittedWhenIdle
      - internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ConcurrentWorkersAllFinish
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_WaitsForRelease
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ContextEndReleasesWaiter
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_OversizeBlockAdmittedWhenIdle
      - lakehouse-traces/internal/storage/parquets3/row_read_complete_test.go#TestLiveBytesGate_ConcurrentWorkersAllFinish
  notes: "Fixes #503. The budget used to cancel the query context and drop the block, so a read whose budget tripped while the last objects were read answered 200 with their rows missing. liveBytesGate waits instead (ctx-aware, one atomic load on the fast path, a block larger than the ceiling is admitted when nothing else is in flight); the bytes held stay within the ceiling plus one block per worker. lakehouse_query_memory_budget_exceeded_total now counts waits, not cancelled queries. DIRECTION: the meaning of query.max_live_bytes changes from cancel (partial or failed read) to backpressure (slower under pressure, never partial). Measured on a 40-object, 16-worker, 256 KiB-ceiling run with a slow consumer: before 20k-25k of 200k rows and context canceled, after 200k of 200k rows, peak heap growth 13-17 MiB before and 16-17 MiB after."
