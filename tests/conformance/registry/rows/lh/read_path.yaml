# LH-addition read-path knobs: the cold-read defaults that decide how many S3 requests a query makes.
# kind: flag rows need no `request` and no `seed`.

- id: lh.flag.projected_fetch_mode
  title: "LH s3.projected_fetch_mode (-lakehouse.s3.projected-fetch-mode) — planned (default): a projected read fetches the exact coalesced column-chunk ranges in one wave per file; window is a deprecated fallback kept for one release"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/read-path.md
    tests:
      - internal/config/s3_readpath_knobs_test.go
      - internal/storage/parquets3/cold_read_getcount_test.go
      - internal/storage/parquets3/footer_overlay_test.go
      - lakehouse-traces/internal/storage/parquets3/cold_read_getcount_test.go
      - lakehouse-traces/internal/storage/parquets3/footer_overlay_test.go

- id: lh.flag.footer_max_bytes
  title: "LH cache.footer_max_bytes (-lakehouse.cache.footer-max-bytes) — byte budget of the footer cache (0 = auto: 10% logs / 20% traces of the memory the process may use for caches, clamped to 32 MiB..1 GiB / 2 GiB); a cached file opens with zero S3 round trips"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/read-path.md
    tests:
      - internal/config/config_test.go
      - internal/storage/parquets3/footer_cache_test.go
      - internal/storage/parquets3/footer_overlay_test.go
      - lakehouse-traces/internal/storage/parquets3/footer_cache_test.go
      - lakehouse-traces/internal/storage/parquets3/footer_overlay_test.go

- id: lh.query.retention_cut
  title: "A query never plans a file that is past its retention, although the retention loop may not have deleted it yet (one predicate, retention.Policy, for the eviction loop and the read cut)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs:
    doc: docs/read-path.md
    tests:
      - internal/retention/policy_test.go#TestPolicy_Basics
      - internal/retention/policy_test.go#TestPolicy_AgreesWithTheEvictionLoop
      - internal/retention/policy_test.go#TestPolicy_Boundaries
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PlansExcludeExpiredFiles
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_BoundaryAtTheTTL
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PerTenantRetention
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_ZeroKeepCutsOnlyItsRule
      - internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_UsesTheStoreClock
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PlansExcludeExpiredFiles
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_BoundaryAtTheTTL
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_PerTenantRetention
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_ZeroKeepCutsOnlyItsRule
      - lakehouse-traces/internal/storage/parquets3/retention_cut_test.go#TestRetentionCut_UsesTheStoreClock
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_AgreesWithTheEvictionManager
      - cmd/lakehouse-logs/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_AgreesWithTheEvictionManager
      - lakehouse-traces/retention_policy_test.go#TestRetentionPolicy_RejectsAnInvalidConfig
      - internal/s3reader/storeclock_test.go#TestStoreClock_ObserveIgnoresWhatItCannotParse
      - internal/s3reader/storeclock_test.go#TestStoreClock_FollowsTheStoreAndAdvances
      - internal/s3reader/storeclock_test.go#TestClientPool_StoreClockAccessors
      - internal/s3reader/storeclock_test.go#TestClientPool_NoDateHeaderLeavesTheClockUnknown
      - internal/s3reader/storeclock_test.go#TestClientPool_LearnsTheStoreClockFromResponses
      - tests/s3compat/s3compat_test.go#TestProd_StoreClock
  notes: "Upstream drops a partition at the retention boundary. Lakehouse's eviction loop deletes files on its own schedule (and only on the insert and all roles), so before this cut a file past retention stayed readable until the loop reached it, and a select pod could serve it indefinitely. DIRECTION: this changes results for data older than the retention that eviction has not yet removed; it moves the answer toward upstream's. The cut and the eviction are built from one retentionConfig at start; an alias-keyed tenant override that resolves after start applies to neither until a restart."
