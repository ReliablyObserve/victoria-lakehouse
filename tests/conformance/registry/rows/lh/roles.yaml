- id: lh.flag.ring_self_resolved_gauge
  title: "Metrics — lakehouse_ring_self_resolved{ring} is 1 only when exactly one discovered member is the pod and lakehouse_ring_self_in_peers{ring} is 1 only when that member is in the set the ring hashes over, for the compaction and peercache rings, in both binaries; the old unlabeled lakehouse_compaction_ownership_self_in_peers is gone"
