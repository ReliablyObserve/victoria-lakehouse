# LH-addition role semantics: what each --lakehouse.role may write to the bucket.
# kind: flag rows need no `request` and no `seed`.
#
# Rule: only the roles all and insert run the background jobs that write to S3 or
# to state shared between pods (compaction and its orphan sweep, delete rewrites,
# retention, the stats snapshots and sidecar, the legacy pmeta cleanup, the traces
# label-index upload). A select pod starts none of them whatever its config says
# (compaction is on by default) and issues no PUT, COPY or DELETE for maintenance.
# Semantics: docs/architecture/roles.md.

- id: lh.flag.role_select_runs_no_maintenance.logs
  title: "Logs — a select pod starts no compaction, orphan sweep, delete rewrite, retention or stats snapshot even with compaction.enabled, and writes nothing to the bucket; one insert pod and two select pods over one bucket store every row once"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/architecture/roles.md
    tests:
      - cmd/lakehouse-logs/maintenance_gate_test.go
      - cmd/lakehouse-logs/maintenance_inventory_test.go

- id: lh.flag.role_select_runs_no_maintenance.traces
  title: "Traces — a select pod starts no compaction, orphan sweep, delete rewrite, retention, stats snapshot or label-index upload even with compaction.enabled, and writes nothing to the bucket; one insert pod and two select pods over one bucket store every span once"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/architecture/roles.md
    tests:
      - lakehouse-traces/maintenance_gate_test.go
      - lakehouse-traces/maintenance_inventory_test.go

# Ring self-address: a pod listens on :9428 and discovery lists it by IP or
# hostname, so it finds its own entry in the discovered member list with
# internal/selfaddr (port + IP, StatefulSet hostname, dashed-IP name or DNS). A pod
# that does not find itself owns nothing and never adds its listen address.
# Semantics: docs/architecture/roles.md#how-a-pod-finds-itself-in-the-ring.

- id: lh.flag.ring_self_resolution.logs
  title: "Logs — every writer listening on :9428 finds its own entry in the discovered ring (IPv4, IPv6, StatefulSet hostname, dashed IPv4 and IPv6) so each of 672 partitions has exactly one compaction owner for 1, 2, 3 and 8 writers; a pod that is not in the ring owns nothing and never adds its listen address; two writers and two selects over one bucket compact every partition once and store every row once"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/architecture/roles.md
    tests:
      - cmd/lakehouse-logs/ring_self_test.go
      - cmd/lakehouse-logs/ring_multiinstance_test.go
      - internal/selfaddr/selfaddr_test.go
      - internal/selfaddr/fuzz_test.go
      - internal/selfaddr/env_test.go
      - internal/selfaddr/tracker_test.go
      - internal/compaction/ownership_self_test.go
      - internal/peercache/ring_self_test.go

- id: lh.flag.ring_self_resolution.traces
  title: "Traces — every writer listening on :10428 finds its own entry in the discovered ring (IPv4, IPv6, StatefulSet hostname, dashed IPv4 and IPv6) so each of 672 partitions has exactly one compaction owner for 1, 2, 3 and 8 writers; a pod that is not in the ring owns nothing and never adds its listen address; two writers and two selects over one bucket compact every partition once and store every span once"
