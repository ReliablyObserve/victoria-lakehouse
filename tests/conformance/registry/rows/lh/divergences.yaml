- id: lh.cold.instrumentation_scope_search_matches_hot_traces
  title: "TraceQL instrumentation.* filters find the same traces on cold as on hot"
  surface: lh
  kind: select
  origin: lh-shim
  expect: pass
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/tempo/api/search }
  request: { method: GET, path: /select/tempo/api/search, params: { q: '{ instrumentation.otel.scope.name = "github.com/reliablyobserve/instrumentation" }', start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: trace }
  layers: [api]
  pending: true
  refs:
    tests:
      - tests/parity/traces_events_links_test.go#TestParity_Traces_EventsLinksScopeAttrs
  notes: >-
    VictoriaTraces v0.12 never matches `event.` / `link.` TraceQL filters (the storage appends the index to
    the field name), on hot as on cold, so only the instrumentation scope has a search row.
