- id: lh.cold.phrase_filter_matches_hot_logs
  title: "A quoted phrase filter on cold matches the same rows as hot — logs"
  surface: lh
  kind: select
  origin: lh-shim
  expect: pass
  targets: [hot, cold]
  seed: [logs.base]
  upstream: { route: /select/logsql/stats_query }
  request: { method: GET, path: /select/logsql/stats_query, params: { query: "k8s.pod.name:\"api-gateway\" | stats count() rows", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: count }
  layers: [api]
  pending: true
  refs:
    tests:
      - tests/parity/phrase_pruning_parity_test.go#TestParity_PhrasePruning_Logs
      - internal/storage/parquets3/phrase_pruning_test.go#TestPhrasePruning_ColdMatchesHotMatcher
      - internal/storage/parquets3/phrase_exact_test.go#TestPhraseExact_EquivalentToExactOnAttestedDomain
  notes: >-
    field:"v" is a phrase: it matches any value that contains v on token boundaries, so
    k8s.pod.name:"api-gateway" matches api-gateway-7d9f8b6c4. Cold used to prune it as the
    exact value v and returned 0 rows. A phrase is pruned by its tokens; a full lowercase-hex
    trace_id phrase is pruned as a value only in files whose footer attests lowercase-hex
    trace ids (lh.trace_id_hex=1).

