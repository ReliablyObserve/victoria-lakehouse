- id: lh.cold.trace_events_invalid_utf8_matches_hot_traces
  title: "Event and link strings that are not valid UTF-8 come back from cold byte for byte, as hot returns them"
  surface: lh
  kind: select
  origin: lh-shim
  expect: pass
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/logsql/query }
  request: { method: GET, path: /select/logsql/query, params: { query: "span_id:*", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: ndjson-multiset }
  layers: [api]
  pending: true
  refs:
    tests:
      - tests/parity/traces_events_links_layers_test.go#TestParity_Traces_EventsLinksInvalidUTF8
      - internal/schema/traceextras_test.go#TestSpanSubFields_InvalidUTF8IsReversible
      - internal/schema/traceextras_test.go#TestForEachSpanSubField_RejectsMalformedBytesObject
      - internal/schema/traceextras_test.go#FuzzSpanSubFields
      - lakehouse-traces/internal/storage/parquets3/cold_events_links_test.go#TestCold_EventsLinks_InvalidUTF8ComesBackExact
  notes: >-
    Closes #434. encoding/json rewrites invalid UTF-8 to U+FFFD, so the two JSON columns could not carry what hot
    VictoriaTraces keeps. A value that is not valid UTF-8 is now the object {"$bytes":"<base64>"} in place of the
    string and a name the key "$b64:<base64>"; both stay valid JSON for external readers (docs/open-parquet-format.md),
    valid text is written exactly as before, and an attribute value is always a string so the object form cannot
    collide with a value. The parity case sends the strings in OTLP protobuf (JSON cannot carry them) to hot and cold
    and compares the LogsQL fields in the buffer and from Parquet. The conformance runner does not execute the row yet
    (pending).
