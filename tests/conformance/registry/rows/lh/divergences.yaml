  seed: [logs.base]
  request: { method: POST, path: /lakehouse/compaction/recompact, params: { partition: "dt=2026-01-01/hour=00" } }
  compare: { type: status }
  layers: [api, chaos]
  pending: true
  refs:
    tests:
      - internal/compaction/column_fence_test.go#TestCompactor_Fence_SkipsUnknownColumnObjects
      - internal/compaction/column_fence_test.go#TestCompactor_Fence_NothingToMergeLeavesEverything
      - internal/compaction/column_fence_test.go#TestCompactor_Fence_KnownSchemaMergesAsBefore
      - internal/compaction/column_fence_test.go#TestCompactor_Fence_PropertyNoUnknownInputIsRewritten
      - internal/compaction/column_fence_callers_test.go#TestFence_Scheduler_AnnouncesOnlyMergedInputs
      - internal/compaction/column_fence_callers_test.go#TestFence_TierA_AnnouncesOnlyMergedInputs
      - internal/compaction/column_fence_callers_test.go#TestFence_AllFencedPlanDoesNotStarveTenant
      - internal/compaction/column_fence_callers_test.go#TestFence_FencedObjectsAreNotDownloadedAgain
      - internal/compaction/column_fence_callers_test.go#TestFence_CounterCountsObjectsOnce
      - internal/compaction/column_fence_callers_test.go#TestFence_ForceCompactReportsFencedNoOp
      - internal/compaction/column_fence_callers_test.go#TestFence_KeyedByBucketAndKey
      - internal/schema/column_fence_test.go#TestUnknownColumns
      - internal/schema/column_fence_test.go#TestUnknownColumns_RetiredColumnsAreAllowed
      - internal/schema/column_fence_test.go#TestFenceLog
      - internal/metrics/fence_visibility_test.go#TestSkippedUnknownColumns_ExportedAndObservable
      - tests/parity/traces_events_links_layers_test.go#TestParity_ForwardFenceCounterStaysZero
  notes: >-
    Forward fence (#409 review, logs): before merging an input, compaction compares its top-level Parquet columns with the
    columns the current row struct models (plus schema.RetiredColumns, empty today). An object with an unknown column is
    skipped: the other inputs are merged and announced (pmeta, peers) as removed, the object stays in place and in the
    manifest, is never planned again in this process (no download per tick, no run counted, no merge slot taken: an
    all-fenced plan does not starve the tenant), and a forced recompaction reports it (fenced_files). Counted once per
    object in lakehouse_compaction_skipped_unknown_columns_total{signal="logs",op="compact"}; alert
    LakehouseCompactionSkippedUnknownColumns, dashboard panel Compaction Forward Fence; the parity stack asserts the
    counter stays 0 on a single-version fleet. Protects every future column addition; it cannot protect the #430
    transition itself, because older pods have no fence (docs/operations.md). The conformance runner does not execute
    the row yet (pending).
