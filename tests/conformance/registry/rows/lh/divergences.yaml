- id: lh.cold.logs_scalar_after_map_field_values
  title: "LH cold field_values and field_names read a scalar column that follows MAP columns from its own chunk (logs)"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /select/logsql/field_values, params: { query: "*", field: "level", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: values-with-hits }
  layers: [api]
  pending: true
  refs:
    tests:
      - internal/storage/parquets3/leaf_index_test.go#TestScanProjectedFieldValues_ScalarAfterMapsIsIndexedByLeaf
      - internal/storage/parquets3/leaf_index_test.go#TestAccumulateFieldHits_ScalarAfterMapsIsIndexedByLeaf
  notes: >-
    A MAP column is one top-level column but two leaf chunks, so a scalar column after a map sits at a later
    chunk than its position among the top-level columns. The logs schema keeps its maps last today, so this
    guards the schema against a column added after them; the fixture puts the maps first. The traces
    binary already had the fix (#409). field_values over the map attributes themselves is #433.

