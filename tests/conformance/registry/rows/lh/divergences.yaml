# --- Span events, span links and instrumentation-scope attributes (#409) ---------------------------
# Hot VictoriaTraces stores a span's events, links and scope attributes and returns them from trace-by-ID
# (Jaeger, Tempo v1/v2), LogsQL (`event:*`, `link:*`, `scope_attr:*`) and TraceQL (`instrumentation.*`).
# The cold tier keeps them in two JSON string columns (`span.events_json`, `span.links_json`) and the
# `scope.attributes` map of the Parquet row and reads them back as the same fields. Every row below is
# covered at each data layer by Go tests that run both the insert-buffer path and the cold path (see refs);
# the parity cases in tests/parity/traces_events_links_test.go compare hot against cold on the parity stack.

- id: lh.cold.trace_events_preserved_traces
  title: "Span events come back from cold trace-by-ID exactly as hot returns them — Jaeger span logs"
  surface: lh
  kind: select
  origin: lh-shim
  expect: pass
  targets: [hot, cold]
  seed: [traces.base]
  upstream: { route: /select/jaeger/api/traces/ }
  request: { method: GET, path: "/select/jaeger/api/traces/{{seed.trace_id}}" }
  compare: { type: trace }
  layers: [api]
  pending: true
  refs:
    tests:
      - tests/parity/traces_events_links_test.go#TestParity_Traces_EventsLinksScopeAttrs
      - lakehouse-traces/internal/storage/parquets3/flush_events_links_e2e_test.go#TestFlush_SpanEventsLinksScopeAttrs_SurviveToCold
      - lakehouse-traces/internal/storage/parquets3/flush_events_links_e2e_test.go#TestBridge_SpanEventsLinksScopeAttrs_SelectPodMatchesInsertPod
      - lakehouse-traces/internal/storage/parquets3/cold_events_links_test.go#TestCold_EventsLinksScopeAttrs_RowsEqualHot
      - internal/compaction/events_links_test.go#TestCompactor_KeepsEventsLinksAndMergesWithOldFiles
      - internal/delete/events_links_test.go#TestRewriteFile_Traces_KeepsEventsLinksAndMatchesEventFields
  notes: >-
    Layers: the local insert buffer is upstream's own storage (hot by construction); the bridged peer
    buffer (select pod reading an insert pod) is TestBridge_SpanEventsLinksScopeAttrs_*; a freshly flushed
    object is TestFlush_*; a compacted object is TestCompactor_KeepsEventsLinks* (old objects without the
    columns merge with new ones, the old spans get none) and the parity stack, whose compaction interval
    merges the seeded hours. Before the fix the flush dropped every event, link and scope attribute and
    the bridge dropped them again, so a trace read from Parquet lost its exception events.

