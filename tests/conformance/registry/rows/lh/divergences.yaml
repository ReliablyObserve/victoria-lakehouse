- id: lh.cold.trace_events_layers_match_hot_traces
  title: "Span events, links and scope attributes of spans written by the test match hot on every layer and tenant form — LogsQL, Jaeger, Tempo v1/v2"
  surface: lh
  kind: select
  origin: lh-addition
  expect: pass
  targets: [hot, cold]
  seed: [traces.base]
  request: { method: GET, path: "/select/jaeger/api/traces/{{seed.trace_id}}" }
  compare: { type: exact-json }
  layers: [api]
  pending: true
  refs:
    tests:
      - tests/parity/traces_events_links_layers_test.go#TestParity_Traces_EventsLinksLayers
  notes: >-
    Lock for #409. The case writes its own spans to hot VictoriaTraces and to Lakehouse for two numeric
    tenants (AccountID only, AccountID with a ProjectID): events and links with every OTLP attribute type,
    empty and unicode values, a 64 KiB value, 40 events on one span, duplicate event names, links with trace
    state, flags and attributes, scope attributes. Exact comparison of the event/link/scope fields of the
    LogsQL rows, Jaeger logs/references/scope tags and Tempo events/links/scopes, on three layers: buffer,
    Parquet only (after the buffer flushed) and compacted (POST /lakehouse/compaction/recompact over two
    files per tenant). No restart layer (the parity stack has no restart step; the restart read is pinned
    by the traces flush end-to-end test) and no string tenant aliases (opt-in, not configured there).

