- id: lh.delete.fence_unknown_columns_logs
  title: "LH delete rewrite defers a logs object with a column it does not model: the object and the tombstone stay"
  surface: lh
  kind: admin
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: GET, path: /delete/logsql/tombstones }
  compare: { type: status }
  layers: [api, chaos]
  pending: true
  refs:
    tests:
      - internal/delete/column_fence_test.go#TestRewriter_Fence_UnknownColumnsAreNotRewritten
      - internal/delete/column_fence_test.go#TestRewriter_Fence_KnownSchemaRewritesAsBefore
      - internal/delete/column_fence_test.go#TestRewriter_Fence_PropertyNoUnknownInputIsRewritten
      - internal/delete/column_fence_test.go#TestRewriteScheduler_FencedObjectIsDeferredNotAnError
  notes: >-
    Forward fence (#409 review, logs): Rewriter.Prepare fails with delete.ErrUnknownColumns for an object whose top-level
    columns the current row struct does not model, without downloading it again after the first refusal. No
    replacement is written and the source is untouched; the rewrite scheduler counts it as a deferral
    (lakehouse_delete_rewrite_deferred_total{reason="unknown_columns"}), not a rewrite error, so the rewrite-error
    alert stays quiet, and keeps the tombstone pending: it stays listed (/delete/logsql/tombstones, /delete/active_tasks),
    its rows stay hidden by the tombstone and the metadata-only fast paths stay off for that tenant in its range.
    Counted once per object in lakehouse_compaction_skipped_unknown_columns_total{signal="logs",op="delete_rewrite"}.
    The conformance runner does not execute the row yet (pending).
