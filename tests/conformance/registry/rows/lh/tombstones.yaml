# Tombstones: the deletes every pod reads from the bucket (write-once keys, a polling
# view, a stale-view gate). Semantics: docs/deletion-strategy.md. Physical removal is
# not enabled: every delete mode hides the rows at query time.
#
# Deviations from upstream VictoriaLogs/VictoriaTraces delete behaviour (the `differ`
# rows below) are listed in docs/parity-and-gaps.md and in docs/deletion-strategy.md.

- id: lh.delete.tombstone_write_once
  title: "Tombstones — the only keys under {prefix}_tombstones/ are the definition and, for a hide delete, the undo; both are created with If-None-Match and never overwritten, so two pods creating the same task leave one object, a failed create leaves nothing owed, a pod's disk is a cache that is never written back, and the only DELETE is the retention GC of a tombstone whose data is past retention"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api, chaos]
  refs:
    doc: docs/deletion-strategy.md
    tests:
      - internal/delete/multiinstance_test.go#TestMI_NoKeyIsEverOverwritten
      - internal/delete/multiinstance_test.go#TestMI_ConcurrentCreateOfOneTask_ExactlyOneObject
      - internal/delete/protocol_test.go#TestCreate_FailureOwesNothing
      - internal/delete/protocol_test.go#TestRestart_FromStaleCache_DoesNotResurrectAnUndeletedTombstone
      - internal/delete/protocol_test.go#TestForeignKeysAreIgnoredAndCounted
      - internal/delete/gc_test.go#TestGC_SteadyState
      - internal/delete/s3backend_test.go#TestS3Backend_ConditionalCreate
      - internal/delete/handler_scope_test.go#TestDeleteAPI_LeftoversRouteIsGone
      - internal/delete/column_fence_test.go#TestTombstones_NeverWriteOutsideTheTombstonePrefix
      - tests/s3compat/s3compat_test.go#TestProd_TombstoneProtocol
      - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_DeleteAndUndeleteReachEveryPod
      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_DeleteAndUndeleteReachEveryPod

- id: lh.delete.tombstone_visible_all_pods_bound
  title: "A delete taken on any pod hides its rows on every pod, writer or reader, within one poll interval (the pod that took it at once), for buffer, cold and compacted data in both signals; a short or failed listing delays learning a new delete and never makes a pod forget one"
