      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_DeleteAndUndeleteReachEveryPod
  notes: "Lakehouse extension on its own tombstone API: reversibility follows the mode. Hide is undoable; permanent and auto are meant to remove the rows physically, so they are not."

- id: lh.delete.no_empty_row_residue
  title: "A delete never leaves a row that holds only its _time and _stream fields; upstream can (VictoriaLogs lib/logstorage rows.go, issue #825) because it removes fields in place"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: differ
  differ_note: "Approved improvement over upstream. A Lakehouse tombstone hides a matching row as a whole at query time, so a hidden row is never returned, with or without its fields; there is no partially deleted row to return. Where upstream's delete leaves an empty residue row, a Lakehouse query returns nothing. No parity test issues deletes against hot VL/VT, so the harness needs no rule for that residue; if one is ever added it must not count the residue as a Lakehouse miss."
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/parity-and-gaps.md
    tests:
      - internal/storage/parquets3/tombstone_gate_test.go#TestTombstoneHidesWholeRows_NoEmptyResidue
      - lakehouse-traces/internal/storage/parquets3/tombstone_gate_test.go#TestTombstoneHidesWholeRows_NoEmptyResidue

- id: lh.delete.run_task_repeat_idempotent
  title: "The same delete task delivered twice with identical content (the vlselect fan-out to several nodes, or a retry) is a success; upstream refuses a repeated task id; a repeated id with different content is refused with upstream's message"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: differ
  differ_note: "Consequence of sharing one tombstone prefix between pods (a third difference). Upstream's registry is node-local, so a repeated task_id is an error there. Every Lakehouse node of one deployment reads the same bucket, so the fan-out of one task to N nodes writes the same key with the same bytes; the first create wins and the others find it. Identical bytes are an idempotent success, different content under one id is upstream's 'already registered' error."
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/parity-and-gaps.md
    tests:
      - internal/delete/tasks_test.go#TestRunTask_IdenticalTaskIsIdempotent
      - internal/delete/tasks_test.go#TestRunTask_EdgeCases
      - internal/delete/tombstone_sync_test.go#TestRunTask_SameIDDifferentContent_SecondIsAlreadyRegistered
      - internal/delete/multiinstance_test.go#TestMI_ConcurrentCreateOfOneTask_ExactlyOneObject

