  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: POST, path: /delete/logsql/delete, params: { query: "service.name:checkout", start: "{{seed.start}}", end: "{{seed.cold_end}}", mode: "hide" } }
  compare: { type: count }
  layers: [api, chaos]
  pending: true
  refs:
    doc: docs/deletion-strategy.md
    tests:
      - internal/delete/multiinstance_test.go#TestMI_Delete_VisibleEverywhereWithinOnePoll
      - internal/delete/protocol_test.go#TestShortListing_NeverDropsOrDeletes
      - internal/delete/protocol_test.go#TestPoll_LearnsADeleteTakenElsewhere
      - internal/delete/listing_property_test.go#TestProperty_TombstoneSync_NeverForgetsOverShortListings
      - internal/delete/delete_fuzz_test.go#FuzzTombstoneSync
      - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_DeleteAndUndeleteReachEveryPod
      - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_ShortListingNeverDropsOrDeletes
      - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_DeleteAndUndeleteReachEveryPod
      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_ShortListingNeverDropsOrDeletes
      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
  notes: "Two writers and two selects over one bucket: a delete created through one select pod's API is enforced on the other select pod and on both writers after one poll interval (measured about 0.4 s with a 1 s interval), and an un-delete of a hide delete the same. Compaction copies the rows forward unchanged and they stay hidden. This row is the end-to-end expectation the runner will execute; the unit and multi-instance tests are the executed lock."

- id: lh.delete.pod_clocks_only
  title: "Key times are pod clocks only (no store clock): a definition key takes the upstream task id's nanosecond timestamp when the id is one, so a duplicate id lands on the same key, and the creating pod's clock otherwise; a key older than the poll window is learned at the full listing and counted (learned late, skew gauge, alert), never before it"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: pass
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/deletion-strategy.md
    tests:
      - internal/delete/keys_test.go#TestIDTime
      - internal/delete/multiinstance_test.go#TestMI_KeyTimeIsThePodsClockOrTheTaskID
      - internal/delete/tombstone_sync_test.go#TestTombstoneSync_KeyOutsidePollWindow_LearnedAtFullListingOnly
      - internal/delete/tombstone_sync_test.go#TestTombstoneSync_OnTimeKeyIsNotLate
      - internal/delete/tombstone_sync_test.go#TestTombstoneSync_FailedFirstListing_SweepsAndCollectsNothing
  notes: "A creator whose clock is more than the ten-minute poll window behind a polling pod publishes a key that pod's polls skip; the hourly full listing finds it (at most 60 polls late). lakehouse_delete_tombstones_learned_late_total, lakehouse_delete_tombstone_key_skew_seconds and the LakehouseTombstoneClockSkew alert make the delay visible."

