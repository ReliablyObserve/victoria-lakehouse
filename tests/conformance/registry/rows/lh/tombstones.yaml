- id: lh.delete.physical_removal_not_enabled
  title: "Delete modes permanent and auto hide the rows at query time like hide; the stored objects are not rewritten and compaction copies the rows forward (hidden by the tombstone) until physical removal ships (D1b, issue 627)"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: differ
  differ_note: "Interim gap of this release (issue https://github.com/ReliablyObserve/victoria-lakehouse/issues/627). Upstream deletes the matching rows from its parts. Lakehouse hides them at query time on every pod, for as long as the tombstone lives (until the data is past retention); the bytes stay in the bucket, a permanent or auto delete cannot be undone (409), and the metadata-only fast paths (count, field and hits answered from the manifest) are off for the files a tombstone can match (since #624) while it lives. Physical removal (rewrites, the applied set in the footer) is the next change."
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  pending: true
  refs:
    doc: docs/deletion-strategy.md
    tests:
      - cmd/lakehouse-logs/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
      - lakehouse-traces/tombstone_multiinstance_test.go#TestTombstones_MultiInstance_CompactionKeepsDeletedRowsHidden
