- id: lh.delete.range_semantics_late_rows
  title: "A delete hides the rows ingested AFTER it whose _time is inside its range, for as long as the tombstone lives (until the data is past retention); upstream deletes only the rows present when the task is processed"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: differ
  differ_note: "Approved difference. Upstream VictoriaLogs/VictoriaTraces processes a delete task once, in the partitions that exist then, and rows that arrive later with a _time in the range are kept. Lakehouse evaluates a tombstone as a property of the data (tenants x _time range x filter), never of an object's age, because a per-row ingest time would be a Lakehouse-only field in the rows, which VictoriaLogs and VictoriaTraces do not write; so a writer that flushes rows hours late cannot bring deleted data back. Visible only for late-arriving rows."
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/parity-and-gaps.md
    tests:
      - internal/delete/multiinstance_test.go#TestMI_TombstoneOutlivesALateFlush

- id: lh.delete.undeleted_id_not_reusable
  title: "An id whose delete was un-deleted cannot be registered again until its keys expire with the data's retention; upstream has no un-delete and so no such rule"
  surface: lh
  kind: flag
  origin: lh-addition
  expect: differ
  differ_note: "Approved difference, a consequence of the write-once keys. The un-delete of a hide delete is an .undo key next to the definition; both are kept until the data is past retention (the record of a delete outlives its effect), so a late fan-out run_task with the same id meets the existing definition instead of silently re-hiding rows. Upstream deletes physically and keeps no registry of finished tasks, so a task id can be reused there."
  targets: [cold]
  compare: { type: golden }
  layers: [api]
  refs:
    doc: docs/parity-and-gaps.md
    tests:
      - internal/delete/protocol_test.go#TestUndelete_AnUndoneIdIsNotReusable
      - internal/delete/protocol_test.go#TestUndo_NamesOnlyItsOwnDefinition

- id: lh.delete.permanent_undelete_refused
  title: "Un-deleting a permanent or auto delete (a mode only taken when asked for: delete.default_mode defaults to hide) answers 409 and writes nothing; upstream has no un-delete at all (its delete is physical and final)"
  surface: lh
  kind: admin
  origin: lh-addition
  expect: pass
  targets: [cold]
  seed: [logs.base]
  request: { method: DELETE, path: "/delete/logsql/tombstone/{{tombstone_id}}" }
