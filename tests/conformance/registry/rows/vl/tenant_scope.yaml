# Tenant read scoping on the VL select surface, for both tenant layouts.
#
# Rule (upstream VL): a select request is answered from EXACTLY ONE tenant —
# the tenant in its AccountID/ProjectID headers, or 0:0 when there are none.
# Lakehouse widens a read to every tenant only for a request that presents the
# configured global-read credential ({{tenant.global_read}} is that header's
# value). Each endpoint × request shape is declared for both layouts:
#   prefix — tenants share one bucket under {AccountID}/{ProjectID}/
#   bucket — the tenant has a dedicated bucket via an s3.bucket override
# Bucket-layout and global-read rows target cold only: hot VL has neither.
# Semantics and the legacy (untenanted) layout: docs/multi-tenancy.md.

- id: vl.select.query.tenant_scope.default.prefix
  title: "/select/logsql/query — no tenant headers → the default tenant 0:0 only (prefix layout)"
  surface: vl
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold]
  seed: [tenants.iso]
  upstream: { route: /select/logsql/query }
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}", limit: "1000" } }
  compare: { type: ndjson-multiset }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go] }
  notes: "Without AccountID/ProjectID headers VL scopes the read to tenant 0:0; the cold tier must answer with tenant 0:0's data only (plus legacy untenanted objects, which belong to 0:0). Layout: tenants share one bucket under {AccountID}/{ProjectID}/."

- id: vl.select.query.tenant_scope.default.bucket
  title: "/select/logsql/query — no tenant headers → the default tenant 0:0 only (bucket layout)"
  surface: vl
  kind: select
  origin: native
  expect: pass
  targets: [cold]
  seed: [tenants.iso]
  upstream: { route: /select/logsql/query }
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}", limit: "1000" } }
  compare: { type: ndjson-multiset }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go] }
  notes: "Without AccountID/ProjectID headers VL scopes the read to tenant 0:0; the cold tier must answer with tenant 0:0's data only (plus legacy untenanted objects, which belong to 0:0). Layout: the tenant's objects live in a dedicated bucket (s3.bucket override); the request must not reach any other tenant's bucket."

