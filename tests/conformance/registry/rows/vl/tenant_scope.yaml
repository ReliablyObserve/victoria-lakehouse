  compare: { type: ndjson-multiset }
  layers: [api]
  pending: true
  refs: { doc: docs/multi-tenancy.md, tests: [internal/storage/parquets3/tenant_scope_test.go, tests/e2e/multitenancy_test.go, tests/parity/tenant_scope_parity_test.go] }
