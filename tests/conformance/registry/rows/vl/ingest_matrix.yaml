# Ingest parity matrix rows for VictoriaLogs: one row per protocol x tenant form.
#
# Each row is executed in CI by tests/e2e/ingest_matrix_test.go (TestIngestMatrix_Logs):
# the same payload goes to hot VictoriaLogs and to lakehouse-logs, the ingest answers (status and body)
# are compared, the rows are read back from the unflushed buffer and again after the
# flush to Parquet and must equal the hot rows field for field, and the ingest counters
# must move. The case table lives in tests/ingestmatrix; the drift gate
# tests/conformance/ingest_matrix_test.go ties it to the vendored upstream routes and flags.

- { id: vl.ingest.jsonline.numeric, title: "/insert/jsonline: newline-delimited JSON [numeric tenant]", surface: vl, kind: insert, origin: native, expect: differ, differ_note: "Known divergence from hot, tracked: after the flush Lakehouse adds severity_number=\"0\" to rows VictoriaLogs stores without it (https://github.com/ReliablyObserve/victoria-lakehouse/issues/274). The matrix compares every other field exactly and fails when the divergence goes away (docs/ingest-parity.md#known-gaps).", targets: [hot, cold], seed: [logs.base], upstream: { route: /insert/jsonline }, request: { method: POST, path: /insert/jsonline }, compare: { type: count }, layers: [api], refs: { doc: docs/ingest-parity.md, tests: [tests/e2e/ingest_matrix_test.go#TestIngestMatrix_Logs] }, notes: "AccountID/ProjectID headers" }
