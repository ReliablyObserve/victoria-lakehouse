- id: vl.select.field_values.limit
  title: "/select/logsql/field_values — limit keeps top hits"
  surface: vl
  kind: select
  origin: native
  expect: differ
  differ_note: "LH truncates in map order; hot returns top-hits sorted (docs/parity-and-gaps.md #A6). Flips to pass in the MergeValuesWithHits fix."
  targets: [hot, cold]
  seed: [logs.base]
  upstream: { route: /select/logsql/field_values }
  request: { method: GET, path: /select/logsql/field_values, params: { query: "*", field: service.name, limit: "3", start: "{{seed.start}}", end: "{{seed.cold_end}}" } }
  compare: { type: values-with-hits, options: { hits_tolerance: "0" } }
  layers: [api]
  pending: true

