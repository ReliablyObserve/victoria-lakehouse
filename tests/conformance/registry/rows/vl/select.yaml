# VL /select/* endpoints (surface vl), pinned VL v1.52.0.
# Canonical requests use the seed vocabulary: services api-gateway, checkout,
# payments, inventory, notifications; tenant {{tenant.account}}/{{tenant.project}};
# window {{seed.start}}..{{seed.cold_end}}. See docs/parity-and-gaps.md for divergences.
#
# Placeholder vocabulary (all rows, not just this file):
#   {{seed.start}} / {{seed.cold_end}}       — RFC3339 timestamps, the default
#                                               time-window form most endpoints accept.
#   {{seed.start_ms}} / {{seed.cold_end_ms}} — the same window as raw millisecond-epoch
#                                               integers, for endpoints/params that parse
#                                               that form (e.g. the LH shim's start/end
#                                               in lh.shim.time_params_ms; VT's
#                                               dependencies endTs param, which
#                                               strconv.ParseInt + time.UnixMilli's).
#   {{seed.start_us}} / {{seed.cold_end_us}} — the same window as raw microsecond-epoch
#                                               integers, for VT's Jaeger traces search
#                                               start/end params, which
#                                               strconv.ParseInt + time.UnixMicro's them
#                                               (see app/vtselect/traces/jaeger/jaeger.go).
#   {{seed.trace_id}} / {{seed.stream_id}}   — fixed-length hex ids from the seeded dataset.
#   {{seed.task_id}}                          — a delete-task id from the seeded dataset,
#                                               used by the /internal/delete/* and
#                                               /delete/run_task-style rows.
#   {{tenant.account}} / {{tenant.project}}  — the seeded tenant pair.
#   {{tenant.global_read}}                    — the value of the configured global-read
#                                               header (X-Lakehouse-Global-Read) on the
#                                               cold stack under test; only the
#                                               tenant_scope.global rows send it.
#   {{tombstone_id}}                          — not part of the seed: the id returned by a
#                                               prior delete request in the same run (see
#                                               lh.delete.tombstone_by_id.status).
#   {{proto.internal_select}} / {{proto.internal_delete}} — not part of the seed: the
#                                               protocol version constant the runner reads
#                                               from the vendored VL (internalselect's
#                                               ProtocolVersion consts in
#                                               app/vlstorage/netselect/netselect.go, e.g.
#                                               QueryProtocolVersion, FieldNamesProtocolVersion,
#                                               DeleteRunTaskProtocolVersion, ...). Every
#                                               /internal/select/* and /internal/delete/*
#                                               request (except /internal/select/tenant_ids,
#                                               which does not check it) is rejected with
#                                               a version mismatch error unless it sends
#                                               version=<the exact expected constant> — see
#                                               checkProtocolVersion in
#                                               app/vlselect/internalselect/internalselect.go.
#
#                                               These two resolve PER MODULE, from the
#                                               vendored VictoriaLogs tree of the binary the
#                                               row targets — never from a single global
#                                               value:
#                                                 surface vl  -> deps/VictoriaLogs
#                                                                (VL_VERSION_LOGS)
#                                                 surface vt  -> lakehouse-traces/deps/
#                                                                VictoriaLogs
#                                                                (VL_COMMIT_TRACES)
#                                               lakehouse-traces mounts VictoriaLogs'
#                                               internalselect package for these endpoints
#                                               (lakehouse-traces/main.go), so the traces
#                                               surface follows the traces VL pin, not
#                                               VictoriaTraces and not the logs pin. The two
#                                               pins are deliberately allowed to differ and
#                                               today they do: at VL v1.52.0 / VL v1.51.0 the
#                                               select version is v5 on both, while delete is
#                                               v2 on the logs pin and v1 on the traces pin.
#                                               The resolved pairs are recorded per module
#                                               under `protocol:` in
#                                               tests/conformance/inventory.generated.yaml,
#                                               so an upstream bump that moves either one
#                                               shows up as drift.

- id: vl.select.query.wildcard
  title: "/select/logsql/query — wildcard retrieval"
  surface: vl
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold, global]
  seed: [logs.base]
  upstream: { route: /select/logsql/query }
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}", limit: "1000" }, headers: { AccountID: "{{tenant.account}}", ProjectID: "{{tenant.project}}" } }
  compare: { type: ndjson-multiset, project: [_time, _msg, _stream, level, service.name] }
  layers: [api]
  pending: true
  refs: { doc: docs/parity-and-gaps.md }

