# VL /select/* endpoints (surface vl), pinned VL v1.50.0.
# Canonical requests use the seed vocabulary: services api-gateway, checkout,
# payments, inventory, notifications; tenant {{tenant.account}}/{{tenant.project}};
# window {{seed.start}}..{{seed.cold_end}}. See docs/parity-and-gaps.md for divergences.

- id: vl.select.query.wildcard
  title: "/select/logsql/query — wildcard retrieval"
  surface: vl
  kind: select
  origin: native
  expect: pass
  targets: [hot, cold, global]
  seed: [logs.base]
  upstream: { route: /select/logsql/query }
  request: { method: GET, path: /select/logsql/query, params: { query: "*", start: "{{seed.start}}", end: "{{seed.cold_end}}", limit: "1000" }, headers: { AccountID: "{{tenant.account}}", ProjectID: "{{tenant.project}}" } }
  compare: { type: ndjson-multiset, project: [_time, _msg, _stream, level, service.name] }
  layers: [api]
  pending: true
  refs: { doc: docs/parity-and-gaps.md }

