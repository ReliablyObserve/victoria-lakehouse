# tests/parity/docker-compose.yml
#
# Fully internal — no host port mappings. Parity tests run inside the
# parity-net network via the `parity-tests` service, which addresses
# all services by container DNS name.
#
# Local debugging: to expose a port temporarily, run e.g.
#   docker compose port victorialogs 9428
# or override with tests/parity/docker-compose.override.yml.
name: parity

networks:
  parity-net:
    driver: bridge

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    networks: [parity-net]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    networks: [parity-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/parity-bucket --ignore-existing &&
      echo 'MinIO bucket ready'
      "

  victorialogs:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.upstream-probe
      args:
        UPSTREAM: victoriametrics/victoria-logs:v1.52.0
    # Upstream image + one static busybox so the healthcheck below has a probe
    # to run: the published image is distroless (no shell, no wget). See
    # deployment/docker/Dockerfile.upstream-probe.
    image: vl-probed:v1.52.0
    restart: unless-stopped
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=48h"
      - "-loggerLevel=INFO"
    networks: [parity-net]
    volumes:
      - vl-data:/data
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:9428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  lakehouse-logs:
    build:
      context: ../../
      dockerfile: Dockerfile.logs
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [parity-net]
    command:
      - "-lakehouse.s3.bucket=parity-bucket"
      - "-lakehouse.s3.endpoint=http://minio:9000"
      - "-lakehouse.s3.access-key=minioadmin"
      - "-lakehouse.s3.secret-key=minioadmin"
      - "-lakehouse.s3.force-path-style=true"
      - "-lakehouse.manifest.refresh-interval=5s"
      - "-lakehouse.insert.flush-interval=5s"
      - "-lakehouse.compaction.interval=15s"
      - "-lakehouse.query.file-workers=64"
      - "-lakehouse.cache.memory-mb=256"
      - "-loggerLevel=INFO"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lakehouse-logs", "healthcheck", "http://localhost:9428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  victoriatraces:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.upstream-probe
      args:
        UPSTREAM: victoriametrics/victoria-traces:v0.11.0
    # Upstream image + one static busybox so the healthcheck below has a probe
    # to run: the published image is distroless (no shell, no wget). See
    # deployment/docker/Dockerfile.upstream-probe.
    image: vt-probed:v0.11.0
    command:
      - "-storageDataPath=/data"
      - "-retentionPeriod=48h"
      - "-loggerLevel=INFO"
      # Service-graph parity needs the upstream background task running on
      # BOTH tiers — without it hot never emits edges and every
      # service-graph test either times out or skips.
      #
      # taskInterval is the tick period AND the truncation unit for the
      # window end; upstream enforces no minimum, so 30s is picked to get
      # the first tick (and therefore the first edges) well inside the
      # suite's budget.
      #
      # taskLookbehind must cover the whole seeded window: datagen writes
      # spans at now - rand[1..hours-back]h, so a default 1m lookbehind
      # sees no spans at all and the join produces nothing.
      - "-servicegraph.enableTask=true"
      - "-servicegraph.taskInterval=30s"
      - "-servicegraph.taskLookbehind=25h"
      - "-servicegraph.taskTimeout=25s"
    networks: [parity-net]
    volumes:
      - vt-data:/data
    healthcheck:
      test: ["CMD", "/probe/busybox", "wget", "-qO-", "http://127.0.0.1:10428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  lakehouse-traces:
    build:
      context: ../../
      dockerfile: Dockerfile.traces
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks: [parity-net]
    command:
      - "-lakehouse.s3.bucket=parity-bucket"
      - "-lakehouse.s3.endpoint=http://minio:9000"
      - "-lakehouse.s3.access-key=minioadmin"
      - "-lakehouse.s3.secret-key=minioadmin"
      - "-lakehouse.s3.force-path-style=true"
      - "-lakehouse.manifest.refresh-interval=5s"
      - "-lakehouse.insert.flush-interval=5s"
      - "-lakehouse.compaction.interval=15s"
      - "-lakehouse.query.file-workers=64"
      - "-lakehouse.cache.memory-mb=256"
      # Same task as hot VT (see victoriatraces above). The cold tier runs
      # the aggregation over Parquet on S3, so it gets a longer tick and a
      # timeout that still fits inside one interval.
      - "-servicegraph.enableTask=true"
      - "-servicegraph.taskInterval=1m"
      - "-servicegraph.taskLookbehind=25h"
      - "-servicegraph.taskTimeout=55s"
      - "-loggerLevel=INFO"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lakehouse-traces", "healthcheck", "http://localhost:10428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  datagen-seed:
    build:
      context: ../../
      dockerfile: Dockerfile.datagen
    depends_on:
      victorialogs:
        condition: service_healthy
      victoriatraces:
        condition: service_healthy
      lakehouse-logs:
        condition: service_healthy
      lakehouse-traces:
        condition: service_healthy
    networks: [parity-net]
    command:
      - "--logs=10000"
      - "--traces=2000"
      - "--hours-back=24"
      - "--vl-endpoint=http://victorialogs:9428"
      - "--vt-endpoint=http://victoriatraces:10428"
      - "--lh-logs-endpoint=http://lakehouse-logs:9428"
      - "--lh-traces-endpoint=http://lakehouse-traces:10428"

  # Second tenant, traces only. tenant_scope_parity_test.go needs at least
  # two tenants in the manifest; with a single seeded tenant all four of its
  # tests skip and tenant isolation goes untested. Runs after datagen-seed so
  # the two tenants' files land in separate manifest partitions rather than
  # racing for the same flush.
  datagen-seed-tenant2:
    build:
      context: ../../
      dockerfile: Dockerfile.datagen
    depends_on:
      datagen-seed:
        condition: service_completed_successfully
    networks: [parity-net]
    command:
      # Traces only. The tenant-scope tests all query lakehouse-traces, and
      # leaving the logs corpus untouched keeps every logs comparison in
      # this suite counting exactly the rows datagen-seed wrote.
      - "--logs=0"
      - "--traces=600"
      - "--hours-back=24"
      - "--account-id=1"
      - "--project-id=0"
      - "--vt-endpoint=http://victoriatraces:10428"
      - "--lh-traces-endpoint=http://lakehouse-traces:10428"

  parity-tests:
    image: golang:1.26.8
    profiles: ["test"]
    depends_on:
      datagen-seed:
        condition: service_completed_successfully
      datagen-seed-tenant2:
        condition: service_completed_successfully
    networks: [parity-net]
    working_dir: /app/tests/parity
    volumes:
      - ../../:/app
      - go-cache:/go
    environment:
      VL_BASE_URL: http://victorialogs:9428
      LH_BASE_URL: http://lakehouse-logs:9428
      VT_BASE_URL: http://victoriatraces:10428
      LHT_BASE_URL: http://lakehouse-traces:10428
      GOWORK: "off"
      GOFLAGS: "-mod=mod"
    command: ["go", "test", "-tags=parity", "-v", "-count=1", "-timeout=10m", "./..."]

volumes:
  vl-data: {}
  vt-data: {}
  go-cache: {}
