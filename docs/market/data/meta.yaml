title: Victoria Lakehouse and the log and trace storage market
icons:
  ✅: yes / strong
  🟡: partial / limited / beta / paid tier only
  ❌: 'no'
  ❓: unknown (not found in sources)
  🧪: experimental / preview / prototype
  🔒: enterprise / paid only
  📐: designed or planned (LH)
  🐞: shipped but known-broken (LH, with issue number)
labels:
  docs: the system's own documentation or source code
  vendor: a vendor marketing figure, not independently checked
  measured: our own measurement
  repo: 'this repository: code, tests, CI and issues'
  unverified: prior knowledge, not re-checked against a source
stale_after_days: 120
sections:
- Interfaces
- Ingest
- Storage
- Read
- Durability
- Scalability
- Ops
dimensions:
- id: if_write_n
  section: Interfaces
  label: Write protocols (n)
  counting_rule: 'Distinct ingest protocol families accepted by the product''s own server endpoints, from its own
    docs: OTLP, Loki push, ES bulk, Splunk HEC, Datadog, syslog, journald, Jaeger, Zipkin, Prometheus RW, Influx
    LP, SQL-wire INSERT, own/native API, and each built-in queue or stream consumer (Kafka, Kinesis, Pulsar, SQS).
    External collectors, agents and separately deployed components do not count. Transports of one protocol (HTTP
    vs gRPC, JSON vs protobuf) count once. Unconfirmed protocols are excluded and named.'
- id: if_read_n
  section: Interfaces
  label: Read APIs (n)
  counting_rule: 'Distinct query APIs served natively over the network: the product''s own query API/language counts
    once, each compatible ecosystem API (Loki, Tempo/TraceQL, Jaeger, Zipkin, ES search, Prometheus, SQL wire or
    Flight SQL) counts once. APIs needing a separately deployed component are shown as (+n via ...). UIs and Grafana
    datasources are not counted.'
- id: if_files_n
  section: Interfaces
  label: External engines reading stored files (n of 7)
  counting_rule: 'Of the fixed list DuckDB, ClickHouse, Spark, Trino, Athena, pyarrow, Polars: how many the vendor
    names in its docs (or proves in CI) as reading the stored files in place while the system serves them, with
    no export step. A generic ''any Parquet tool'' claim counts as 0 named. Export copies and archives are marked
    separately. For LH the count is split into verified (CI or benchmark) and claimed (documented or expected).'
