name: Victoria Lakehouse (LH)
group: Victoria Lakehouse
reviewed: '2026-10-02'
cells:
  if_write_n:
    icon: ✅
    text: 9, the same set as VL + VT (2 proven in CI)
    note: 'Lakehouse mounts the upstream handlers unchanged: cmd/lakehouse-logs/main.go calls vlinsert.Init and
      routes /insert/* to vlinsert.RequestHandler; lakehouse-traces/main.go does the same with vtinsert. Protocol
      families: jsonline, VL native, Loki push (JSON and protobuf), Elasticsearch _bulk, Splunk HEC, Datadog logs
      v2, journald, OTLP over HTTP (logs and traces; traces also over gRPC with -otlpGRPCListenAddr) and syslog
      over TCP/UDP (-syslog.listenAddr.*, off by default as in upstream). Proof today: jsonline and OTLP traces
      run in CI e2e; Loki JSON, ES, Datadog, journald and Splunk passed a manual ingest and readback check in May
      2026; syslog and OTLP gRPC have no test yet. A CI matrix for every protocol on both binaries is planned. Zipkin
      and Jaeger-protocol ingest are not offered by VictoriaTraces either.'
    source: cmd/lakehouse-logs/main.go (vlinsert.Init); lakehouse-traces/main.go (vtinsert.Init); tests/verification/matrix.md
    label: repo
    checked: '2026-10-02'
  if_read_n:
    icon: ✅
    text: 3 native (+1 via proxy)
    note: LogsQL HTTP API (VL), Jaeger query API (VT handlers), Tempo HTTP API with the VT TraceQL subset. Loki
      API only through loki-vl-proxy, a separate component in a separate repo. Plus VMUI/VTUI and the ClickHouse
      datasource over the same files.
    source: github.com/ReliablyObserve/victoria-lakehouse README.md; docs/parity-and-gaps.md
    label: repo
    checked: '2026-10-02'
  if_files_n:
    icon: ✅
    text: 6 verified / 1 claimed
    note: 'DuckDB, ClickHouse, Spark, Trino, pyarrow and Polars each run the documented example against real
      Lakehouse files in CI (parquet-readers workflow: logs and traces, three tenants, raw and compacted files,
      partition pruning), compared with Lakehouse''s own answers. Three of the six have open issues: ClickHouse
      fails trace-ID lookups unless bloom push down is off (#341), Trino reads tenant IDs of 2^31 and above as
      negative (#342), Polars refuses files whose footer metadata is not UTF-8 (#340). Athena is documented
      only (Trino dialect, not run).'
    source: github.com/ReliablyObserve/victoria-lakehouse docs/open-parquet-format.md (reader coverage table); .github/workflows/parquet-readers.yaml
    label: repo
    checked: '2026-10-02'
