groups:
  - name: lakehouse
    rules:
      - alert: LakehouseHighErrorRate
        expr: |
          sum(rate(lakehouse_http_errors_total[5m]))
          / sum(rate(lakehouse_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse HTTP error rate above 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: LakehouseS3CircuitBreakerOpen
        expr: lakehouse_s3_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse S3 circuit breaker is open"
          description: "S3 requests are being rejected. Check S3 availability and throttling."

      - alert: LakehouseHotBoundaryGap
        expr: lakehouse_discovery_hot_boundary_gap_days > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gap between cold and hot data exceeds 1 day"
          description: "Hot boundary gap is {{ $value }} days. Data may be missing between hot and cold tiers."

      - alert: LakehouseCacheDiskFull
        expr: |
          lakehouse_cache_disk_bytes
          / lakehouse_cache_disk_bytes_limit
          > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse L2 disk cache above 95%"
          description: "Disk cache is {{ $value | humanizePercentage }} full. Consider increasing disk or lowering eviction watermark."

      - alert: LakehouseNotReady
        expr: lakehouse_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse not ready for over 5 minutes"
          description: "Instance is still in startup phase {{ $labels.phase }}. Check S3 connectivity and manifest refresh."

      - alert: LakehouseSlowQueries
        expr: rate(lakehouse_slow_queries_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained slow queries on Lakehouse"
          description: "Slow query rate is {{ $value }}/s over 10 minutes. Check S3 latency and cache hit rates."

      - alert: LakehouseManifestStale
        expr: |
          time() - lakehouse_manifest_last_refresh_timestamp_seconds > 7200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse manifest not refreshed in over 2 hours"
          description: "Manifest may be stale. New S3 files won't be queryable. Check S3 ListObjects permissions."

      - alert: LakehouseDiscoveryFailed
        expr: lakehouse_peer_ring_members == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No peers discovered in Lakehouse fleet"
          description: "Peer ring is empty for 10 minutes. Check headless service DNS resolution."

      - alert: LakehouseS3ThrottleSustained
        expr: rate(lakehouse_s3_throttle_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained S3 throttling on Lakehouse"
          description: "S3 throttle rate is {{ $value }}/s. Consider reducing concurrency or requesting S3 rate increase."

      - alert: LakehousePeerDown
        expr: |
          rate(lakehouse_peer_errors_total[5m])
          / (rate(lakehouse_peer_requests_total[5m]) + 1)
          > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High peer cache error rate"
          description: "Peer cache error rate is {{ $value | humanizePercentage }}. Check network connectivity between pods."

  - name: lakehouse-deletes
    rules:
      - alert: LakehouseTombstoneS3Backlog
        expr: lakehouse_delete_tombstone_persist_pending > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tombstone records are not reaching S3"
          description: "{{ $value }} tombstone record(s) exist only on the local disk. They survive a restart on this node but not a pod move or volume loss. Check S3 write permissions for the _tombstones/ prefix."

      - alert: LakehouseTombstonePersistenceDisabled
        expr: increase(lakehouse_delete_startup_inconsistencies_total{kind="persistence_disabled"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tombstones have no durable target"
          description: "The delete self-check found write-through persistence disabled. Every delete on this instance is lost on an ungraceful restart."

      - alert: LakehouseDeleteRewriteManifestErrors
        expr: increase(lakehouse_delete_rewrite_manifest_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites are failing to publish into the manifest"
          description: "{{ $value }} rewrite(s) could not be published in 15 minutes. The superseded files are kept and the rewrites retry, so no rows are lost, but deletes are not completing."

      - alert: LakehouseDeleteRewriteRefusedNoManifest
        expr: increase(lakehouse_delete_rewrite_skipped_no_manifest_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites refused: no manifest wired into the scheduler"
          description: "Permanent and auto deletes stay hidden at query time but are never physically removed. This is a deployment wiring problem."

      - alert: LakehouseDeleteStateInconsistent
        expr: sum by (kind) (increase(lakehouse_delete_startup_inconsistencies_total{kind!="persistence_disabled"}[1h])) > 0
        labels:
          severity: info
        annotations:
          summary: "Tombstones and manifest disagreed at startup ({{ $labels.kind }})"
          description: "The delete self-check found restored tombstones and the restored manifest describing different moments. The rewrite scheduler converges these; alert only if it recurs on every boot."

      - alert: LakehouseCompactionPublishConflicts
        expr: rate(lakehouse_compaction_publish_conflicts_total[30m]) > 0.01
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Compactions repeatedly abandoned at publish"
          description: "Compaction keeps finding its sources replaced mid-merge ({{ $value }}/s). Occasional conflicts with delete rewrites are expected; a sustained rate means two writers own the same partitions."

      - alert: LakehouseSupersededObjectDeletesFailing
        expr: (increase(lakehouse_manifest_retired_reclaim_errors_total[1h]) + increase(lakehouse_delete_rewrite_old_object_errors_total[1h]) + increase(lakehouse_delete_rewrite_abandoned_object_errors_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Objects replaced by a rewrite or compaction are not being deleted"
          description: "Deletes of superseded or abandoned Parquet objects have kept failing for an hour. They stay out of the manifest, so no row is served twice, but they occupy storage, keep their tombstones active, and are forgotten by the manifest after 7 days — after which a refresh would serve them again. Check S3 delete permissions."

      - alert: LakehouseManifestRetiredKeyEvicted
        expr: increase(lakehouse_manifest_retired_evicted_total{reason!="ttl"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The manifest forgot a retired key before its object was deleted"
          description: "{{ $value }} retired key(s) reached the size bound. If their objects still exist, the next manifest refresh serves their rows again next to the files that replaced them. List what is outstanding on the instance with GET /delete/logsql/leftovers (traces: /delete/tracessql/leftovers), then delete those objects or fix why their deletes never succeeded."

      - alert: LakehouseManifestRetiredKeyEvictedWithDeleteOwed
        expr: increase(lakehouse_manifest_retired_evicted_total{reason="cap_delete_owed"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The manifest forgot a key whose object it still owed a delete for"
          description: "{{ $value }} key(s) this instance superseded were dropped from the retired set while their objects were still in the bucket. The next refresh adopts them: their rows are served next to the files that replaced them, and rows a delete removed come back. List them with GET /delete/logsql/leftovers and delete the objects by hand. lakehouse_manifest_retired_delete_owed shows how close the set is to its bound."

      - alert: LakehouseTombstoneRestoreFailed
        expr: increase(lakehouse_delete_startup_inconsistencies_total{kind="s3_restore_failed"}[1h]) > 0 and on() lakehouse_delete_tombstone_restore_pending > 0
        labels:
          severity: critical
        annotations:
          summary: "The tombstone store could not be read from S3"
          description: "This instance started without the S3 copy of the tombstone store. Deletes made on other nodes are NOT enforced here (their rows are visible in queries), and every interrupted rewrite stays unresolved until the read succeeds. It is retried every minute; check S3 read permissions for the _tombstones/ prefix. GET /delete/logsql/leftovers reports s3_restore_pending and what is outstanding."

      - alert: LakehouseTombstoneRecordNotDurable
        expr: increase(lakehouse_delete_tombstone_not_durable_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites are held: their records are not reaching durable storage"
          description: "{{ $value }} tombstone change(s) could not be confirmed durable in 30 minutes, so no rewrite deleted the object it superseded (nothing is lost — the rewrites wait). lakehouse_delete_rewrite_deferred_total{reason=\"not_durable\"} counts the deferrals and lakehouse_delete_tombstone_persist_pending the backlog; check S3 write permissions for the _tombstones/ prefix."

      - alert: LakehouseDeleteRewritesUnfinished
        expr: lakehouse_delete_rewrites_unfinished > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites have been unfinished for hours"
          description: "{{ $value }} rewrite record(s) are still open: a replacement is uploaded or published but its superseded object has not been deleted. GET /delete/logsql/leftovers lists them with their state. Drain these to zero before rolling back to a release before v0.10.x — an older binary drops the records and nothing would finish them (see docs/operations.md → Rolling back)."
