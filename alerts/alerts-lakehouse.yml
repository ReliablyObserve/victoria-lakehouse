groups:
  - name: lakehouse
    rules:
      - alert: LakehouseHighErrorRate
        expr: |
          sum(rate(lakehouse_http_errors_total[5m]))
          / sum(rate(lakehouse_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse HTTP error rate above 5%"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: LakehouseS3CircuitBreakerOpen
        expr: lakehouse_s3_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse S3 circuit breaker is open"
          description: "S3 requests are being rejected. Check S3 availability and throttling."

      - alert: LakehouseHotBoundaryGap
        expr: lakehouse_discovery_hot_boundary_gap_days > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gap between cold and hot data exceeds 1 day"
          description: "Hot boundary gap is {{ $value }} days. Data may be missing between hot and cold tiers."

      - alert: LakehouseCacheDiskFull
        expr: |
          lakehouse_cache_disk_bytes
          / lakehouse_cache_disk_bytes_limit
          > 0.95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse L2 disk cache above 95%"
          description: "Disk cache is {{ $value | humanizePercentage }} full. Consider increasing disk or lowering eviction watermark."

      - alert: LakehouseNotReady
        expr: lakehouse_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse not ready for over 5 minutes"
          description: "Instance is still in startup phase {{ $labels.phase }}. Check S3 connectivity and manifest refresh."

      - alert: LakehouseSlowQueries
        expr: rate(lakehouse_slow_queries_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sustained slow queries on Lakehouse"
          description: "Slow query rate is {{ $value }}/s over 10 minutes. Check S3 latency and cache hit rates."

      - alert: LakehouseManifestStale
        expr: |
          lakehouse_manifest_last_refresh_timestamp_seconds > 0
            and time() - lakehouse_manifest_last_refresh_timestamp_seconds > 7200
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse manifest not refreshed in over 2 hours"
          description: "Manifest may be stale. New S3 files won't be queryable. Check S3 ListObjects permissions."

      - alert: LakehouseManifestNoCompleteRefresh
        # Measured from the end of the last complete listing; before the first
        # one (the gauge is 0) from process start, with the same budget, so a
        # long first listing at startup does not fire it on its own.
        expr: |
          (
            lakehouse_manifest_last_complete_refresh_timestamp_seconds > 0
              and time() - lakehouse_manifest_last_complete_refresh_timestamp_seconds
                > clamp_min(4 * lakehouse_manifest_refresh_interval_seconds, 900)
          )
          or
          (
            lakehouse_manifest_last_complete_refresh_timestamp_seconds == 0
              and time() - process_start_time_seconds
                > clamp_min(4 * lakehouse_manifest_refresh_interval_seconds, 900)
          )
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Lakehouse manifest has not applied a complete bucket listing for over 4 refresh intervals"
          description: "Refreshes fail, are partial (a tenant's LIST fails) or are rejected (lakehouse_manifest_refresh_incomplete_total by reason). Until one completes, deletes are not completed (tombstones stay active), retired keys are not settled and restored insert-buffer segments stay held. Check S3 LIST errors and throttling for the tenants concerned."

      - alert: LakehouseDuplicateFileKeys
        expr: increase(lakehouse_duplicate_file_keys_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A file key was found tracked twice ({{ $labels.site }})"
          description: "An invariant check dropped or refused a duplicate file entry; without it the file's rows would have been served or merged twice. This is a defect: collect the log line 'key tracked twice' and report it."

      - alert: LakehouseDiscoveryFailed
        expr: lakehouse_peer_ring_members == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No peers discovered in Lakehouse fleet"
          description: "Peer ring is empty for 10 minutes. Check headless service DNS resolution."

      - alert: LakehouseS3ThrottleSustained
        expr: rate(lakehouse_s3_throttle_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sustained S3 throttling on Lakehouse"
          description: "S3 throttle rate is {{ $value }}/s. Consider reducing concurrency or requesting S3 rate increase."

      - alert: LakehousePeerDown
        expr: |
          rate(lakehouse_peer_errors_total[5m])
          / (rate(lakehouse_peer_requests_total[5m]) + 1)
          > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High peer cache error rate"
          description: "Peer cache error rate is {{ $value | humanizePercentage }}. Check network connectivity between pods."

      - alert: LakehouseTenantScopeViolation
        expr: sum by (site) (increase(lakehouse_tenant_scope_violations_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse dropped data that did not belong to the requesting tenant"
          description: "The read path at site {{ $labels.site }} selected {{ $value }} object(s) or buffered row(s) owned by another tenant in the last 5 minutes and dropped them before answering. This indicates a defect (manifest key-shape drift, a read path that bypassed tenant scoping, or an insert pod answering /internal/buffer/query without tenant scoping) — see docs/multi-tenancy.md#read-scoping-which-data-a-request-sees."

      - alert: LakehouseTenantBucketListFailing
        expr: sum by (bucket) (increase(lakehouse_manifest_tenant_bucket_list_errors_total[15m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Lakehouse cannot list a tenant's dedicated S3 bucket"
          description: "The manifest refresh failed to LIST {{ $labels.bucket }} {{ $value }} time(s) in the last 15 minutes. Every refresh fails while that bucket is unreachable, so the manifest keeps serving its previous state for ALL tenants and objects written since then stay invisible to queries. Check that the bucket exists, that the pod's credentials still reach it and that its policy grants s3:ListBucket — see docs/multi-tenancy.md#enterprise-bucket-per-tenant-isolation."

  - name: lakehouse-insert-buffer
    rules:
      - alert: LakehouseBufferNotDraining
        expr: lakehouse_buffer_oldest_pending_age_seconds > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An insert-buffer segment has waited more than 30 minutes to be written"
          description: "The oldest sealed segment on {{ $labels.instance }} has been waiting {{ $value | humanizeDuration }} (lakehouse_buffer_flush_errors_total by stage says why). Nothing is lost while it waits - it is on the pod's disk - but the buffer volume fills: size insert.buffer_dir for the outage (docs/sizing.md)."

      - alert: LakehouseBufferRestoredSegmentsHeld
        expr: lakehouse_buffer_oldest_held_age_seconds > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Insert-buffer segments restored at start are still held: no complete manifest refresh has finished"
          description: "{{ $labels.instance }} has held committed segment(s) restored at start (lakehouse_buffer_held_segments) for {{ $value | humanizeDuration }}. They are released by the first complete S3 manifest refresh; until then they stay on disk and their rows are served from the buffer, possibly duplicated if a peer compacted their objects meanwhile. Check the refresh: lakehouse_manifest_refresh_incomplete_total{reason=\"partial|rejected|head_unconfirmed\"} (partial = a tenant's project LIST failed, rejected = the listing dropped most files and a HEAD found live objects, head_unconfirmed = the HEAD check itself failed), lakehouse_manifest_refresh_cliff_guard_rejections_total, lakehouse_manifest_tenant_bucket_list_errors_total (only a dedicated tenant bucket's LIST), the 'manifest S3 refresh failed' and 'tenant-scoped refresh failed' log lines, and whether the full LIST finishes inside its 5-minute warm-up / 2-minute periodic timeout (docs/durability.md)."

      - alert: LakehouseInsertRefusedDiskFloor
        expr: sum by (instance) (increase(lakehouse_insert_rejected_total{reason="read_only"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Inserts are refused with 429: the insert buffer volume is below its free-space floor"
          description: "{{ $labels.instance }} answers 429 because insert.buffer_dir is almost full, as VictoriaLogs does. Check lakehouse_buffer_oldest_pending_age_seconds: if segments cannot be written to object storage the volume fills, otherwise grow the volume."

      - alert: LakehouseBufferBridgeAuthRefused
        expr: sum by (instance) (increase(lakehouse_buffer_bridge_errors_total{reason="auth"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Insert pods refuse this select pod's peer key: its queries miss their unflushed rows"
          description: "{{ $labels.instance }} had {{ $value }} buffer-bridge request(s) refused with 401/403 in the last 5 minutes, so those queries were answered without the insert pods' unflushed rows. peer.auth_key (or -lakehouse.peer.auth-key) differs between pods, or a global-read query reached pods without a key. Set the same key on every pod - see docs/security.md#internal-endpoints-and-the-peer-key."

      - alert: LakehouseBufferBridgeDisabled
        expr: sum by (instance) (increase(lakehouse_buffer_bridge_errors_total{reason="disabled"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Peers answer the buffer query with -internalselect.disable: queries miss their unflushed rows"
          description: "{{ $labels.instance }} had {{ $value }} buffer-bridge request(s) answered 'disabled' in the last 5 minutes. A pod runs with -internalselect.disable (on a role=all pod with peers that includes this pod itself), so those queries were answered without its unflushed rows. Unset the flag, or set select.buffer_query_enabled=false where the unflushed rows are not wanted - see docs/security.md."

  - name: lakehouse-deletes
    rules:
      - alert: LakehouseTombstoneS3Backlog
        expr: lakehouse_delete_tombstone_persist_pending > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tombstone records are not reaching S3"
          description: "{{ $value }} tombstone record(s) exist only on the local disk. They survive a restart on this node but not a pod move or volume loss. Check S3 write permissions for the _tombstones/ prefix."

      - alert: LakehouseTombstonePersistenceDisabled
        expr: increase(lakehouse_delete_startup_inconsistencies_total{kind="persistence_disabled"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Tombstones have no durable target"
          description: "The delete self-check found write-through persistence disabled. Every delete on this instance is lost on an ungraceful restart."

      - alert: LakehouseDeleteRewriteManifestErrors
        expr: increase(lakehouse_delete_rewrite_manifest_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites are failing to publish into the manifest"
          description: "{{ $value }} rewrite(s) could not be published in 15 minutes. The superseded files are kept and the rewrites retry, so no rows are lost, but deletes are not completing."

      - alert: LakehouseDeleteRewriteRefusedNoManifest
        expr: increase(lakehouse_delete_rewrite_skipped_no_manifest_total[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites refused: no manifest wired into the scheduler"
          description: "Permanent and auto deletes stay hidden at query time but are never physically removed. This is a deployment wiring problem."

      - alert: LakehouseDeleteTenantScopeViolation
        expr: sum by (site) (increase(lakehouse_delete_tenant_scope_skips_total[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "A tenant-scoped tombstone named another tenant's object ({{ $labels.site }})"
          description: "A tombstone record listed an object of a tenant it is not scoped to. The object was left untouched and recorded clean for that tombstone, so no rows were removed, but the record was written by a defect or edited by hand. Inspect it with GET /delete/logsql/tombstones (traces: /delete/tracessql/tombstones) using the global-read credential."

      - alert: LakehouseDeleteStateInconsistent
        expr: sum by (kind) (increase(lakehouse_delete_startup_inconsistencies_total{kind!="persistence_disabled"}[1h])) > 0
        labels:
          severity: info
        annotations:
          summary: "Tombstones and manifest disagreed at startup ({{ $labels.kind }})"
          description: "The delete self-check found restored tombstones and the restored manifest describing different moments. The rewrite scheduler converges these; alert only if it recurs on every boot."

      - alert: LakehouseCompactionPublishConflicts
        expr: rate(lakehouse_compaction_publish_conflicts_total[30m]) > 0.01
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Compactions repeatedly abandoned at publish"
          description: "Compaction keeps finding its sources replaced mid-merge ({{ $value }}/s). Occasional conflicts with delete rewrites are expected; a sustained rate means two writers own the same partitions."

      - alert: LakehouseSupersededObjectDeletesFailing
        expr: (increase(lakehouse_manifest_retired_reclaim_errors_total[1h]) + increase(lakehouse_delete_rewrite_old_object_errors_total[1h]) + increase(lakehouse_delete_rewrite_abandoned_object_errors_total[1h])) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Objects replaced by a rewrite or compaction are not being deleted"
          description: "Deletes of superseded or abandoned Parquet objects have kept failing for an hour. They stay out of the manifest, so no row is served twice, but they occupy storage, keep their tombstones active, and are forgotten by the manifest after 7 days — after which a refresh would serve them again. Check S3 delete permissions."

      - alert: LakehouseManifestRetiredKeyEvicted
        expr: increase(lakehouse_manifest_retired_evicted_total{reason!="ttl"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The manifest forgot a retired key before its object was deleted"
          description: "{{ $value }} retired key(s) reached the size bound. If their objects still exist, the next manifest refresh serves their rows again next to the files that replaced them. List what is outstanding on the instance with GET /delete/logsql/leftovers (traces: /delete/tracessql/leftovers), then delete those objects or fix why their deletes never succeeded."

      - alert: LakehouseManifestRetiredKeyEvictedWithDeleteOwed
        expr: increase(lakehouse_manifest_retired_evicted_total{reason="cap_delete_owed"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The manifest forgot a key whose object it still owed a delete for"
          description: "{{ $value }} key(s) this instance superseded were dropped from the retired set while their objects were still in the bucket. The next refresh adopts them: their rows are served next to the files that replaced them, and rows a delete removed come back. List them with GET /delete/logsql/leftovers and delete the objects by hand. lakehouse_manifest_retired_delete_owed shows how close the set is to its bound."

      - alert: LakehouseManifestRetiredGuardEvictedAfterDelete
        expr: increase(lakehouse_manifest_retired_evicted_total{reason="cap_delete_landed"}[1h]) > 0
        labels:
          severity: critical
        annotations:
          summary: "The manifest forgot a deleted key before a listing could prove it gone"
          description: "{{ $value }} key(s) whose objects this instance deleted were dropped from the retired set under its size bound, before any bucket listing that began after the delete had been applied. A ListObjectsV2 still in flight was answered before the delete and still names those objects, so the refresh applying it re-admits them next to the files that replaced them — as entries with no row count or aggregates, whose downloads then fail. Check why the retired set is at its bound (lakehouse_manifest_retired_delete_owed points at deletes that are failing) and whether refreshes are being accepted (lakehouse_manifest_refresh_cliff_guard_rejections_total)."

      - alert: LakehouseManifestRetiredDeleteLandedNotDraining
        expr: lakehouse_manifest_retired_delete_landed > 0 and increase(lakehouse_manifest_retired_settled_total[30m]) == 0
        labels:
          severity: warning
        annotations:
          summary: "Deleted keys are not being settled by the manifest refresh"
          description: "Keys whose objects are already deleted are held so a bucket listing older than the delete cannot adopt them back, and each is released by the first accepted listing that began after it. Guards are outstanding and NOT ONE has been released in 30 minutes, so refreshes are not completing or are being rejected: check lakehouse_manifest_refresh_cliff_guard_rejections_total and the manifest refresh phase in GET /lakehouse/info. The set grows with every compaction and permanent delete until a refresh lands. (The gauge alone cannot answer this: a node compacting faster than it refreshes refills the set as fast as it drains, so a non-zero gauge is normal — the settled counter is what proves progress.)"

      - alert: LakehouseTombstoneRestoreFailed
        expr: increase(lakehouse_delete_startup_inconsistencies_total{kind="s3_restore_failed"}[1h]) > 0 and on() lakehouse_delete_tombstone_restore_pending > 0
        labels:
          severity: critical
        annotations:
          summary: "The tombstone store could not be read from S3"
          description: "This instance started without the S3 copy of the tombstone store. Deletes made on other nodes are NOT enforced here (their rows are visible in queries), and every interrupted rewrite stays unresolved until the read succeeds. It is retried every minute; check S3 read permissions for the _tombstones/ prefix. GET /delete/logsql/leftovers reports s3_restore_pending and what is outstanding."

      - alert: LakehouseTombstoneRecordNotDurable
        expr: increase(lakehouse_delete_tombstone_not_durable_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites are held: their records are not reaching durable storage"
          description: "{{ $value }} tombstone change(s) could not be confirmed durable in 30 minutes, so no rewrite deleted the object it superseded (nothing is lost — the rewrites wait). lakehouse_delete_rewrite_deferred_total{reason=\"not_durable\"} counts the deferrals and lakehouse_delete_tombstone_persist_pending the backlog; check S3 write permissions for the _tombstones/ prefix."

      - alert: LakehouseDeleteRewritesUnfinished
        expr: lakehouse_delete_rewrites_unfinished > 0
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "Delete rewrites have been unfinished for hours"
          description: "{{ $value }} rewrite record(s) are still open: a replacement is uploaded or published but its superseded object has not been deleted. GET /delete/logsql/leftovers lists them with their state. Drain these to zero before rolling back to a release before v0.10.x — an older binary drops the records and nothing would finish them (see docs/operations.md → Rolling back)."
