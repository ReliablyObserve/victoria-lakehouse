{{- if .Values.vmauth.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "victoria-lakehouse.fullname" . }}-vmauth
  labels:
    {{- include "victoria-lakehouse.genericComponentLabels" (dict "root" . "component" "vmauth") | nindent 4 }}
type: Opaque
stringData:
  auth.yml: |
    {{- if .Values.vmauth.config }}
    {{ .Values.vmauth.config | nindent 4 }}
    {{- else }}
    unauthorized_user:
      url_map:
        {{- if and .Values.traces.enabled .Values.traces.select.enabled }}
        {{- /*
          The traces select rules come first. The logs select rule below has no condition on the
          signal, so a rule listed after it never sees a path it also lists. vmauth takes the first
          url_map entry that matches, and only src_headers (not headers, which sets a header on the
          proxied request) makes a request header part of the match.
        */}}
        - src_paths:
            - "/select/jaeger/.*"
            - "/tempo/.*"
            - "/delete/tracessql/.*"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-traces-select:10428/"
          discover_backend_ips: true
        - src_paths:
            - "/select/logsql/.*"
            - "/delete/logsql/.*"
          src_headers:
            - "X-Lakehouse-Signal: traces"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-traces-select:10428/"
          discover_backend_ips: true
        {{- end }}
        {{- if and .Values.traces.enabled .Values.traces.insert.enabled }}
        {{- /*
          The traces insert rules come before the logs insert rule, which lists "/insert/.*" with no
          condition on the signal (vmauth takes the first url_map entry that matches). Both signals
          serve /insert/native, /insert/multitenant/native and /insert/ready, so those go to the
          traces pods only with the header X-Lakehouse-Signal: traces, matched with src_headers
          (headers only sets a header on the proxied request). OTLP traces is served by the traces
          binary alone (the logs binary has only /insert/opentelemetry/v1/logs), so it is routed by
          path, with no header, like Jaeger and Tempo above. With no logs insert pods there is
          nothing to tell apart and every /insert/* path goes to the traces pods.
        */}}
        {{- if and .Values.logs.enabled .Values.logs.insert.enabled }}
        - src_paths:
            - "/insert/opentelemetry/v1/traces"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-traces-insert:10428/"
          discover_backend_ips: true
        - src_paths:
            - "/insert/.*"
          src_headers:
            - "X-Lakehouse-Signal: traces"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-traces-insert:10428/"
          discover_backend_ips: true
        {{- else }}
        - src_paths:
            - "/insert/.*"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-traces-insert:10428/"
          discover_backend_ips: true
        {{- end }}
        {{- end }}
        {{- if .Values.logs.enabled }}
        {{- if .Values.logs.insert.enabled }}
        - src_paths:
            - "/insert/.*"
            - "/internal/insert"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-logs-insert:9428/"
          discover_backend_ips: true
        {{- end }}
        {{- if .Values.logs.select.enabled }}
        - src_paths:
            - "/select/logsql/.*"
            - "/delete/logsql/.*"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-logs-select:9428/"
          discover_backend_ips: true
        {{- end }}
        {{- end }}
        {{- if and .Values.logs.enabled .Values.logs.select.enabled }}
        - src_paths:
            - "/.*"
          url_prefix:
            - "http://{{ include "victoria-lakehouse.fullname" . }}-logs-select:9428/"
          discover_backend_ips: true
        {{- end }}
    {{- end }}
{{- end }}
