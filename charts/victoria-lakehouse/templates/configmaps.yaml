{{- if and .Values.peerAuth.existingSecret (dig "peer" "auth_key" "" .Values.lakehouseConfig) }}
{{- fail "set the peer key once: peerAuth.existingSecret (preferred) or lakehouseConfig.peer.auth_key, not both" }}
{{- end }}
{{- range $signal := list "logs" "traces" }}
{{- $signalVals := index $.Values $signal }}
{{- if $signalVals.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "victoria-lakehouse.fullname" $ }}-{{ $signal }}-config
  labels:
    {{- include "victoria-lakehouse.labels" $ | nindent 4 }}
    app.kubernetes.io/signal: {{ $signal }}
data:
  config.yaml: |
    lakehouse:
      mode: {{ $signal }}
      {{- /* mode is set per signal above; a user-supplied lakehouseConfig.mode would
             duplicate the key, which the binaries reject */}}
      {{- $shared := deepCopy (omit $.Values.lakehouseConfig "mode") }}
      {{- /* Select pods reach the insert pods' unflushed rows through the insert
             headless service of the same signal, unless one is set explicitly. */}}
      {{- if and $signalVals.select.enabled $signalVals.insert.enabled $signalVals.insert.headlessService.enabled }}
      {{- $sel := default dict (get $shared "select") }}
      {{- if not (get $sel "insert_headless_service") }}
      {{- $port := include "victoria-lakehouse.signalPort" (dict "signal" $signal) }}
      {{- $_ := set $sel "insert_headless_service" (printf "%s-%s-insert-headless:%s" (include "victoria-lakehouse.fullname" $) $signal $port) }}
      {{- $_ := set $shared "select" $sel }}
      {{- end }}
      {{- end }}
      {{- $shared | toYaml | nindent 6 }}
      {{ $signal }}:
        {{- $signalVals.config | toYaml | nindent 8 }}
{{- end }}
{{- end }}
