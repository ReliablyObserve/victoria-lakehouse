name: Market data

on:
  pull_request:
    branches: [main]
    paths:
      - docs/market/**
      - docs/market-comparison.md
      - scripts/market/**
      - website/static/market/**
      - .github/workflows/market-data.yaml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for its previous head. Any other event
# (push to main, schedule, manual run) gets a group of its own, so it is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt
      - name: Tests
        run: python -m unittest discover -s scripts/market/tests -t . -v
      - name: Generated files are current
        run: python scripts/market/build.py --check
      - name: Cells due for a re-check
        # Informational on pull requests; the weekly run fails so stale cells get re-verified.
        run: python scripts/market/build.py --stale || [ "${{ github.event_name }}" != "schedule" ]
