name: Nightly Load Test

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Test mode: latency, throughput, benchmark, all'
        required: false
        default: 'all'

permissions:
  contents: read

env:
  VL_VERSION_LOGS: v1.52.0
  VL_COMMIT_TRACES: c945d2949e98
  GOWORK: "off"

jobs:
  loadtest:
    runs-on: ubuntu-latest
    services:
      s3:
        image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
        ports:
          - 9000:9000
        env:
          RUSTFS_ACCESS_KEY: minioadmin
          RUSTFS_SECRET_KEY: minioadmin
        options: --health-cmd "curl -sf http://127.0.0.1:9000/health" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Delegate to the Makefile — see ci.yaml's deps job rationale.
      - name: Prepare VL deps (logs)
        run: make deps-logs

      - name: Create S3 bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh ghcr.io/reliablyobserve/mc:RELEASE.2025-04-16T18-13-26Z -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb local/obs-archive --ignore-existing"

      - name: Generate test data
        run: go run ./cmd/datagen --endpoint=http://localhost:9000 --logs=10000 --traces=2000 --hours-back=48

      - name: Build lakehouse-logs
        run: go build -o /tmp/lakehouse-logs ./cmd/lakehouse-logs

      - name: Start lakehouse-logs
        run: |
          /tmp/lakehouse-logs \
            -lakehouse.mode=logs \
            -lakehouse.s3.bucket=obs-archive \
            -lakehouse.s3.endpoint=http://localhost:9000 \
            -lakehouse.s3.access-key=minioadmin \
            -lakehouse.s3.secret-key=minioadmin \
            -lakehouse.s3.force-path-style=true &
          sleep 5
          curl -sf http://localhost:9428/health

      - name: Run load tests
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          go run ./cmd/loadtest -mode=$MODE -target=http://localhost:9428 -output=loadtest-results.json

      - name: Run benchmarks
        if: github.event.inputs.mode == 'benchmark' || github.event.inputs.mode == '' || github.event.inputs.mode == 'all'
        run: go run ./cmd/loadtest -mode=benchmark -output=benchmark-results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-results
          path: |
            loadtest-results.json
            benchmark-results.json
          if-no-files-found: ignore
