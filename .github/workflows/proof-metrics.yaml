name: Proof metrics

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/proof/**"
      - "deployment/docker/docker-compose-proof.yml"
      - "deployment/docker/proof/**"
      - "tests/parity/testdata/tiecut_golden.json"
      - ".github/workflows/proof-metrics.yaml"
  push:
    branches: [main]
    paths:
      - "scripts/proof/**"
      - ".github/workflows/proof-metrics.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/proof/requirements.txt

      - name: Lint
        run: python -m pyflakes scripts/proof

      - name: Unit tests with coverage floor
        run: |
          python -m pytest scripts/proof/tests -q \
            --cov=scripts.proof.metrics --cov=scripts.proof.runner --cov=scripts.proof.visual --cov=scripts.proof.stack --cov=scripts.proof.comment \
            --cov-report=term-missing --cov-fail-under=90

      - name: Proof stack compose file is valid
        run: docker compose -p lhproof -f deployment/docker/docker-compose-proof.yml config -q

      - name: Fixtures match their recorded expectations
        run: python -m scripts.proof.metrics scripts/proof/fixtures/cases --check

      - name: Fixture generator output is committed
        run: |
          python scripts/proof/fixtures/_gen.py
          # git diff would miss untracked files: a case the generator creates but nobody committed
          test -z "$(git status --porcelain -- scripts/proof/fixtures/cases)"
