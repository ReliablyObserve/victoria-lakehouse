name: Verification Matrix Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check matrix.md path references resolve to real files
        run: tests/verification/check_matrix_coverage.sh
