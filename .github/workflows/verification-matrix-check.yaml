name: Verification Matrix Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still going for its previous head. Any other event
# (push to main, schedule, manual run) gets a group of its own, so it is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check matrix.md path references resolve to real files
        run: tests/verification/check_matrix_coverage.sh
