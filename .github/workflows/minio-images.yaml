name: minio-images

# Builds the MinIO server and mc client used by the compose files and CI jobs
# from upstream source at the pinned tags, and publishes them to GHCR.
#
# Why: upstream MinIO is unmaintained (the minio/minio repository is archived,
# the community edition is source-only) and the quay.io/minio/* and Docker Hub
# minio/* images refuse anonymous pulls. These are frozen test images, not a
# supported MinIO distribution. See docs/minio-test-images.md.
#
# Tags are immutable: an image is pushed only when its tag does not exist yet.
# To move to a different MinIO release, change the pins below AND every
# reference listed in docs/minio-test-images.md.

on:
  pull_request:
    paths:
      - "deployment/docker/minio-src/**"
      - ".github/workflows/minio-images.yaml"
  push:
    branches: [main]
    paths:
      - "deployment/docker/minio-src/**"
      - ".github/workflows/minio-images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: minio-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # Upstream pins. COMMIT is the tag object id (`git ls-remote --tags <repo> <tag>`);
  # the Dockerfiles fail if the cloned tag does not resolve to it.
  TAG: RELEASE.2025-04-22T22-12-26Z
  COMMIT: f19c534b9f457773dcd043d977433e1a71525c3b
  MC_TAG: RELEASE.2025-04-16T18-13-26Z
  MC_COMMIT: 1e78af443bf0443eb177f26421fe081f08d83dc5
  REGISTRY: ghcr.io/reliablyobserve

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [minio, mc]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag and build args
        id: cfg
        run: |
          set -euo pipefail
          if [ "${{ matrix.image }}" = "minio" ]; then
            {
              echo "tag=${TAG}"
              echo "args<<EOF"
              echo "TAG=${TAG}"
              echo "COMMIT=${COMMIT}"
              echo "MC_TAG=${MC_TAG}"
              echo "MC_COMMIT=${MC_COMMIT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=${MC_TAG}"
              echo "args<<EOF"
              echo "TAG=${MC_TAG}"
              echo "COMMIT=${MC_COMMIT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${REGISTRY}/${{ matrix.image }}:$(grep -m1 '^tag=' "$GITHUB_OUTPUT" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Fork PRs get a read-only token: build only, never push.
      - name: Can this run publish?
        id: can
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.can.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Does the tag already exist?
        id: exists
        run: |
          set -uo pipefail
          if [ "${{ steps.can.outputs.push }}" != "true" ]; then
            echo "exists=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if out=$(docker buildx imagetools inspect "${{ steps.cfg.outputs.ref }}" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qiE 'not found|manifest unknown|name unknown|404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            echo "cannot determine whether ${{ steps.cfg.outputs.ref }} exists; refusing to risk overwriting an immutable tag" >&2
            exit 1
          fi

      - name: Build (push only if the tag is new)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: deployment/docker/minio-src
          file: deployment/docker/minio-src/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.cfg.outputs.args }}
          push: ${{ steps.can.outputs.push == 'true' && steps.exists.outputs.exists == 'false' }}
          tags: ${{ steps.cfg.outputs.ref }}
          provenance: false

      - name: Summary
        run: |
          {
            echo "### ${{ steps.cfg.outputs.ref }}"
            echo ""
            case "${{ steps.exists.outputs.exists }}" in
              false)   echo "Pushed (new tag). Digest: \`${{ steps.build.outputs.digest }}\`" ;;
              true)    echo "Tag already exists, build verified only (tags are immutable)." ;;
              *)       echo "Build verified only (fork pull request, no push)." ;;
            esac
            echo ""
            echo "Upstream tag: \`${{ steps.cfg.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
