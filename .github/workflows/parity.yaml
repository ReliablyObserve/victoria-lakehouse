name: Parity Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'lakehouse-traces/**'
      - 'patches/**'
      - 'tests/parity/**'
      - 'scripts/ci/parity_ratchet.py'
      - 'scripts/ci/tests/test_parity_ratchet.py'
      - 'Dockerfile.*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/parity.yaml'
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'lakehouse-traces/**'
      - 'patches/**'
      - 'tests/parity/**'
      - 'scripts/ci/parity_ratchet.py'
      - 'scripts/ci/tests/test_parity_ratchet.py'
      - 'Dockerfile.*'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/parity.yaml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The ratchet decides whether this job passes, so its own tests run
      # first — a broken gate must not silently wave a broken suite through.
      - name: Test the parity ratchet
        run: python -m unittest scripts.ci.tests.test_parity_ratchet -v

      - name: Build parity stack
        run: docker compose -f tests/parity/docker-compose.yml build

      - name: Start parity stack (waits for datagen via parity-tests depends_on)
        run: docker compose -f tests/parity/docker-compose.yml up -d

      # Every wait below fails the job when it runs out of attempts. Falling
      # out of a poll loop and carrying on would run the suite against a
      # stack that never came up, and every comparison would be noise.
      - name: Wait for all services healthy
        run: |
          for svc in victorialogs lakehouse-logs victoriatraces lakehouse-traces; do
            status=""
            for i in $(seq 1 90); do
              status=$(docker compose -f tests/parity/docker-compose.yml ps --format json "$svc" 2>/dev/null \
                | jq -r '.Health // .State' 2>/dev/null) || status=""
              if [ "$status" = "healthy" ]; then
                echo "$svc healthy"
                break
              fi
              echo "waiting for $svc... ($i/90)"
              sleep 2
            done
            if [ "$status" != "healthy" ]; then
              echo "$svc never became healthy within 180s (last status: ${status:-unknown})" >&2
              exit 1
            fi
          done

      - name: Wait for datagen to complete
        run: |
          for svc in datagen-seed datagen-seed-tenant2; do
            state=""
            for i in $(seq 1 120); do
              state=$(docker compose -f tests/parity/docker-compose.yml ps -a --format json "$svc" 2>/dev/null \
                | jq -r '"\(.State) \(.ExitCode)"' 2>/dev/null) || state=""
              case "$state" in
                "exited 0")
                  echo "$svc completed"
                  break
                  ;;
                exited*)
                  echo "$svc exited abnormally ($state)" >&2
                  docker compose -f tests/parity/docker-compose.yml logs "$svc" --tail=50 >&2
                  exit 1
                  ;;
              esac
              echo "waiting for $svc... ($i/120)"
              sleep 2
            done
            if [ "$state" != "exited 0" ]; then
              echo "$svc did not finish within 240s (last state: ${state:-unknown})" >&2
              exit 1
            fi
          done

      # A fixed sleep is not enough: the cold tier keeps flushing and
      # compacting after datagen exits, and a comparison taken mid-flush
      # reads fewer rows than the hot tier holds (and than the cold tier's
      # own scan path returns a second later). Poll until each cold tier
      # agrees with its hot counterpart on a plain row count — for the logs
      # corpus and for BOTH seeded traces tenants — and keeps agreeing.
      #
      # One agreeing check is not a settled tier either. Rows written
      # seconds ago are answered from the cold tier's local buffer, which
      # can agree with hot on a count while the Parquet path the suite then
      # reads does not, and a manifest refresh racing a flush hides the new
      # file for one refresh interval. So the counts must stay unchanged for
      # four checks in a row: 15s, three -lakehouse.manifest.refresh-interval
      # periods of the parity compose.
      - name: Wait for LH to flush and settle
        run: |
          # Probes run from inside the network (the stack publishes no host
          # ports). The published VictoriaLogs image is DISTROLESS from v1.51.0
          # — no shell, no wget, only the product binary — so the probe must be
          # the static busybox Dockerfile.upstream-probe copies in, invoked by
          # its absolute path exactly as the healthchecks do. A bare `wget`
          # here exits 126 with "executable file not found", which 2>/dev/null
          # then hides: every probe reports 0, no tier ever agrees on a
          # positive count, and the step spends its full 300s budget before
          # failing with counts that look like an unflushed cold tier rather
          # than a probe that never ran.
          BUSYBOX=/probe/busybox
          probe() { # probe <host:port> <logsql query> <AccountID>
            out=$(docker compose -f tests/parity/docker-compose.yml exec -T victorialogs \
              "$BUSYBOX" wget -qO- --header="Content-Type: application/x-www-form-urlencoded" \
              --header="AccountID: $3" --header="ProjectID: 0" \
              --post-data="query=$2" "http://$1/select/logsql/stats_query" 2>/dev/null \
              | jq -r '.data.result[0].value[1] // empty' 2>/dev/null) || out=""
            # jq exits 0 on empty input, so an unreachable tier or an empty
            # answer yields an empty string, not an error. Report it as 0 so
            # two failed probes can never compare equal as "settled".
            echo "${out:-0}"
          }
          # Prove the probe itself works before reading anything into its
          # answers: run it once with stderr attached, so a missing binary or
          # an unroutable host fails HERE, in one second, naming the cause —
          # instead of being swallowed into a 0 that looks like missing data.
          if ! docker compose -f tests/parity/docker-compose.yml exec -T victorialogs \
                 "$BUSYBOX" wget -qO- "http://victorialogs:9428/health" >/dev/null; then
            echo "settle probe is not usable: $BUSYBOX wget cannot reach victorialogs:9428." >&2
            echo "Every count below would read 0 and mean nothing. See deployment/docker/Dockerfile.upstream-probe." >&2
            exit 1
          fi
          # A tier agrees only on a positive count: 0 is what an unseeded
          # or unreachable tier reports, and 0 == 0 proves nothing.
          agree() { # agree <hot> <cold>
            case "$1" in ''|*[!0-9]*) return 1 ;; esac
            [ "$1" -gt 0 ] && [ "$1" = "$2" ]
          }
          settled=0
          steady=0
          previous=""
          for i in $(seq 1 60); do
            hot_logs=$(probe victorialogs:9428 '* | stats count() n' 0)
            cold_logs=$(probe lakehouse-logs:9428 '* | stats count() n' 0)
            hot_traces=$(probe victoriatraces:10428 'span_id:* | stats count() n' 0)
            cold_traces=$(probe lakehouse-traces:10428 'span_id:* | stats count() n' 0)
            hot_traces_t1=$(probe victoriatraces:10428 'span_id:* | stats count() n' 1)
            cold_traces_t1=$(probe lakehouse-traces:10428 'span_id:* | stats count() n' 1)
            current="$hot_logs $cold_logs $hot_traces $cold_traces $hot_traces_t1 $cold_traces_t1"
            if agree "$hot_logs" "$cold_logs" \
               && agree "$hot_traces" "$cold_traces" \
               && agree "$hot_traces_t1" "$cold_traces_t1"; then
              if [ "$current" = "$previous" ]; then
                steady=$((steady + 1))
              else
                steady=1
              fi
            else
              steady=0
            fi
            previous="$current"
            echo "settle check $i/60: logs hot=$hot_logs cold=$cold_logs" \
              "| traces tenant 0 hot=$hot_traces cold=$cold_traces" \
              "| traces tenant 1 hot=$hot_traces_t1 cold=$cold_traces_t1" \
              "| agreeing unchanged for $steady/4 checks"
            if [ "$steady" -ge 4 ]; then
              settled=1
              echo "cold tiers settled"
              break
            fi
            sleep 5
          done
          # Falling out of the loop is a failed run, not a slow one: every
          # comparison after this point would be measured against a partial
          # cold corpus and the results would be meaningless.
          if [ "$settled" != "1" ]; then
            echo "cold tier never settled after 60 attempts (300s):" >&2
            echo "  logs             hot=$hot_logs cold=$cold_logs" >&2
            echo "  traces tenant 0  hot=$hot_traces cold=$cold_traces" >&2
            echo "  traces tenant 1  hot=$hot_traces_t1 cold=$cold_traces_t1" >&2
            exit 1
          fi

      # `go test` exits non-zero while the known-failure allowlist is
      # non-empty, so its status is recorded and deliberately not propagated
      # here: the ratchet step below is what passes or fails this job. That
      # is the whole point of the allowlist — a blanket `continue-on-error`
      # on this step would also swallow the ratchet's verdict.
      #
      # --no-deps: the stack is already up, seeded and settled. Without it
      # `compose run` starts parity-tests' dependencies again, and for the
      # one-shot datagen-seed and datagen-seed-tenant2 services that means
      # running them a second time — which doubled the corpus and wrote the
      # second copy after the settle step had declared the cold tier caught up.
      - name: Run parity tests in-network
        run: |
          set +e
          docker compose -f tests/parity/docker-compose.yml --profile test run --rm --no-deps -T parity-tests \
            go test -tags=parity -json -count=1 -timeout=15m ./... > parity-results.json
          echo "go test exit code: $?"
          wc -l parity-results.json

      - name: Parity ratchet (known-failure allowlist)
        run: |
          python scripts/ci/parity_ratchet.py \
            --results parity-results.json \
            --allowlist tests/parity/known_failures.txt \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-results
          path: parity-results.json

      - name: Show docker logs on failure
        if: failure()
        run: |
          echo "=== victorialogs ==="
          docker compose -f tests/parity/docker-compose.yml logs victorialogs --tail=50
          echo "=== lakehouse-logs ==="
          docker compose -f tests/parity/docker-compose.yml logs lakehouse-logs --tail=50
          echo "=== victoriatraces ==="
          docker compose -f tests/parity/docker-compose.yml logs victoriatraces --tail=50
          echo "=== lakehouse-traces ==="
          docker compose -f tests/parity/docker-compose.yml logs lakehouse-traces --tail=50
          echo "=== datagen-seed ==="
          docker compose -f tests/parity/docker-compose.yml logs datagen-seed --tail=50
          echo "=== datagen-seed-tenant2 ==="
          docker compose -f tests/parity/docker-compose.yml logs datagen-seed-tenant2 --tail=50

      - name: Stop parity stack
        if: always()
        run: docker compose -f tests/parity/docker-compose.yml down -v
