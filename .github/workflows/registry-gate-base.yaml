name: Registry Gate (base workflow)

# Defence in depth for the registry gate. `pull_request_target` runs THIS file as
# it is on the base branch, so a pull request cannot edit, disable or rename the
# workflow that judges it (it can with `registry-gate.yaml`, which `pull_request`
# takes from the PR). The PR is fetched as git data and read, never built, run
# or sourced: the gate code, the bootstrap and the approvers file all come from
# the base checkout.
#
# Required check: `registry-gate-base`. Pin it to this file with a ruleset
# ("Require workflows to pass before merging" -> this path on `main`, or "Require
# status checks" with the GitHub Actions app as the source), so the check cannot
# be satisfied by anything else. No job-level `if:` (a skipped required job
# counts as passed).
#
# Safety rules for editing this file (it holds secrets-level trust): never check
# out or `run` the PR head, never use `${{ github.event.* }}` text inside `run:`
# (pass it through `env:`), keep `permissions` read-only.

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: registry-gate-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  registry-gate-base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default checkout of pull_request_target is the BASE branch: trusted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The PR head as data: fetched into a detached worktree with hooks disabled.
      - name: Fetch the pull request as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" || { echo "::error::the PR head moved since the event; re-run"; exit 1; }
          git worktree add --detach "$RUNNER_TEMP/pr" "$HEAD_SHA"

      - name: Product changes and new tests are covered in the registry
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_DIR: ${{ runner.temp }}/pr
          GATE_DIR: ${{ github.workspace }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: bash "$GATE_DIR/scripts/ci/gate_bootstrap.sh" run
