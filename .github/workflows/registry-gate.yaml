name: Registry Gate

# The registry gate in its own job on a fresh runner. It runs NO code from the
# pull request: it checks the PR out as data, takes the gate (script, classifier,
# testlinks) from the PR's merge base, and runs that. A label or body edit
# re-runs only this workflow (the heavy Conformance workflow does not listen to
# those events), so a bot's label cannot cancel or mask the heavy checks.
#
# Required check: `registry-gate`. This job has no job-level `if:` on purpose
# (a skipped required job counts as passed).

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled/edited re-evaluate the gate: the owner's `registry-exempt`
    # label is honoured only in the run its own labeled event triggers.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: registry-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  registry-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # git only: no PR file is executed, hooks are disabled. The bootstrap is read
      # from the merge base, never from the PR.
      - name: Prepare the gate from the merge base
        id: prep
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=core.hooksPath GIT_CONFIG_VALUE_0=/dev/null
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if git cat-file -e "$base:scripts/ci/gate_bootstrap.sh" 2>/dev/null; then
            git show "$base:scripts/ci/gate_bootstrap.sh" > "$RUNNER_TEMP/gate_bootstrap.sh"
          else
            # No fallback: a PR whose merge base predates the bootstrap must be rebased.
            echo "::error::the merge base has no scripts/ci/gate_bootstrap.sh: rebase this PR onto the current $BASE_REF"
            exit 1
          fi
          bash "$RUNNER_TEMP/gate_bootstrap.sh" prepare >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ steps.prep.outputs.gate_dir }}/go.mod
          # No cache: nothing a PR can write into a cache is ever read by the gate.
          cache: false

      - name: Product changes and new tests are covered in the registry
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
          SENDER: ${{ github.event.sender.login }}
        run: bash "$RUNNER_TEMP/gate_bootstrap.sh" run
