name: Conformance

on:
  pull_request:
    branches: [main]
    # Title edits are deliberately not listed: they re-run only the registry gate
    # (registry-gate.yaml, registry-gate-base.yaml), never these heavy checks.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a label or body edit (or a push) supersedes the run in flight.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"
  VL_VERSION_LOGS: v1.53.0
  VL_COMMIT_TRACES: c945d2949e98
  VT_VERSION: v0.12.0

jobs:
  conformance-inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}
      - name: Prepare deps (no-op when cache hit)
        run: make deps-logs deps-traces deps-vt
      - name: Conformance drift and generated files check
        run: make conformance-check
      # The gate itself runs in registry-gate.yaml / registry-gate-base.yaml, from
      # the merge base. These are the gate's own tests, run on the PR's copy.
      - name: Registry gate self-tests
        run: |
          bash scripts/ci/tests/test_check_registry_touch.sh
          bash scripts/ci/tests/test_gate_workflow_emulation.sh
          python3 -m unittest scripts/ci/tests/test_pr_classify_toolchain.py
