name: Conformance

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled/edited re-evaluate the registry gate when the owner
    # applies (or removes) `registry-exempt` or edits the PR body's
    # "Registry: none — <reason>" line.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a label or body edit (or a push) supersedes the run in flight.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOWORK: "off"
  VL_VERSION_LOGS: v1.53.0
  VL_COMMIT_TRACES: c945d2949e98
  VT_VERSION: v0.12.0

jobs:
  conformance-inventory:
    runs-on: ubuntu-latest
    # issues/pull-requests: read lets the registry gate read who applied the
    # `registry-exempt` label (the PR's issue events).
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}
      - name: Prepare deps (no-op when cache hit)
        run: make deps-logs deps-traces deps-vt
      - name: Conformance drift and generated files check
        run: make conformance-check
      - name: Registry-touch checker tests
        run: |
          bash scripts/ci/tests/test_check_registry_touch.sh
          python3 -m unittest scripts/ci/tests/test_registry_exempt.py
      # The gate judges the PR, so it must not be the PR's own copy: its code is
      # taken from the merge base (a PR that changes the gate is held to the
      # owner exemption, and its change takes effect once merged).
      - name: Product changes and new tests are covered in the registry
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          gate="$RUNNER_TEMP/gate-base"
          git worktree add --detach "$gate" "$(git merge-base "origin/$BASE_REF" HEAD)"
          (cd "$gate" && GOWORK=off go build -o "$RUNNER_TEMP/testlinks" ./tests/conformance/cmd/testlinks)
          TESTLINKS_BIN="$RUNNER_TEMP/testlinks" "$gate/scripts/ci/check_registry_touch.sh" "origin/$BASE_REF"
