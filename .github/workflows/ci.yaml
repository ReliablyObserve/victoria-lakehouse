name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  VL_VERSION_LOGS: v1.52.0
  VL_COMMIT_TRACES: c945d2949e98
  VT_VERSION: v0.12.0
  GOWORK: "off"

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Single source of truth for which patches get applied: the
      # Makefile. The inline git-apply blocks we used to have here
      # silently drifted every time a new patch landed — Makefile
      # got the patch, ci.yaml didn't, the next PR's test-traces job
      # failed at `undefined: opentelemetry.FormatSeverity` even
      # though everything passed locally. Delegating to make keeps
      # the patch list in one place. cache key already includes
      # `hashFiles('patches/**', 'Makefile')` so the cache invalidates whenever
      # a patch changes.
      - name: Prepare VL deps (logs)
        run: make deps-logs

      - name: Prepare VL deps (traces)
        run: make deps-traces

      - name: Prepare VT deps (traces)
        run: make deps-vt

      - uses: actions/cache/save@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

  # Config drift gate. The code defaults are the source of truth: both
  # binaries' `print-default-config` output is pinned in golden files, and
  # every other surface that spells a setting is generated from it or checked
  # against it (docs/configuration.md#configuration-drift-gate):
  # - helmdrift: every yaml-tagged key in internal/config is documented in
  #   charts/.../values.yaml AND values.schema.json, or grandfathered in
  #   scripts/ci/helm-drift-allowlist.txt;
  # - config_drift_report.py: chart values, schema defaults and template
  #   fallbacks equal the code defaults (or are `override` lines with a
  #   reason in the same allowlist), docs tables and YAML examples and flag
  #   usage strings match the code, deployment configs use real keys, and the
  #   generated docs blocks are fresh.
  # needs: deps because the golden tests build both binaries.
  helm-config-drift:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Install report dependencies
        run: pip install pyyaml

      - name: Config surface golden files (logs, field docs, documented examples)
        run: |
          go test ./cmd/lakehouse-logs -run 'TestConfigSurface|TestPrintDefaultConfig' -count=1
          go test ./internal/config -run 'TestFieldDocsGolden|TestDocumentedConfigExamplesLoad' -count=1

      - name: Config surface golden file (traces)
        working-directory: lakehouse-traces
        run: go test . -run 'TestConfigSurface|TestPrintDefaultConfig' -count=1

      - name: Check Helm config key coverage
        run: go run ./scripts/ci/helmdrift

      - name: Check config drift (chart, docs, flags, deployment configs)
        run: python scripts/ci/config_drift_report.py --check

  # Multi-engine parquet readback gate: writes synthetic files with the
  # REAL production schemas + writer options (zstd best, row-group
  # bounds, blooms, delta/dict tags, _trace_idx footer), then reads them
  # back with BOTH pyarrow and duckdb — aggregate truth, row-level
  # equality (EXCEPT ALL both directions), encoding assertions, and
  # PageIndex presence. Every parquet encoding change ships behind this
  # gate.
  # needs: deps because internal/schema (the real row structs) imports
  # VL upstream via severity.go.
  # The benchmark harness decides which timed answers count: its validators
  # (extract_result, scan membership, request prep for every system, report
  # validity) are tested here so a broken harness cannot publish numbers.
  bench-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Benchmark harness self-tests
        shell: bash
        run: |
          set -euo pipefail
          for t in scripts/bench/tests/*_test.sh; do
            echo "== $t"
            bash "$t"
          done
          python3 -m unittest scripts/bench/tests/test_report_validity.py -v
          python3 -m unittest scripts/bench/tests/test_perf_rows.py -v

  # Field-metadata performance gate, held by the registry. The harness answers
  # every cell (field_values, field_names, streams x pmeta x flushed/compacted
  # layout x window x filter, both binaries) on the same rows and validates each
  # answer against the generator's truth; perf_rows.py check holds the run to
  # tests/conformance/registry/rows/perf/field_metadata.yaml: exact where a row
  # passes, no S3 GETs/bytes, row groups or pages above the row, the same
  # answering path, every cell registered, and every compacted cell exact where
  # its flushed twin is. S3 latency does not change the counters, so the gate
  # runs at 0 ms; latency budgets are held by the recorded per-PR matrix.
  field-metadata-perf:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Measure the field-metadata cells (logs, traces)
        run: |
          set -euo pipefail
          export FM_MATRIX_OUT="$RUNNER_TEMP/field-metadata.jsonl" FM_BUILD=after FM_ITERS=1 FM_WARMUP=0 FM_LATENCIES_MS=0
          # -v so an object the scan could not read is visible: its warning
          # is the only trace of it (the answer just comes back short).
          go test ./internal/storage/parquets3/ -run '^TestFieldMetadataMatrix$' -count=1 -timeout=10m -v > "$RUNNER_TEMP/fm-logs.txt" 2>&1
          (cd lakehouse-traces && go test ./internal/storage/parquets3/ -run '^TestFieldMetadataMatrixTraces$' -count=1 -timeout=10m -v > "$RUNNER_TEMP/fm-traces.txt" 2>&1)
          grep -h -E 'scan projected|query file error|buffer bridge|--- FAIL|^(ok|FAIL)' "$RUNNER_TEMP"/fm-logs.txt "$RUNNER_TEMP"/fm-traces.txt | head -50

      - name: Hold the cells to the registry perf rows
        run: |
          set -euo pipefail
          python3 scripts/bench/field_metadata/perf_rows.py check "$RUNNER_TEMP/field-metadata.jsonl" \
            tests/conformance/registry/rows/perf/field_metadata.yaml | tee field-metadata-perf.txt
          { echo "## Field-metadata perf gate"; echo '```'; cat field-metadata-perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The measured cells, so registry counters can be regenerated from CI's
      # numbers (perf_rows.py gen) rather than from a developer machine.
      - name: Upload the measured cells
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: field-metadata-matrix
          path: ${{ runner.temp }}/field-metadata.jsonl
          if-no-files-found: ignore
          retention-days: 14

  parquet-readback:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Install readers
        run: pip install pyarrow duckdb

      # The truth verify.py holds both engines to must itself match the
      # files written: read back with parquet-go and recomputed.
      - name: Generator truth tests
        run: go test ./scripts/ci/parquet-readback/... -count=1

      - name: Generate parquet files (production schemas + options)
        run: go run ./scripts/ci/parquet-readback/gen -out /tmp/parquet-readback

      - name: Verify with pyarrow + duckdb
        run: python scripts/ci/parquet-readback/verify.py /tmp/parquet-readback

  test-logs:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Check gofmt -s (logs)
        run: |
          DIFF=$(gofmt -s -l cmd/ internal/)
          if [ -n "$DIFF" ]; then
            echo "::error::gofmt -s required on: $DIFF"
            exit 1
          fi

      # Two invocations, because -short must reach only parquets3 (other
      # packages gate their own stress/memleak tests on it):
      #   * every other package: -timeout=10m, unchanged.
      #   * parquets3 (-short): -timeout=8m. Measured on a 2-core runner it
      #     takes ~3 min (was ~9-10 min and timing out at random); 8m is ~2.5x
      #     that, and gotest_report.py warns at 70% (5m36s) and fails at 90%
      #     (7m12s) of it, so a creeping package is caught while it is still
      #     green. The tests -short skips (the memory-budget, production-shape
      #     and field-metadata matrix tests, i.e. exactly the ones that call
      #     testing.Short()) run in test-parquets3-heavy on every PR.
      # `set -o pipefail` keeps a go test failure from being hidden by the
      # pipe into the report.
      - name: Test logs module
        run: |
          set -euo pipefail
          others=$(go list ./internal/... | grep -v '/internal/storage/parquets3$')
          # shellcheck disable=SC2086
          go test $others -race -count=1 -timeout=10m -json | tee test-logs-others.json |
            python3 scripts/ci/gotest_report.py --budget-seconds 600 --title "logs: all packages except parquets3"
          go test ./internal/storage/parquets3/ -short -race -count=1 -timeout=8m -json | tee test-logs-parquets3.json |
            python3 scripts/ci/gotest_report.py --budget-seconds 480 --title "logs: parquets3 (-short)"

      - name: Coverage check (logs)
        run: |
          THRESHOLD=90
          FAILED=0
          while IFS= read -r line; do
            pkg=$(echo "$line" | grep -oP '/internal/\K[^/\s]+' | head -1)
            [ -z "$pkg" ] && continue
            case "$pkg" in testutil|storage) continue ;; esac
            pct=$(echo "$line" | grep -oP '([0-9.]+)%' | head -1 | tr -d '%')
            [ -z "$pct" ] && continue
            below=$(awk "BEGIN{print ($pct < $THRESHOLD)}")
            if [ "$below" -eq 1 ]; then
              echo "::error::Coverage for $pkg is ${pct}% (minimum: ${THRESHOLD}%)"
              FAILED=1
            fi
          done < <({ go test $(go list ./internal/... | grep -v '/internal/storage/parquets3$') -cover -count=1 -timeout=10m
                     go test ./internal/storage/parquets3/ -short -cover -count=1 -timeout=8m; } 2>&1 | grep 'coverage:')
          [ "$FAILED" -eq 1 ] && exit 1 || echo "All packages above ${THRESHOLD}% coverage"

      - name: Vet logs module
        run: go vet ./internal/... ./cmd/...

  test-traces:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Check gofmt -s (traces)
        working-directory: lakehouse-traces
        run: |
          DIFF=$(gofmt -s -l internal/ *.go)
          if [ -n "$DIFF" ]; then
            echo "::error::gofmt -s required on: $DIFF"
            exit 1
          fi

      # Same split and budgets as test-logs (see the comment there).
      - name: Test traces module
        working-directory: lakehouse-traces
        run: |
          set -euo pipefail
          others=$(go list ./internal/... | grep -v '/internal/storage/parquets3$')
          # shellcheck disable=SC2086
          go test $others -race -count=1 -timeout=10m -json | tee test-traces-others.json |
            python3 ../scripts/ci/gotest_report.py --budget-seconds 600 --title "traces: all packages except parquets3"
          go test ./internal/storage/parquets3/ -short -race -count=1 -timeout=8m -json | tee test-traces-parquets3.json |
            python3 ../scripts/ci/gotest_report.py --budget-seconds 480 --title "traces: parquets3 (-short)"

      - name: Coverage check (traces)
        working-directory: lakehouse-traces
        run: |
          THRESHOLD=90
          FAILED=0
          while IFS= read -r line; do
            pkg=$(echo "$line" | grep -oP '/internal/\K[^/\s]+' | head -1)
            [ -z "$pkg" ] && continue
            case "$pkg" in testutil|storage|vtstorage_adapter|selectapi) continue ;; esac
            pct=$(echo "$line" | grep -oP '([0-9.]+)%' | head -1 | tr -d '%')
            [ -z "$pct" ] && continue
            below=$(awk "BEGIN{print ($pct < $THRESHOLD)}")
            if [ "$below" -eq 1 ]; then
              echo "::error::Coverage for $pkg is ${pct}% (minimum: ${THRESHOLD}%)"
              FAILED=1
            fi
          done < <({ go test $(go list ./internal/... | grep -v '/internal/storage/parquets3$') -cover -count=1 -timeout=10m
                     go test ./internal/storage/parquets3/ -short -cover -count=1 -timeout=8m; } 2>&1 | grep 'coverage:')
          [ "$FAILED" -eq 1 ] && exit 1 || echo "All packages above ${THRESHOLD}% coverage"

      - name: Vet traces module
        working-directory: lakehouse-traces
        run: go vet ./...

  # The parquets3 tests that call testing.Short() and so are skipped by the
  # -short unit run in test-logs / test-traces: the memory-budget and
  # production-shape query tests, the field-metadata exactness matrix in all
  # layouts, and the compression benchmarks-as-tests. They build hundreds of
  # files or ~48k-row deployments and are the slowest tests in the repo; keeping
  # them in the unit job pushed the package past its 10m -timeout (465s, 494s,
  # 551s, then a 600s kill on main), so they run here instead, in parallel, on
  # every PR, with -race and their own budget. The test list is derived from the
  # source (short_gated_tests.sh), so a test that gains or loses a Short() gate
  # moves between the two jobs by itself; nothing is enumerated by hand.
  # Measured on a 2-core runner: ~3-4 min. -timeout=10m is ~2.5x; the report
  # warns at 70% and fails at 90% of it.
  test-parquets3-heavy:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: logs
            dir: .
            gomod: go.mod
          - module: traces
            dir: lakehouse-traces
            gomod: lakehouse-traces/go.mod
    name: test-parquets3-heavy (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.gomod }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Heavy parquets3 tests (${{ matrix.module }})
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          heavy=$("$GITHUB_WORKSPACE/scripts/ci/short_gated_tests.sh" internal/storage/parquets3)
          echo "running: $heavy"
          go test ./internal/storage/parquets3/ -run "$heavy" -race -count=1 -timeout=10m -json | tee heavy.json |
            python3 "$GITHUB_WORKSPACE/scripts/ci/gotest_report.py" --budget-seconds 600 --title "${{ matrix.module }}: parquets3 heavy"

  # Dedicated hot/cold parity safeguard. The same tests already run as
  # part of `test-traces` and `test-logs`, but pulling them into a named
  # job makes the parity check visible in PR pages and gives reviewers
  # a single status icon to look at. When a parity test fires, it's
  # almost always one of the regression classes the cold/hot drilldown
  # has shipped before — cf. issue #99, commit a5576bf, commit be8c126.
  parity-unit:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Run hot/cold parity tests (traces)
        working-directory: lakehouse-traces
        run: |
          set -o pipefail
          go test ./internal/storage/parquets3/ \
            -run '^(TestColdHotParity|TestFieldEqualityAndStreamFilter)' \
            -race -count=1 -timeout=5m -v 2>&1 | tee parity-traces.txt

      - name: Run VL field-name parity tests (logs)
        run: |
          set -o pipefail
          go test ./internal/storage/parquets3/ \
            -run '^(TestFieldNames_VLParity|TestInsertAndQuery_FieldNameParity)' \
            -race -count=1 -timeout=5m -v 2>&1 | tee parity-logs.txt

      - name: Summarize parity results
        if: always()
        run: |
          echo "## Hot/Cold Parity (Unit)" >> $GITHUB_STEP_SUMMARY
          for f in parity-traces.txt lakehouse-traces/parity-traces.txt parity-logs.txt; do
            [ -f "$f" ] || continue
            label=$(basename "$f" .txt)
            pass=$(grep -c '^--- PASS' "$f" || true)
            fail=$(grep -c '^--- FAIL' "$f" || true)
            skip=$(grep -c '^--- SKIP' "$f" || true)
            echo "- **$label** — passed: $pass, failed: $fail, skipped: $skip" >> $GITHUB_STEP_SUMMARY
            if [ "$fail" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "<details><summary>Failed (click to expand)</summary>" >> $GITHUB_STEP_SUMMARY
              echo '' >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -B1 -A6 '^--- FAIL' "$f" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-unit-results
          path: |
            lakehouse-traces/parity-traces.txt
            parity-logs.txt

  lint-logs:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pure repo-tree checks: the two VictoriaLogs patch directories must
      # stay byte-equal except where patches/vl-traces/DIVERGENCE.md declares
      # a reason. No upstream checkout needed, so it runs before setup-go.
      - name: Patch-set consistency guard self-test
        run: scripts/ci/tests/check_patches_equal_test.sh

      - name: Patch-set consistency (vl-logs vs vl-traces)
        run: scripts/ci/check_patches_equal.sh

      # The daily upstream sync probe, against a fake upstream (local git
      # repositories, shimmed gh and go): every verdict and exit code, no
      # network, no Go toolchain needed.
      - name: Upstream sync probe self-test
        run: scripts/ci/tests/upstream_sync_probe_test.sh

      # Its publishing half against a local bare repository: no token no push,
      # never overwriting a branch a maintainer committed to, one pull request.
      - name: Upstream sync publish self-test
        run: scripts/ci/tests/upstream_sync_publish_test.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./internal/... ./cmd/...
          skip-cache: true

      # The e2e package needs its build tag and the vendored VictoriaLogs tree (restored above).
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags e2e ./tests/ingestmatrix/... ./tests/e2e/... ./tests/conformance/...
          skip-cache: true

  lint-traces:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: lakehouse-traces
          # The action's restored analysis cache (keyed off the base branch)
          # goes stale when a PR changes go.sum — staticcheck then loses
          # termination facts for a RANDOM subset of packages and emits
          # nondeterministic SA5011 false positives in guarded t.Fatal test
          # code (different files flagged on each run of the same tree).
          # A cold, deterministic run is worth the extra ~1min.
          skip-cache: true

  build-logs:
    needs: deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Build lakehouse-logs
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=${{ github.sha }}" \
            -o bin/lakehouse-logs-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./cmd/lakehouse-logs

  build-traces:
    needs: deps
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Build lakehouse-traces
        working-directory: lakehouse-traces
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=${{ github.sha }}" \
            -o ../bin/lakehouse-traces-${{ matrix.goos }}-${{ matrix.goarch }} \
            .

  docker-logs:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image (logs)
        # Retry: Docker Hub registry pulls from GH runners intermittently time
        # out (dial tcp i/o timeout on the base-image HEAD) — hit twice on
        # 2026-06-10 alone. 3 attempts with backoff; real build errors still
        # fail fast on the last attempt.
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for attempt in 1 2 3; do
            docker build -f Dockerfile.logs \
              --build-arg VERSION=${{ github.sha }} \
              --build-arg VL_VERSION=${{ env.VL_VERSION_LOGS }} \
              -t ghcr.io/${REPO}/lakehouse-logs:${{ github.sha }} . && exit 0
            echo "build attempt ${attempt} failed; retrying in $((attempt*20))s"
            sleep $((attempt*20))
          done
          exit 1

  docker-traces:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image (traces)
        # Retry: Docker Hub registry pulls from GH runners intermittently time
        # out (dial tcp i/o timeout on the base-image HEAD) — hit twice on
        # 2026-06-10 alone. 3 attempts with backoff; real build errors still
        # fail fast on the last attempt.
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          for attempt in 1 2 3; do
            docker build -f Dockerfile.traces \
              --build-arg VERSION=${{ github.sha }} \
              --build-arg VL_VERSION=${{ env.VL_VERSION_LOGS }} \
              --build-arg VL_COMMIT=${{ env.VL_COMMIT_TRACES }} \
              --build-arg VT_VERSION=${{ env.VT_VERSION }} \
              -t ghcr.io/${REPO}/lakehouse-traces:${{ github.sha }} . && exit 0
            echo "build attempt ${attempt} failed; retrying in $((attempt*20))s"
            sleep $((attempt*20))
          done
          exit 1

  security-logs:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Run govulncheck (logs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./internal/... ./cmd/...

  security-traces:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Run govulncheck (traces)
        working-directory: lakehouse-traces
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint Helm chart
        run: |
          helm lint charts/victoria-lakehouse/ --strict

      - name: Render the chart in every mode (opt-in ingest listeners included)
        run: |
          bash charts/victoria-lakehouse/test_templates.sh

  # Benchmark smoke run (informational: nothing gates on the numbers, the
  # registry-backed perf jobs above do that). What it guarantees is that every
  # benchmark still compiles, starts and finishes, and it lists the slowest ones
  # in the job summary.
  #  * -run='^$': the unit tests are NOT run again. This job used to execute
  #    every package's whole test suite (the slow parquets3 tests included)
  #    before its first benchmark, and had no timeout: 86-89 minutes per run.
  #  * -benchtime=1s -count=1: one second per benchmark is enough to prove it
  #    runs; the old 3s x 2 tripled the time for numbers nobody consumes.
  #  * `set -o pipefail` (in `set -euo pipefail`): the old `go test | tee` had
  #    the pipe's status be tee's, which hid a real failure: internal/metrics
  #    benchmarks registered a fixed metric name and panicked on testing's
  #    second b.N pass, so 3 of that package's 4 benchmarks never ran.
  #  * Budget: measured ~15 min for logs (BenchmarkFieldMetadata alone is ~12
  #    min: its 100 ms S3-latency cells are sleeping, not computing, and were
  #    kept as they are) and ~15 s for traces on a 32-thread laptop. The CI
  #    runner is slower, so -timeout=40m / timeout-minutes 45 is ~2x the
  #    logs estimate; traces gets 15m / 20m. gotest_report.py warns at 70% and
  #    fails at 90% of the go -timeout.
  benchmarks-logs:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Run benchmarks (logs)
        run: |
          set -euo pipefail
          start=$SECONDS
          go test -run='^$' -bench=. -benchtime=1s -count=1 -timeout=40m -json ./internal/... |
            python3 scripts/ci/gotest_report.py --budget-seconds 2400 --bench-out bench-logs.txt --title "benchmarks (logs)"
          echo "Benchmark run wall time: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-logs
          path: bench-logs.txt

  # Same shape as benchmarks-logs (see the comment there).
  benchmarks-traces:
    needs: deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: lakehouse-traces/go.mod

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaLogs
            lakehouse-traces/deps/VictoriaTraces
          key: vl-deps-${{ env.VL_VERSION_LOGS }}-${{ env.VL_COMMIT_TRACES }}-${{ env.VT_VERSION }}-${{ hashFiles('patches/**', 'Makefile') }}

      - name: Run benchmarks (traces)
        working-directory: lakehouse-traces
        run: |
          set -euo pipefail
          start=$SECONDS
          go test -run='^$' -bench=. -benchtime=1s -count=1 -timeout=15m -json ./internal/... |
            python3 ../scripts/ci/gotest_report.py --budget-seconds 900 --bench-out bench-traces.txt --title "benchmarks (traces)"
          echo "Benchmark run wall time: $((SECONDS - start))s" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-results-traces
          path: lakehouse-traces/bench-traces.txt
